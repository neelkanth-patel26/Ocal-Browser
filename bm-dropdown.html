<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:;">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <style>
        /* ── Design Tokens ─────────────────────────── */
        :root {
            --accent: #09f0a0;
            --accent-dim: rgba(9, 240, 160, 0.12);
            --accent-glow: rgba(9, 240, 160, 0.25);
            --bg: #181b20;
            --bg-surface: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.16);
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --text-muted: #6b7280;
            --radius: 12px;
            --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ── Light Theme ─────────────────────────── */
        body[data-theme="light"] {
            --bg: #FFFFFF;
            --bg-surface: #F4F4F6;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.14);
            --text-main: #0F172A;
            --text-dim: #475569;
            --text-muted: #94A3B8;
        }

        body[data-theme="light"] .dropdown-container {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06) !important;
        }

        body[data-theme="light"] .favicon-wrap {
            background: rgba(0, 0, 0, 0.04) !important;
            border-color: rgba(0, 0, 0, 0.07) !important;
        }

        body[data-theme="light"] .bm-domain {
            color: #94A3B8;
        }

        body[data-theme="light"] .dropdown-header {
            border-bottom-color: rgba(0, 0, 0, 0.06) !important;
        }

        body[data-theme="light"] .menu-option:hover {
            background: var(--accent-dim) !important;
        }

        body[data-theme="light"] .menu-option:hover .bm-title {
            color: var(--accent) !important;
        }

        body[data-theme="light"] .menu-option:hover .bm-domain {
            color: #475569 !important;
        }

        body[data-theme="light"] .menu-option:hover .nav-arrow {
            color: var(--accent) !important;
        }

        /* ── Base ─────────────────────────── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { overflow: hidden !important; }

        body {
            margin: 0;
            padding: 10px;
            font-family: var(--font);
            background: transparent;
            overflow: hidden !important;
        }

        /* ── Dropdown Container ─────────────────────────── */
        .dropdown-container {
            width: fit-content;
            min-width: 220px;
            max-width: 320px;
            max-height: 420px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding: 5px;
            box-shadow: none !important;
            animation: containerIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Header ─────────────────────────── */
        .dropdown-header {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 10px 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
            user-select: none;
        }

        .header-icon-wrap {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: var(--accent-dim);
            border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon {
            font-size: 9px;
            color: var(--accent) !important;
        }

        .header-label {
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .header-count {
            margin-left: auto;
            font-size: 9.5px;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 100px;
        }

        /* ── Menu Item ─────────────────────────── */
        .menu-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            animation: itemSlideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes itemSlideIn {
            from { opacity: 0; transform: translateX(-6px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .menu-option:hover {
            background: var(--accent-dim);
            border-radius: 8px;
        }

        .menu-option:hover .bm-title {
            color: var(--accent);
        }

        .menu-option:active {
            transform: scale(0.98);
        }

        /* ── Favicon Badge ─────────────────────────── */
        .favicon-wrap {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s ease;
            overflow: hidden;
        }

        .menu-option:hover .favicon-wrap {
            background: var(--accent-dim);
            border-color: color-mix(in srgb, var(--accent) 40%, transparent);
        }

        .favicon-wrap img {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            object-fit: contain;
        }

        .favicon-wrap .favicon-fallback {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
        }

        /* ── Text Content ─────────────────────────── */
        .bm-text {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .bm-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.3;
            font-weight: 700;
            color: var(--text-main);
            font-size: 12px;
            transition: color 0.15s ease;
        }

        .bm-domain {
            font-size: 10px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        .menu-option:hover .bm-domain {
            color: var(--text-dim);
        }

        /* ── Arrow Indicator ─────────────────────────── */
        .nav-arrow {
            font-size: 10px;
            color: var(--text-muted);
            opacity: 0;
            transform: translateX(-4px);
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .menu-option:hover .nav-arrow {
            opacity: 1;
            transform: translateX(0);
            color: var(--accent);
        }

        /* ── Empty State ─────────────────────────── */
        .empty-state {
            padding: 20px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: itemSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .empty-icon-wrap {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
        }

        .empty-state i {
            font-size: 16px;
            color: var(--text-muted);
        }

        .empty-state .empty-title {
            font-size: 12.5px;
            font-weight: 800;
            color: var(--text-main);
        }

        .empty-state .empty-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.5;
            font-weight: 500;
        }

        .kbd {
            display: inline-block;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
        }

        /* ── Scrollbar ─────────────────────────── */
        .dropdown-container::-webkit-scrollbar { width: 4px; }
        .dropdown-container::-webkit-scrollbar-track { background: transparent; }
        .dropdown-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .dropdown-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        body[data-theme="light"] .dropdown-container::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="dropdown-container" id="menu-container"></div>
    <script src="bm-dropdown.js"></script>
</body>
</html>
