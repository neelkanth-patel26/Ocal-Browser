<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:;">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <script src="color-harmonizer.js"></script>
    <script>
        (function () {
            var t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
            var a = localStorage.getItem('ocal-settings-accent');
            if (window.OcalColorHarmonizer) {
                window.OcalColorHarmonizer.applyHarmonizedTheme(a, t);
            }
        })();
    </script>
    <style>
        /* ── Design Tokens matching Home Page ─────────────────────────── */
        :root {
            --accent: #15AC49;
            --accent-dim: rgba(21, 172, 73, 0.12);
            --accent-glow: rgba(21, 172, 73, 0.25);
            --accent-border: rgba(21, 172, 73, 0.3);
            --accent-text: #FFFFFF;
            --bg: #222226;
            --bg-surface: #28282D;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --text-main: #F4F4F5;
            --text-dim: #A1A1AA;
            --text-muted: #71717A;
            --radius: 20px;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        /* ── Light Theme ─────────────────────────── */
        body[data-theme="light"], html[data-theme="light"] {
            --bg: #FFFFFF;
            --bg-surface: #F4F4F6;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.14);
            --text-main: #0F172A;
            --text-dim: #475569;
            --text-muted: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { overflow: hidden !important; }

        body {
            margin: 0;
            padding: 8px;
            font-family: var(--font-main);
            background: transparent;
            overflow: hidden !important;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Dropdown Container ─────────────────────────── */
        .dropdown-container {
            width: fit-content;
            min-width: 240px;
            max-width: 340px;
            max-height: 420px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding: 6px;
            box-shadow: none !important;
            animation: containerIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body[data-theme="light"] .dropdown-container {
            box-shadow: none !important;
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Header ─────────────────────────── */
        .dropdown-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
            user-select: none;
        }

        .header-icon-wrap {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon {
            font-size: 10px;
            color: var(--accent) !important;
        }

        .header-label {
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-main);
            font-family: var(--font-main);
        }

        .header-count {
            margin-left: auto;
            font-size: 10px;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            padding: 1px 7px;
            border-radius: 100px;
        }

        /* ── Menu Item ─────────────────────────── */
        .menu-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 12.5px;
            font-weight: 600;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            animation: itemSlideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
            border: 1px solid transparent;
        }

        @keyframes itemSlideIn {
            from { opacity: 0; transform: translateX(-6px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .menu-option:hover {
            background: var(--accent-dim);
            border-color: var(--accent-border);
            transform: translateX(2px);
        }

        .menu-option:hover .bm-title {
            color: var(--accent);
        }

        .menu-option:active {
            transform: scale(0.98);
        }

        /* ── Favicon Badge ─────────────────────────── */
        .favicon-wrap {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.18s ease;
            overflow: hidden;
        }

        .menu-option:hover .favicon-wrap {
            background: var(--bg);
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .favicon-wrap img {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            object-fit: contain;
        }

        .favicon-wrap .favicon-fallback {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
        }

        /* ── Text Content ─────────────────────────── */
        .bm-text {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .bm-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.3;
            font-weight: 700;
            color: var(--text-main);
            font-size: 12.5px;
            transition: color 0.15s ease;
        }

        .bm-domain {
            font-size: 10px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: var(--font-mono);
            font-weight: 500;
            transition: color 0.15s ease;
        }

        .menu-option:hover .bm-domain {
            color: var(--text-dim);
        }

        /* ── Arrow Indicator ─────────────────────────── */
        .nav-arrow {
            font-size: 10px;
            color: var(--text-muted);
            opacity: 0;
            transform: translateX(-4px);
            transition: all 0.18s ease;
            flex-shrink: 0;
        }

        .menu-option:hover .nav-arrow {
            opacity: 1;
            transform: translateX(0);
            color: var(--accent);
        }

        /* ── Empty State ─────────────────────────── */
        .empty-state {
            padding: 24px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: itemSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .empty-icon-wrap {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
        }

        .empty-state i {
            font-size: 18px;
            color: var(--accent);
        }

        .empty-state .empty-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-main);
        }

        .empty-state .empty-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.5;
            font-weight: 500;
        }

        .kbd {
            display: inline-block;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent);
        }

        /* ── Scrollbar ─────────────────────────── */
        .dropdown-container::-webkit-scrollbar { width: 4px; }
        .dropdown-container::-webkit-scrollbar-track { background: transparent; }
        .dropdown-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .dropdown-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        body[data-theme="light"] .dropdown-container::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body data-theme="dark">
    <script>
        (function () {
            const t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.body.setAttribute('data-theme', t);
            var a = localStorage.getItem('ocal-settings-accent');
            if (window.OcalColorHarmonizer) {
                window.OcalColorHarmonizer.applyHarmonizedTheme(a, t);
            }
        })();
    </script>
    <div class="dropdown-container" id="menu-container"></div>
    <script src="bm-dropdown.js"></script>
</body>
</html>
