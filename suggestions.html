<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://suggestqueries.google.com https://api.github.com https://cdnjs.cloudflare.com https://unpkg.com;">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <style>
        :root {
            --background: #16181D;
            --foreground: #FFFFFF;
            --accent: #15AC49;
            --lime: #D4FC2B;
            --text: #FFFFFF;
            --text-dim: #9CA3AF;
            --hover: #22262F;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 20px;
        }
        
        body[data-theme="light"], body {
            --background: #FFFFFF;
            --foreground: #111111;
            --text: #111111;
            --text-dim: #475569;
            --hover: #F4F4F6;
            --border: rgba(0, 0, 0, 0.06);
        }

        body[data-theme="dark"] {
            --background: #16181D;
            --foreground: #FFFFFF;
            --text: #FFFFFF;
            --text-dim: #9CA3AF;
            --hover: #22262F;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: var(--background);
            border: 1px solid var(--border);
            overflow-y: auto;
            overflow-x: hidden;
            max-height: 100vh;
            position: relative;
            border-radius: var(--radius);
            box-shadow: none !important;
            padding: 6px;
        }

        ::-webkit-scrollbar { display: none; }

        .section-header {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-dim);
            padding: 8px 14px 4px;
        }

        .suggestion-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            cursor: pointer;
            color: var(--text);
            font-size: 13.5px;
            font-weight: 600;
            border-radius: 100px !important;
            transition: all 0.18s ease;
        }

        .suggestion-item:hover,
        .suggestion-item.selected {
            background: #D4FC2B !important;
            color: #111111 !important;
            font-weight: 800;
            transform: translateY(-1px);
        }

        .icon {
            width: 28px;
            height: 28px;
            background: rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-dim);
            border-radius: 50%;
            flex-shrink: 0;
        }

        body[data-theme="dark"] .icon {
            background: rgba(255, 255, 255, 0.06);
            color: #FFFFFF;
        }

        .suggestion-item:hover .icon,
        .suggestion-item.selected .icon {
            background: #111111 !important;
            color: #FFFFFF !important;
        }

        .suggestion-favicon {
            width: 14px;
            height: 14px;
            object-fit: contain;
            border-radius: 3px;
        }

        .text-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .query {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .matched {
            color: var(--accent);
            font-weight: 700;
        }

        .suggestion-item:hover .matched,
        .suggestion-item.selected .matched {
            color: #111111 !important;
        }

        .action-badge {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 100px;
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-dim);
            flex-shrink: 0;
        }

        body[data-theme="dark"] .action-badge {
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
        }

        .suggestion-item:hover .action-badge,
        .suggestion-item.selected .action-badge {
            background: #111111 !important;
            color: #FFFFFF !important;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="section-header" id="section-header" style="display:none;">Search Suggestions</div>
        <ul class="suggestion-list" id="suggestion-list"></ul>
    </div>
    <script src="suggestions.js"></script>
</body>
</html>
