<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">
    <title>Permission Request</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #09f0a0;
            --accent-glow: rgba(9, 240, 160, 0.25);
            --accent-text: #051610;
            --bg-card: rgba(22, 24, 29, 0.96);
            --border-card: rgba(255, 255, 255, 0.1);
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            --btn-block-bg: rgba(255, 255, 255, 0.06);
            --btn-block-border: rgba(255, 255, 255, 0.12);
            --btn-block-hover: rgba(239, 68, 68, 0.15);
            --btn-block-text: #E5E7EB;
            --btn-block-text-hover: #F87171;
            --icon-bg: rgba(9, 240, 160, 0.12);
            --icon-border: rgba(9, 240, 160, 0.3);
            --icon-color: #09f0a0;
        }

        [data-theme="light"], body[data-theme="light"] {
            --bg-card: rgba(255, 255, 255, 0.98);
            --border-card: rgba(0, 0, 0, 0.1);
            --text-primary: #111827;
            --text-secondary: #4B5563;
            --text-muted: #6B7280;
            --btn-block-bg: rgba(0, 0, 0, 0.05);
            --btn-block-border: rgba(0, 0, 0, 0.12);
            --btn-block-hover: rgba(220, 38, 38, 0.1);
            --btn-block-text: #374151;
            --btn-block-text-hover: #DC2626;
            --icon-bg: rgba(5, 143, 96, 0.12);
            --icon-border: rgba(5, 143, 96, 0.3);
            --icon-color: #058f60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        body {
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .permission-card {
            width: 100%;
            height: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: none !important;
            animation: permPop 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }

        [data-theme="dark"] .permission-card,
        [data-theme="light"] .permission-card {
            box-shadow: none !important;
        }

        @keyframes permPop {
            0% { opacity: 0; transform: translateY(-8px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .perm-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .perm-origin-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 270px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        [data-theme="light"] .perm-origin-badge {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .perm-origin-badge i {
            font-size: 11px;
            color: var(--accent);
            flex-shrink: 0;
        }

        .perm-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        .perm-close-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] .perm-close-btn:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        .perm-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            margin-bottom: 8px;
        }

        .perm-icon-box {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: var(--icon-bg);
            border: 1px solid var(--icon-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--icon-color);
            flex-shrink: 0;
            box-shadow: none !important;
        }

        .perm-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .perm-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .perm-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.3;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .perm-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-block {
            background: var(--btn-block-bg);
            border: 1px solid var(--btn-block-border);
            color: var(--btn-block-text);
        }

        .btn-block:hover {
            background: var(--btn-block-hover);
            color: var(--btn-block-text-hover);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .btn-allow {
            background: var(--accent);
            border: 1px solid transparent;
            color: var(--accent-text);
            box-shadow: none !important;
        }

        .btn-allow:hover {
            transform: translateY(-1px);
            box-shadow: none !important;
            filter: brightness(1.08);
        }

        .btn-allow:active, .btn-block:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="permission-card">
        <div class="perm-header">
            <div class="perm-origin-badge" id="origin-badge">
                <i class="fas fa-lock" id="origin-icon"></i>
                <span id="origin-text">example.com</span>
            </div>
            <button class="perm-close-btn" id="close-btn" title="Dismiss">
                <i class="fas fa-xmark"></i>
            </button>
        </div>

        <div class="perm-content">
            <div class="perm-icon-box" id="icon-box">
                <i class="fas fa-video" id="perm-icon"></i>
            </div>
            <div class="perm-details">
                <div class="perm-title" id="perm-title">Camera Access</div>
                <div class="perm-desc" id="perm-desc">This site wants to use your camera</div>
            </div>
        </div>

        <div class="perm-actions">
            <button class="btn btn-block" id="block-btn">
                <i class="fas fa-ban"></i> Block
            </button>
            <button class="btn btn-allow" id="allow-btn">
                <i class="fas fa-check"></i> Allow
            </button>
        </div>
    </div>

    <script>
        let currentRequestId = null;

        function applyTheme(themeMode, accentColor) {
            const isLight = themeMode === 'light';
            document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
            document.body.setAttribute('data-theme', isLight ? 'light' : 'dark');
            if (accentColor) {
                document.documentElement.style.setProperty('--accent', accentColor);
                document.documentElement.style.setProperty('--accent-glow', isLight ? 'rgba(5, 143, 96, 0.25)' : 'rgba(9, 240, 160, 0.25)');
                document.documentElement.style.setProperty('--icon-color', accentColor);
            }
        }

        if (window.electronAPI && window.electronAPI.on) {
            window.electronAPI.on('show-permission-prompt', (event, data) => {
                if (!data) return;
                currentRequestId = data.id;

                applyTheme(data.themeMode, data.accentColor);

                const originText = document.getElementById('origin-text');
                const permTitle = document.getElementById('perm-title');
                const permDesc = document.getElementById('perm-desc');
                const permIcon = document.getElementById('perm-icon');

                if (originText) originText.textContent = data.hostname || data.origin;
                if (permTitle) permTitle.textContent = `${data.permLabel || 'Permission'} Request`;
                if (permDesc) permDesc.textContent = `${data.hostname || data.origin} ${data.permDesc || 'wants permission'}`;
                if (permIcon && data.permIcon) {
                    permIcon.className = 'fas ' + data.permIcon;
                }
            });
        }

        document.getElementById('allow-btn').onclick = () => {
            if (currentRequestId && window.electronAPI && window.electronAPI.send) {
                window.electronAPI.send('permission-response', { id: currentRequestId, decision: 'allow' });
            }
        };

        document.getElementById('block-btn').onclick = () => {
            if (currentRequestId && window.electronAPI && window.electronAPI.send) {
                window.electronAPI.send('permission-response', { id: currentRequestId, decision: 'block' });
            }
        };

        document.getElementById('close-btn').onclick = () => {
            if (currentRequestId && window.electronAPI && window.electronAPI.send) {
                window.electronAPI.send('permission-response', { id: currentRequestId, decision: 'dismiss' });
            }
        };
    </script>
</body>
</html>
