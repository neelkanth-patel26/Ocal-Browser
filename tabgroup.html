<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://suggestqueries.google.com https://api.github.com https://cdnjs.cloudflare.com https://unpkg.com;">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --panel-bg: #151719;
            --panel-border: rgba(255, 255, 255, 0.08);
            --input-bg: #1C1F24;
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: rgba(255, 255, 255, 0.16);
            --text: #E8EAED;
            --text-dim: #8B8F96;
            --text-muted: #5F636A;
            --hover-bg: rgba(255, 255, 255, 0.06);
            --danger: #EF4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --danger-hover: rgba(239, 68, 68, 0.18);
            --group-color: #a855f7;
            --radius: 12px;
        }

        body[data-theme="light"] {
            --panel-bg: #FFFFFF;
            --panel-border: rgba(0, 0, 0, 0.08);
            --input-bg: #F8F9FA;
            --input-border: rgba(0, 0, 0, 0.1);
            --input-focus: rgba(0, 0, 0, 0.14);
            --text: #111827;
            --text-dim: #6B7280;
            --text-muted: #9CA3AF;
            --hover-bg: rgba(0, 0, 0, 0.04);
            --danger: #DC2626;
            --danger-bg: rgba(220, 38, 38, 0.08);
            --danger-hover: rgba(220, 38, 38, 0.14);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            background: transparent;
            width: 100vw; height: 100vh;
            overflow: hidden; pointer-events: none;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .backdrop {
            position: absolute; inset: 0; pointer-events: auto;
            background: transparent; z-index: 1;
        }

        /* ── Panel ── */
        .popup-panel {
            position: absolute; z-index: 2; pointer-events: auto;
            background: var(--panel-bg);
            padding: 14px;
            border-radius: var(--radius);
            border: 1px solid var(--panel-border);
            width: 240px;
            display: none;
            flex-direction: column;
            gap: 0;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }

        body[data-theme="light"] .popup-panel {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* ── Name Input Row ── */
        .name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .group-dot-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--group-color);
            flex-shrink: 0;
            box-shadow: 0 0 10px color-mix(in srgb, var(--group-color) 50%, transparent);
            transition: background 0.2s, box-shadow 0.2s;
        }

        .name-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text);
            padding: 7px 10px;
            border-radius: 8px;
            outline: none;
            font-size: 12.5px;
            font-weight: 600;
            font-family: inherit;
            transition: border-color 0.2s, background 0.2s;
            width: 100%;
        }

        .name-input::placeholder {
            color: var(--text-muted);
            font-weight: 500;
        }

        .name-input:focus {
            border-color: var(--group-color);
            background: var(--hover-bg);
        }

        /* ── Color Palette ── */
        .color-section {
            margin-bottom: 12px;
        }

        .section-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .color-grid {
            display: flex;
            gap: 0;
            justify-content: space-between;
            padding: 0;
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2.5px solid transparent;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .color-dot:hover {
            transform: scale(1.15);
        }

        .color-dot.active {
            border-color: var(--text) !important;
            transform: scale(1.1);
        }

        .color-dot.active::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #FFFFFF;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: var(--panel-border);
            margin: 2px 0 10px 0;
        }

        /* ── Actions ── */
        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 7px 0;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid transparent;
            font-family: inherit;
            letter-spacing: 0.2px;
        }

        .btn i { font-size: 10px; }

        .btn-ungroup {
            background: var(--hover-bg);
            color: var(--text);
            border-color: var(--panel-border);
        }

        .btn-ungroup:hover {
            background: var(--input-bg);
            border-color: var(--input-focus);
            color: var(--group-color);
        }

        .btn-close {
            background: var(--danger-bg);
            color: var(--danger);
            border-color: transparent;
        }

        .btn-close:hover {
            background: var(--danger-hover);
            border-color: var(--danger);
        }
    </style>
</head>
<body>
    <div class="backdrop" id="backdrop"></div>
    <div class="popup-panel" id="popup-panel">

        <!-- Name Row -->
        <div class="name-row">
            <div class="group-dot-indicator" id="group-dot"></div>
            <input type="text" class="name-input" id="group-name" placeholder="Group name…" spellcheck="false" autocomplete="off">
        </div>

        <!-- Color Palette -->
        <div class="color-section">
            <span class="section-label">Color</span>
            <div class="color-grid" id="color-grid">
                <div class="color-dot" data-color="#EF4444" style="background: #EF4444;"></div>
                <div class="color-dot" data-color="#F97316" style="background: #F97316;"></div>
                <div class="color-dot" data-color="#EAB308" style="background: #EAB308;"></div>
                <div class="color-dot" data-color="#22C55E" style="background: #22C55E;"></div>
                <div class="color-dot" data-color="#06B6D4" style="background: #06B6D4;"></div>
                <div class="color-dot" data-color="#3B82F6" style="background: #3B82F6;"></div>
                <div class="color-dot" data-color="#A855F7" style="background: #A855F7;"></div>
                <div class="color-dot" data-color="#EC4899" style="background: #EC4899;"></div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Actions -->
        <div class="actions">
            <div class="btn btn-ungroup" id="ungroup-btn">
                <i class="fas fa-object-ungroup"></i> Ungroup
            </div>
            <div class="btn btn-close" id="close-btn">
                <i class="fas fa-xmark"></i> Close
            </div>
        </div>
    </div>

    <script src="tabgroup.js"></script>
</body>
</html>
