<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self' https: wss: http://127.0.0.1:11434 http://localhost:11434 http://127.0.0.1:7860 http://localhost:7860; img-src 'self' https: data: blob:; worker-src 'self' blob: https://cdnjs.cloudflare.com;">
    <title>Ocal AI Assistant</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.5/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.3);
            --lime: #D4FC2B;
            --chrome: #0D0E11;
            --border: rgba(255, 255, 255, 0.08);
            --border-heavy: rgba(255, 255, 255, 0.15);
            --text: #FFFFFF;
            --text-dim: #9CA3AF;
            --text-muted: #6B7280;
            --panel-bg: #0D0E11;
            --card-bg: #16181D;
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: #16181D;
            --input-border: rgba(255, 255, 255, 0.1);
            --radius: 16px;
            --title-font: 'Plus Jakarta Sans', sans-serif;
            --font: 'Plus Jakarta Sans', sans-serif;
            --mono: 'Space Mono', monospace;
        }

        body[data-theme="light"] {
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.2);
            --chrome: #EDEDF0;
            --panel-bg: #EDEDF0;
            --card-bg: #FFFFFF;
            --card-border: rgba(0, 0, 0, 0.06);
            --input-bg: #FFFFFF;
            --input-border: rgba(0, 0, 0, 0.08);
            --text: #111111;
            --text-dim: #475569;
            --text-muted: #94A3B8;
            --border: rgba(0, 0, 0, 0.06);
            --border-heavy: rgba(0, 0, 0, 0.12);
        }

        /* Reset & Base Elements */
        *, *::before, *::after { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
        }
        
        body {
            background: transparent;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: var(--font);
            display: flex;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* Resize Handle */
        #resize-handle {
            width: 4px;
            height: 100%;
            cursor: ew-resize;
            background: transparent;
            z-index: 100;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        #resize-handle:hover, #resize-handle.active {
            background: var(--accent);
        }

        /* Panel Container matched with topbar color */
        .ai-panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 20px !important;
            margin: 8px 8px 8px 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            opacity: 0;
            visibility: hidden;
            will-change: transform, opacity;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .ai-panel.animate-in {
            visibility: visible;
            animation: slide-right-in 0.45s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        body.closing .ai-panel {
            visibility: visible;
            animation: slide-right-out 0.35s cubic-bezier(0.19, 1, 0.22, 1) forwards !important;
        }

        @keyframes slide-right-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slide-right-out {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Header Styling matching topbar */
        .ai-header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--panel-bg);
            z-index: 10;
        }

        .ai-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-logo {
            width: 32px;
            height: 32px;
            background: #D4FC2B;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111111;
            font-size: 14px;
            border-radius: 10px;
            font-weight: 800;
        }

        body[data-theme="light"] .ai-logo {
            background: #15AC49;
            color: #FFFFFF;
        }

        .ai-title-text h1 {
            font-family: var(--title-font);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.2px;
            color: var(--text);
        }

        .ai-controls {
            display: flex;
            gap: 6px;
        }

        .control-btn {
            width: 30px;
            height: 30px;
            border-radius: 50% !important;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 11px;
        }

        .control-btn:hover {
            background: #D4FC2B !important;
            border-color: #D4FC2B !important;
            color: #111111 !important;
            transform: scale(1.08);
        }

        /* Chat View Panel */
        .ai-chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            z-index: 10;
            background: var(--panel-bg);
        }

        .messages-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .messages-scroll::-webkit-scrollbar { width: 4px; }
        .messages-scroll::-webkit-scrollbar-track { background: transparent; }
        .messages-scroll::-webkit-scrollbar-thumb { 
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 10px; 
        }

        .msg-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 90%;
            animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-group.user { align-self: flex-end; }
        .msg-group.ai { align-self: flex-start; }

        .msg-bubble {
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.55;
            position: relative;
        }

        .user .msg-bubble {
            background: rgba(212, 252, 43, 0.15) !important;
            border: 1px solid rgba(212, 252, 43, 0.3) !important;
            border-radius: 16px 16px 4px 16px !important;
            color: #FFFFFF !important;
            font-weight: 600;
        }

        body[data-theme="light"] .user .msg-bubble {
            background: rgba(21, 172, 73, 0.12) !important;
            border-color: rgba(21, 172, 73, 0.25) !important;
            color: #111111 !important;
        }

        .ai .msg-bubble {
            background: #16181D !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 16px 16px 16px 4px !important;
            color: #F3F4F6 !important;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2) !important;
        }

        body[data-theme="light"] .ai .msg-bubble {
            background: #FFFFFF !important;
            border-color: rgba(0, 0, 0, 0.06) !important;
            color: #111111 !important;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03) !important;
        }

        /* Typography for Chat Markdown */
        .msg-content p { margin-bottom: 8px; }
        .msg-content p:last-child { margin-bottom: 0; }
        
        .msg-content h1, .msg-content h2, .msg-content h3 {
            font-family: var(--title-font);
            font-size: 14px; margin: 12px 0 8px; color: var(--text);
            font-weight: 700;
        }

        .msg-content code {
            font-family: var(--mono) !important;
            font-size: 11.5px;
        }
        
        .msg-content :not(pre) > code {
            background: rgba(212, 252, 43, 0.15);
            padding: 2px 6px;
            border-radius: 6px !important;
            color: #D4FC2B;
            font-weight: 700;
        }

        /* Thinking State */
        .thinking {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            background: #16181D;
            border-radius: 14px !important;
            width: fit-content;
            border: 1px solid var(--border);
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #D4FC2B;
            border-radius: 50% !important;
            animation: pulse-ring 1.2s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.4; }
        }

        /* Input Zone matching topbar color */
        .ai-input-wrapper {
            padding: 12px 14px 16px 14px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--panel-bg);
            z-index: 10;
        }

        .quick-tools {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 0;
        }
        .quick-tools::-webkit-scrollbar { display: none; }

        /* Floating Pill Chips */
        .tool-chip {
            padding: 6px 12px;
            background: #16181D !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 100px !important;
            font-family: var(--title-font);
            font-size: 11px;
            font-weight: 700;
            color: #FFFFFF !important;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        body[data-theme="light"] .tool-chip {
            background: #FFFFFF !important;
            color: #111111 !important;
            border-color: rgba(0, 0, 0, 0.08) !important;
        }

        .tool-chip i {
            color: #D4FC2B !important;
            font-size: 10px;
        }

        body[data-theme="light"] .tool-chip i {
            color: #15AC49 !important;
        }

        .tool-chip:hover {
            background: #D4FC2B !important;
            border-color: #D4FC2B !important;
            color: #111111 !important;
            transform: translateY(-1px);
        }

        .tool-chip:hover i {
            color: #111111 !important;
        }

        /* Capsule Input Bar */
        .input-container {
            background: #16181D !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 100px !important;
            padding: 4px 6px 4px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        body[data-theme="light"] .input-container {
            background: #FFFFFF !important;
            border-color: rgba(0, 0, 0, 0.08) !important;
        }

        .input-container:focus-within {
            border-color: #D4FC2B !important;
            box-shadow: 0 0 12px rgba(212, 252, 43, 0.25) !important;
        }

        #ai-query {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #FFFFFF !important;
            font-weight: 500;
            padding: 6px 2px;
            font-family: var(--font);
            font-size: 13px;
            resize: none;
            max-height: 120px;
            min-height: 20px;
            line-height: 1.4;
        }

        body[data-theme="light"] #ai-query {
            color: #111111 !important;
        }

        #ai-query::placeholder {
            color: #9CA3AF;
        }

        /* Send Button */
        .send-btn {
            width: 34px;
            height: 34px;
            border-radius: 50% !important;
            border: none;
            background: #D4FC2B !important;
            color: #111111 !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            font-size: 12px;
        }

        body[data-theme="light"] .send-btn {
            background: #15AC49 !important;
            color: #FFFFFF !important;
        }

        .send-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(212, 252, 43, 0.5) !important;
        }
    </style>
</head>
<body data-theme="dark">
    <script>
        (function () {
            const t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.body.setAttribute('data-theme', t);
        })();
    </script>
    <div id="resize-handle"></div>
    <div class="ai-panel">
        <div class="ai-header">
            <div class="ai-brand">
                <div class="ai-logo"><i class="fas fa-bolt"></i></div>
                <div class="ai-title-text" style="display: flex; align-items: center; gap: 8px;">
                    <h1>Ocal Assistant</h1>
                    <span id="active-model-badge" style="display: none; font-size: 9px; font-weight: 800; background: rgba(212, 252, 43, 0.15); border: 1px solid #D4FC2B; padding: 2px 8px; border-radius: 100px; color: #D4FC2B; white-space: nowrap;">Local: gemma-4</span>
                </div>
            </div>
            <div class="ai-controls">
                <button class="control-btn" id="clear-chat" title="Clear Chat"><i class="fas fa-trash-can"></i></button>
                <button class="control-btn" id="close-ai" title="Close"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <div class="ai-chat-view">
            <div id="ai-chat-messages" class="messages-scroll">
                <div class="msg-group ai">
                    <div class="msg-bubble">
                        <div class="msg-content">
                            Hello! I am your <b>Ocal AI</b>. I can summarize pages, change your browser settings, show diagnostics, and help you find what you're looking for.
                        </div>
                    </div>
                </div>
            </div>

            <div class="ai-input-wrapper">
                <div class="quick-tools">
                    <button class="tool-chip" id="tool-summarize"><i class="fas fa-file-lines"></i> Summarize</button>
                    <button class="tool-chip" id="tool-status"><i class="fas fa-gauge"></i> Status</button>
                    <button class="tool-chip" id="tool-settings"><i class="fas fa-cog"></i> My Settings</button>
                    <button class="tool-chip" id="tool-bookmarks"><i class="fas fa-bookmark"></i> Bookmarks</button>
                    <button class="tool-chip" id="tool-email"><i class="fas fa-paper-plane"></i> Email</button>
                    <button class="tool-chip" id="tool-help"><i class="fas fa-question-circle"></i> Help</button>
                </div>
                <div id="ai-file-preview" style="display: none; align-items: center; gap: 8px; background: var(--card-bg); border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius); font-size: 12.5px; color: var(--text-dim); margin-bottom: 8px;">
                    <i id="ai-file-icon" class="fas fa-file-lines"></i>
                    <span id="ai-file-name" style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500;">filename.txt</span>
                    <button id="ai-file-remove" class="control-btn" style="width: 20px; height: 20px; min-width: 20px; font-size: 10px; margin: 0; display: flex; align-items: center; justify-content: center;"><i class="fas fa-times"></i></button>
                </div>
                <div class="input-container">
                    <input type="file" id="ai-file-input" style="display: none;">
                    <button id="ai-attach-btn" class="control-btn" title="Attach file" style="width: 30px; height: 30px; flex-shrink: 0;"><i class="fas fa-paperclip"></i></button>
                    <textarea id="ai-query" placeholder="How can I assist you?" rows="1"></textarea>
                    <button id="ai-send" class="send-btn"><i class="fas fa-arrow-up"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="ai-sidebar.js"></script>
</body>
</html>
