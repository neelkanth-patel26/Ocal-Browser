<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self' https: wss: http://127.0.0.1:11434 http://localhost:11434 http://127.0.0.1:7860 http://localhost:7860; img-src 'self' https: data: blob:; worker-src 'self' blob: https://cdnjs.cloudflare.com;">
    <title>Ocal AI Assistant</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.5/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.3);
            --lime: #D4FC2B;
            --chrome: #0D0E11;
            --border: rgba(255, 255, 255, 0.08);
            --border-heavy: rgba(255, 255, 255, 0.15);
            --text: #FFFFFF;
            --text-dim: #9CA3AF;
            --text-muted: #6B7280;
            --panel-bg: #0D0E11;
            --card-bg: #16181D;
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: #16181D;
            --input-border: rgba(255, 255, 255, 0.1);
            --radius: 16px;
            --title-font: 'Plus Jakarta Sans', sans-serif;
            --font: 'Plus Jakarta Sans', sans-serif;
            --mono: 'Space Mono', monospace;
        }

        body[data-theme="light"] {
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.2);
            --chrome: #EDEDF0;
            --panel-bg: #EDEDF0;
            --card-bg: #FFFFFF;
            --card-border: rgba(0, 0, 0, 0.06);
            --input-bg: #FFFFFF;
            --input-border: rgba(0, 0, 0, 0.08);
            --text: #111111;
            --text-dim: #475569;
            --text-muted: #94A3B8;
            --border: rgba(0, 0, 0, 0.06);
            --border-heavy: rgba(0, 0, 0, 0.12);
        }

        /* Reset & Base Elements */
        *, *::before, *::after { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
        }
        
        body {
            background: transparent;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: var(--font);
            display: flex;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* Resize Handle */
        #resize-handle {
            width: 4px;
            height: 100%;
            cursor: ew-resize;
            background: transparent;
            z-index: 100;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        #resize-handle:hover, #resize-handle.active {
            background: var(--accent);
        }

        /* Panel Container matched with topbar color */
        .ai-panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 20px !important;
            margin: 8px 8px 8px 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            opacity: 0;
            visibility: hidden;
            will-change: transform, opacity;
            box-shadow: none !important;
        }

        .ai-panel.animate-in {
            visibility: visible;
            animation: slide-right-in 0.45s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        body.closing .ai-panel {
            visibility: visible;
            animation: slide-right-out 0.35s cubic-bezier(0.19, 1, 0.22, 1) forwards !important;
        }

        @keyframes slide-right-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slide-right-out {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Header Styling matching topbar */
        .ai-header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--panel-bg);
            z-index: 10;
        }

        .ai-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-logo,
        body[data-theme="light"] .ai-logo {
            width: 32px;
            height: 32px;
            background: var(--accent) !important;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-text, #111111) !important;
            font-size: 14px;
            border-radius: 10px;
            font-weight: 800;
        }

        .ai-title-text h1 {
            font-family: var(--title-font);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.2px;
            color: var(--text);
        }

        .model-badge,
        body[data-theme="light"] .model-badge {
            font-size: 9.5px;
            font-weight: 800;
            background: var(--accent-dim) !important;
            border: 1px solid var(--accent-border) !important;
            padding: 2px 8px;
            border-radius: 100px;
            color: var(--accent) !important;
            white-space: nowrap;
        }

        .ai-controls {
            display: flex;
            gap: 6px;
        }

        .control-btn {
            width: 30px;
            height: 30px;
            border-radius: 50% !important;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 11px;
        }

        .control-btn:hover {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            color: var(--accent-text, #111111) !important;
            transform: scale(1.08);
        }

        /* Chat View Panel */
        .ai-chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            z-index: 10;
            background: var(--panel-bg);
        }

        .messages-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 28px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .messages-scroll::-webkit-scrollbar { width: 4px; }
        .messages-scroll::-webkit-scrollbar-track { background: transparent; }
        .messages-scroll::-webkit-scrollbar-thumb { 
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 10px; 
        }

        .msg-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 100%;
            min-width: 0;
            animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-group.user { align-self: flex-end; }
        .msg-group.ai { align-self: flex-start; }

        /* File Attachment Card inside Chat Messages */
        .msg-file-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.12);
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 700;
            width: fit-content;
            max-width: 100%;
            box-sizing: border-box;
        }

        body[data-theme="dark"] .msg-file-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
        }

        .msg-file-chip i {
            font-size: 16px;
            color: #15AC49;
        }

        body[data-theme="dark"] .msg-file-chip i {
            color: #D4FC2B;
        }

        .msg-file-chip .chip-name {
            word-break: break-all;
        }

        .msg-file-chip .chip-tag {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
        }

        body[data-theme="dark"] .msg-file-chip .chip-tag {
            background: rgba(255, 255, 255, 0.14);
        }

        .msg-file-img-preview {
            max-width: 220px;
            max-height: 160px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 8px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            display: block;
        }

        body[data-theme="dark"] .msg-file-img-preview {
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Agent Status Step Pills */
        .agent-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 11.5px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            margin-bottom: 4px;
            transition: all 0.2s ease;
            width: fit-content;
            max-width: 100%;
            box-sizing: border-box;
        }

        body[data-theme="light"] .agent-action {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: #475569;
        }

        .agent-action.clickable {
            cursor: pointer;
            background: rgba(212, 252, 43, 0.12);
            border-color: rgba(212, 252, 43, 0.3);
            color: #D4FC2B;
        }

        body[data-theme="light"] .agent-action.clickable {
            background: rgba(21, 172, 73, 0.1);
            border-color: rgba(21, 172, 73, 0.25);
            color: #15AC49;
        }

        .agent-action.clickable:hover {
            transform: translateY(-1px);
            background: #D4FC2B;
            color: #111111;
        }

        body[data-theme="light"] .agent-action.clickable:hover {
            background: #15AC49;
            color: #FFFFFF;
        }

        .msg-bubble {
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.55;
            position: relative;
            max-width: 100%;
            min-width: 0;
            word-break: break-word;
            overflow-wrap: anywhere;
            box-sizing: border-box;
        }

        .user .msg-bubble {
            background: rgba(212, 252, 43, 0.15) !important;
            border: 1px solid rgba(212, 252, 43, 0.3) !important;
            border-radius: 16px 16px 4px 16px !important;
            color: #FFFFFF !important;
            font-weight: 600;
        }

        body[data-theme="light"] .user .msg-bubble {
            background: rgba(21, 172, 73, 0.12) !important;
            border-color: rgba(21, 172, 73, 0.25) !important;
            color: #111111 !important;
        }

        .ai .msg-bubble {
            background: #16181D !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 16px 16px 16px 4px !important;
            color: #F3F4F6 !important;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2) !important;
        }

        body[data-theme="light"] .ai .msg-bubble {
            background: #FFFFFF !important;
            border-color: rgba(0, 0, 0, 0.06) !important;
            color: #111111 !important;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03) !important;
        }

        .msg-content {
            max-width: 100%;
            min-width: 0;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* Typography for Chat Markdown */
        .msg-content p {
            margin-bottom: 8px;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .msg-content p:last-child { margin-bottom: 0; }
        
        .msg-content h1, .msg-content h2, .msg-content h3 {
            font-family: var(--title-font);
            font-size: 14px; margin: 12px 0 8px; color: var(--text);
            font-weight: 700;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .msg-content ul, .msg-content ol {
            margin: 8px 0 8px 18px;
            padding: 0;
        }

        .msg-content li {
            margin-bottom: 4px;
            line-height: 1.5;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .msg-content a {
            color: #D4FC2B !important;
            text-decoration: none !important;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(212, 252, 43, 0.12);
            border: 1px solid rgba(212, 252, 43, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            word-break: break-all;
            max-width: 100%;
            box-sizing: border-box;
        }

        body[data-theme="light"] .msg-content a {
            color: #15AC49 !important;
            background: rgba(21, 172, 73, 0.08) !important;
            border: 1px solid rgba(21, 172, 73, 0.2) !important;
        }

        .msg-content a:hover {
            background: #D4FC2B !important;
            color: #111111 !important;
            border-color: #D4FC2B !important;
        }

        body[data-theme="light"] .msg-content a:hover {
            background: #15AC49 !important;
            color: #FFFFFF !important;
            border-color: #15AC49 !important;
        }

        /* Code & Pre Blocks Word Wrapping and Containment */
        .msg-content pre {
            max-width: 100% !important;
            white-space: pre-wrap !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
            overflow-x: auto !important;
            background: #0D0E11 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 10px !important;
            padding: 10px 12px !important;
            margin: 8px 0 !important;
            box-sizing: border-box !important;
        }

        body[data-theme="light"] .msg-content pre {
            background: #F8FAFC !important;
            border: 1px solid rgba(0, 0, 0, 0.08) !important;
        }

        .msg-content code {
            font-family: var(--mono) !important;
            font-size: 11.5px !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
        }

        .msg-content pre code {
            white-space: pre-wrap !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
            display: block !important;
            max-width: 100% !important;
        }
        
        .msg-content :not(pre) > code {
            background: rgba(212, 252, 43, 0.15);
            padding: 2px 6px;
            border-radius: 6px !important;
            color: #D4FC2B;
            font-weight: 700;
            word-break: break-word !important;
        }

        body[data-theme="light"] .msg-content :not(pre) > code {
            background: rgba(21, 172, 73, 0.12);
            color: #15AC49;
        }

        .msg-content table {
            max-width: 100% !important;
            width: 100% !important;
            display: block !important;
            overflow-x: auto !important;
            word-break: break-word !important;
        }

        /* Collapsible Details (Document Excerpt & Thinking Process) */
        .msg-content details {
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 10px !important;
            background: rgba(0, 0, 0, 0.2) !important;
            margin: 10px 0 !important;
            overflow: hidden !important;
            transition: all 0.2s ease;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }

        body[data-theme="light"] .msg-content details {
            border-color: rgba(0, 0, 0, 0.08) !important;
            background: rgba(0, 0, 0, 0.03) !important;
        }

        .msg-content summary {
            padding: 8px 12px !important;
            font-size: 11.5px !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            user-select: none !important;
            color: var(--text) !important;
            display: flex !important;
            align-items: center !important;
            gap: 6px !important;
            transition: color 0.2s ease, background 0.2s ease;
            outline: none !important;
        }

        .msg-content summary:hover {
            color: #D4FC2B !important;
            background: rgba(212, 252, 43, 0.08) !important;
        }

        body[data-theme="light"] .msg-content summary:hover {
            color: #15AC49 !important;
            background: rgba(21, 172, 73, 0.08) !important;
        }

        .msg-content details[open] summary {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        body[data-theme="light"] .msg-content details[open] summary {
            border-bottom-color: rgba(0, 0, 0, 0.06) !important;
        }

        .msg-content details .details-body {
            padding: 10px 12px !important;
            box-sizing: border-box !important;
        }

        .msg-content details pre {
            margin: 0 !important;
            border: none !important;
            background: transparent !important;
            padding: 0 !important;
        }

        /* Thinking State */
        .thinking {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            background: #16181D;
            border-radius: 14px !important;
            width: fit-content;
            border: 1px solid var(--border);
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #D4FC2B;
            border-radius: 50% !important;
            animation: pulse-ring 1.2s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.4; }
        }

        /* Input Zone matching topbar color */
        .ai-input-wrapper {
            padding: 12px 14px 16px 14px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--panel-bg);
            z-index: 10;
        }

        .quick-tools {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 0;
        }
        .quick-tools::-webkit-scrollbar { display: none; }

        /* Floating Pill Chips */
        .tool-chip {
            padding: 6px 12px;
            background: #16181D !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 100px !important;
            font-family: var(--title-font);
            font-size: 11px;
            font-weight: 700;
            color: #FFFFFF !important;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        body[data-theme="light"] .tool-chip {
            background: #FFFFFF !important;
            color: #111111 !important;
            border-color: rgba(0, 0, 0, 0.08) !important;
        }

        .tool-chip i,
        body[data-theme="light"] .tool-chip i {
            color: var(--accent) !important;
            font-size: 10px;
        }

        .tool-chip:hover,
        body[data-theme="light"] .tool-chip:hover {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            color: var(--accent-text, #111111) !important;
            transform: translateY(-1px);
        }

        .tool-chip:hover i,
        body[data-theme="light"] .tool-chip:hover i {
            color: var(--accent-text, #111111) !important;
        }

        /* Capsule Input Bar */
        .input-container {
            background: #16181D !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 100px !important;
            padding: 4px 6px 4px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        body[data-theme="light"] .input-container {
            background: #FFFFFF !important;
            border-color: rgba(0, 0, 0, 0.08) !important;
        }

        .input-container:focus-within,
        body[data-theme="light"] .input-container:focus-within {
            border-color: var(--accent) !important;
            box-shadow: 0 0 12px var(--accent-glow) !important;
        }

        #ai-query {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #FFFFFF !important;
            font-weight: 500;
            padding: 6px 2px;
            font-family: var(--font);
            font-size: 13px;
            resize: none;
            max-height: 120px;
            min-height: 20px;
            line-height: 1.4;
        }

        body[data-theme="light"] #ai-query {
            color: #111111 !important;
        }

        #ai-query::placeholder {
            color: #9CA3AF;
        }

        /* Send Button */
        .send-btn,
        body[data-theme="light"] .send-btn {
            width: 34px;
            height: 34px;
            border-radius: 50% !important;
            border: none;
            background: var(--accent) !important;
            color: var(--accent-text, #111111) !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            font-size: 12px;
        }

        /* Navigation Tab Switcher */
        .ai-nav-bar {
            display: flex;
            gap: 4px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid var(--border);
        }

        body[data-theme="light"] .ai-nav-bar {
            background: rgba(0, 0, 0, 0.03);
        }

        .ai-nav-tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-dim);
            font-size: 11.5px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ai-nav-tab:hover {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .ai-nav-tab.active {
            background: var(--accent) !important;
            color: var(--accent-text, #111111) !important;
            border-color: var(--accent) !important;
            font-weight: 800;
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 100px;
            font-size: 10.5px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status-badge.on {
            background: rgba(9, 240, 160, 0.14);
            color: #09f0a0;
            border: 1px solid rgba(9, 240, 160, 0.3);
        }

        .status-badge.off {
            background: rgba(244, 63, 94, 0.14);
            color: #f43f5e;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        /* High-End Markdown Table Styling */
        .msg-content table {
            width: 100% !important;
            border-collapse: separate !important;
            border-spacing: 0 !important;
            margin: 10px 0 !important;
            border-radius: 12px !important;
            overflow: hidden !important;
            border: 1px solid var(--border) !important;
            background: rgba(255, 255, 255, 0.02) !important;
            font-size: 12px !important;
            display: table !important;
        }

        body[data-theme="light"] .msg-content table {
            background: rgba(0, 0, 0, 0.02) !important;
        }

        .msg-content th {
            background: var(--accent-dim) !important;
            color: var(--accent) !important;
            font-weight: 800 !important;
            text-align: left !important;
            padding: 8px 12px !important;
            border-bottom: 1px solid var(--border) !important;
            font-size: 10.5px !important;
            text-transform: uppercase !important;
            letter-spacing: 0.5px !important;
        }

        .msg-content td {
            padding: 8px 12px !important;
            border-bottom: 1px solid var(--border) !important;
            color: var(--text) !important;
            font-weight: 500 !important;
        }

        .msg-content tr:last-child td {
            border-bottom: none !important;
        }

        /* Image Studio Styles */
        .ai-image-studio-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            z-index: 10;
            background: var(--panel-bg);
        }

        .studio-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .studio-card {
            background: var(--card-bg, #1A1D24);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .studio-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .studio-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .studio-field label {
            font-size: 10.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .studio-select {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 10px;
            color: var(--text);
            font-size: 12px;
            font-family: var(--font);
            outline: none;
            cursor: pointer;
        }

        .studio-select option {
            background: var(--panel-bg);
            color: var(--text);
        }

        .studio-textarea {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            color: var(--text);
            font-size: 12px;
            font-family: var(--font);
            outline: none;
            resize: vertical;
            min-height: 70px;
        }

        .preset-chips-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .preset-chip {
            padding: 5px 10px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 10.5px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        body[data-theme="light"] .preset-chip {
            background: rgba(0, 0, 0, 0.04);
        }

        .preset-chip:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent-border);
        }

        .studio-submit-btn {
            padding: 10px 16px;
            border-radius: 12px;
            background: var(--accent);
            color: var(--accent-text, #111111);
            border: none;
            font-size: 12.5px;
            font-weight: 800;
            font-family: var(--font);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            margin-top: 4px;
        }

        .studio-submit-btn:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .studio-preview-card {
            background: var(--card-bg, #1A1D24);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .studio-status {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .studio-img-wrap {
            width: 100%;
            max-height: 360px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .studio-result-img {
            width: 100%;
            max-height: 360px;
            object-fit: contain;
            display: block;
        }

        .studio-actions {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .studio-action-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .studio-action-btn:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent-border);
        }
    </style>
</head>
<body data-theme="dark">
    <script>
        (function () {
            const t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.body.setAttribute('data-theme', t);
        })();
    </script>
    <div id="resize-handle"></div>
    <div class="ai-panel">
        <div class="ai-header">
            <div class="ai-brand">
                <div class="ai-logo"><i class="fas fa-bolt"></i></div>
                <div class="ai-title-text" style="display: flex; align-items: center; gap: 8px;">
                    <h1>Ocal Assistant</h1>
                    <span id="active-model-badge" class="model-badge" style="display: none;">Local: gemma-4</span>
                </div>
            </div>
            <div class="ai-controls">
                <button class="control-btn" id="clear-chat" title="Clear Chat"><i class="fas fa-trash-can"></i></button>
                <button class="control-btn" id="close-ai" title="Close"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <!-- Navigation Tab Switcher -->
        <div class="ai-nav-bar">
            <button class="ai-nav-tab active" id="nav-tab-chat">
                <i class="fas fa-comments"></i> <span>Chat</span>
            </button>
            <button class="ai-nav-tab" id="nav-tab-image">
                <i class="fas fa-wand-magic-sparkles"></i> <span>Image Studio</span>
            </button>
        </div>

        <!-- Chat View -->
        <div class="ai-chat-view" id="ai-chat-view">
            <div id="ai-chat-messages" class="messages-scroll">
                <div class="msg-group ai">
                    <div class="msg-bubble">
                        <div class="msg-content">
                            Hello! I am your <b>Ocal AI</b>. I can summarize pages, change your browser settings, generate artwork, and help you find what you're looking for.
                        </div>
                    </div>
                </div>
            </div>

            <div class="ai-input-wrapper">
                <div class="quick-tools">
                    <button class="tool-chip" id="tool-summarize"><i class="fas fa-file-lines"></i> Summarize</button>
                    <button class="tool-chip" id="tool-status"><i class="fas fa-chart-pie"></i> Status</button>
                    <button class="tool-chip" id="tool-settings"><i class="fas fa-sliders"></i> My Settings</button>
                    <button class="tool-chip" id="tool-bookmarks"><i class="fas fa-bookmark"></i> Bookmarks</button>
                    <button class="tool-chip" id="tool-email"><i class="fas fa-paper-plane"></i> Email</button>
                    <button class="tool-chip" id="tool-help"><i class="fas fa-circle-question"></i> Help</button>
                </div>
                <div id="ai-file-preview" style="display: none; align-items: center; gap: 8px; background: var(--card-bg); border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius); font-size: 12.5px; color: var(--text-dim); margin-bottom: 8px;">
                    <i id="ai-file-icon" class="fas fa-file-lines"></i>
                    <span id="ai-file-name" style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500;">filename.txt</span>
                    <button id="ai-file-remove" class="control-btn" style="width: 20px; height: 20px; min-width: 20px; font-size: 10px; margin: 0; display: flex; align-items: center; justify-content: center;"><i class="fas fa-times"></i></button>
                </div>
                <div class="input-container">
                    <input type="file" id="ai-file-input" style="display: none;">
                    <button id="ai-attach-btn" class="control-btn" title="Attach file" style="width: 30px; height: 30px; flex-shrink: 0;"><i class="fas fa-paperclip"></i></button>
                    <textarea id="ai-query" placeholder="How can I assist you?" rows="1"></textarea>
                    <button id="ai-send" class="send-btn"><i class="fas fa-arrow-up"></i></button>
                </div>
            </div>
        </div>

        <!-- Image Studio View -->
        <div class="ai-image-studio-view" id="ai-image-studio-view" style="display: none;">
            <div class="studio-scroll-area">
                <div class="studio-card">
                    <div class="studio-card-header">
                        <i class="fas fa-palette"></i> <span>AI Image Studio</span>
                    </div>

                    <!-- Engine Selector -->
                    <div class="studio-field">
                        <label><i class="fas fa-microchip"></i> Generation Engine</label>
                        <select id="studio-engine-select" class="studio-select">
                            <option value="local">🤖 Local Model / SD (Stable Diffusion & Pollinations)</option>
                            <option value="openai">⚡ ChatGPT / DALL-E 3 API</option>
                            <option value="gemini">🔮 Gemini / Google Imagen API</option>
                        </select>
                    </div>

                    <!-- Prompt Input -->
                    <div class="studio-field">
                        <label><i class="fas fa-font"></i> Image Prompt</label>
                        <textarea id="studio-prompt-input" class="studio-textarea" placeholder="Describe the image you want to generate (e.g. A futuristic glass city with glowing neon lights, 8k resolution, cinematic lighting)..." rows="3"></textarea>
                    </div>

                    <!-- Style Preset Chips -->
                    <div class="studio-field">
                        <label><i class="fas fa-wand-magic-sparkles"></i> Style Presets</label>
                        <div class="preset-chips-grid">
                            <button class="preset-chip" data-style="Photorealistic, 8k resolution, ultra detailed, cinematic lighting"><i class="fas fa-camera"></i> Realistic</button>
                            <button class="preset-chip" data-style="Anime style, vibrant colors, detailed lineart, 4k"><i class="fas fa-paint-brush"></i> Anime</button>
                            <button class="preset-chip" data-style="Cyberpunk aesthetics, glowing neon, rain, 8k"><i class="fas fa-bolt"></i> Cyberpunk</button>
                            <button class="preset-chip" data-style="3D digital render, Octane render, smooth shading, vibrant"><i class="fas fa-cube"></i> 3D Render</button>
                            <button class="preset-chip" data-style="Classic oil painting, dramatic lighting, rich textures"><i class="fas fa-palette"></i> Oil Painting</button>
                        </div>
                    </div>

                    <button id="studio-generate-btn" class="studio-submit-btn">
                        <i class="fas fa-wand-magic-sparkles"></i> <span>Generate Image</span>
                    </button>
                </div>

                <!-- Preview Display Box -->
                <div class="studio-preview-card" id="studio-preview-card" style="display: none;">
                    <div id="studio-status-indicator" class="studio-status">
                        <i class="fas fa-spinner fa-spin"></i> <span id="studio-status-text">Synthesizing image...</span>
                    </div>
                    <div class="studio-img-wrap" id="studio-img-wrap">
                        <img id="studio-result-img" class="studio-result-img" alt="Generated AI Artwork">
                    </div>
                    <div class="studio-actions" id="studio-actions" style="display: none;">
                        <button id="studio-download-btn" class="studio-action-btn"><i class="fas fa-download"></i> Save Image</button>
                        <button id="studio-copy-btn" class="studio-action-btn"><i class="fas fa-copy"></i> Copy Link</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="ai-sidebar.js"></script>
</body>
</html>
