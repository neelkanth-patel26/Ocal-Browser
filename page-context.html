<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <style>
        :root {
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --accent-dim: rgba(139, 92, 246, 0.12);
            --bg-menu: #18181B;
            --border-menu: rgba(255, 255, 255, 0.09);
            --text-main: #F4F4F5;
            --text-dim: #9CA3AF;
            --hover-bg: rgba(255, 255, 255, 0.06);
            --kbd-bg: rgba(255, 255, 255, 0.06);
            --kbd-border: rgba(255, 255, 255, 0.1);
            --radius: 14px;
        }

        /* ── Light Mode Matching Home Page ── */
        body[data-theme="light"] {
            --bg-menu: #EDEDF0;
            --border-menu: rgba(0, 0, 0, 0.08);
            --text-main: #111827;
            --text-dim: #6B7280;
            --hover-bg: rgba(0, 0, 0, 0.05);
            --kbd-bg: rgba(0, 0, 0, 0.05);
            --kbd-border: rgba(0, 0, 0, 0.08);
            --accent-dim: rgba(139, 92, 246, 0.1);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 6px;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            overflow: hidden;
            display: flex;
        }

        /* ── Modern Shadowless Context Menu (Matches Home Bento Aesthetic) ── */
        .custom-context-menu {
            background: var(--bg-menu);
            border: 1px solid var(--border-menu);
            border-radius: var(--radius);
            padding: 6px;
            min-width: 215px;
            max-width: 320px;
            box-shadow: none !important;
            -webkit-box-shadow: none !important;
            filter: none !important;
            animation: menu-entry 0.14s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 2px;
            position: relative;
        }

        /* Never show borders/background when empty */
        .custom-context-menu:empty {
            display: none !important;
        }

        @keyframes menu-entry {
            from {
                opacity: 0;
                transform: translateY(-5px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .menu-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.12s cubic-bezier(0.16, 1, 0.3, 1), 
                        color 0.12s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.1s ease;
            position: relative;
            white-space: nowrap;
        }

        .menu-option:hover {
            background: var(--hover-bg);
            color: var(--text-main);
        }

        .menu-icon-wrap {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            flex-shrink: 0;
            transition: all 0.14s ease;
        }

        .menu-icon-wrap i {
            font-size: 13px;
            color: var(--text-dim);
            transition: color 0.12s ease, transform 0.12s ease;
        }

        .menu-option:hover .menu-icon-wrap i {
            color: var(--accent);
            transform: scale(1.1);
        }

        .menu-option .menu-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: -0.015em;
        }

        .menu-option .menu-shortcut {
            margin-left: 14px;
            display: inline-flex;
            align-items: center;
        }

        .menu-option .menu-shortcut kbd {
            font-family: 'Space Mono', 'Plus Jakarta Sans', monospace;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 5px;
            background: var(--kbd-bg);
            border: 1px solid var(--kbd-border);
            color: var(--text-dim);
            letter-spacing: 0.02em;
            transition: border-color 0.12s ease, color 0.12s ease;
        }

        .menu-option:hover .menu-shortcut kbd {
            border-color: color-mix(in srgb, var(--accent) 35%, transparent);
            color: var(--accent);
        }

        /* ── Special Accent Highlight for Ocal AI ── */
        .menu-option.ai-special {
            color: var(--accent);
            font-weight: 600;
            background: var(--accent-dim);
        }

        .menu-option.ai-special .menu-icon-wrap i {
            color: var(--accent);
        }

        .menu-option.ai-special:hover {
            background: var(--accent);
            color: #FFFFFF;
        }

        .menu-option.ai-special:hover .menu-icon-wrap i {
            color: #FFFFFF;
            transform: rotate(12deg) scale(1.15);
        }

        .menu-option.disabled {
            opacity: 0.38;
            cursor: default;
            pointer-events: none;
        }

        .menu-separator {
            height: 1px;
            background: var(--border-menu);
            margin: 4px 6px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="page-context-container" class="custom-context-menu"></div>

    <script>
        function getModeAccent(color, isLight) {
            if (!color) return isLight ? '#058f60' : '#09f0a0';
            if (!isLight) return color;
            const hex = color.toLowerCase();
            if (hex === '#09f0a0' || hex === '#00ffaa' || hex.includes('f0a0')) return '#058f60';
            if (hex === '#ff007f' || hex === '#ff00aa' || hex.includes('ff007') || hex.includes('ff00a')) return '#d81b60';
            if (hex === '#00e5ff' || hex === '#00ffff' || hex.includes('00e5') || hex.includes('00f0')) return '#0288d1';
            if (hex === '#ff9100' || hex === '#ffaa00' || hex.includes('ff91') || hex.includes('ffaa')) return '#d97706';
            if (hex === '#8b5cf6' || hex === '#a855f7' || hex === '#9333ea' || hex.includes('8b5c') || hex.includes('a855')) return '#6d28d9';
            if (hex === '#ff4d4d' || hex === '#ff3333' || hex.includes('ff4d') || hex.includes('ff33')) return '#dc2626';
            if (hex === '#ffffff' || hex === '#f4f4f5' || hex === '#e8e8e8' || hex.includes('fff')) return '#0f172a';
            return color;
        }

        function hexToRgb(hex) {
            if (!hex) return { r: 139, g: 92, b: 246 };
            let c = hex.replace('#', '').trim();
            if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
            if (c.length !== 6) return { r: 139, g: 92, b: 246 };
            const num = parseInt(c, 16);
            if (isNaN(num)) return { r: 139, g: 92, b: 246 };
            return {
                r: (num >> 16) & 255,
                g: (num >> 8) & 255,
                b: num & 255
            };
        }

        function applyThemeSettings(s) {
            if (!s) return;
            const isLight = s.themeMode === 'light';
            document.body.setAttribute('data-theme', isLight ? 'light' : 'dark');

            const rawColor = (isLight ? (s.accentColorLight || s.accentColor) : (s.accentColorDark || s.accentColor)) || s.accentColor || (isLight ? '#058f60' : '#09f0a0');
            const accent = getModeAccent(rawColor, isLight);
            const { r, g, b } = hexToRgb(accent);

            document.documentElement.style.setProperty('--accent', accent);
            document.documentElement.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.25)`);
            document.documentElement.style.setProperty('--accent-dim', `rgba(${r}, ${g}, ${b}, ${isLight ? '0.12' : '0.16'})`);
            document.documentElement.style.setProperty('--hover-bg', `rgba(${r}, ${g}, ${b}, ${isLight ? '0.09' : '0.14'})`);

            if (isLight) {
                document.documentElement.style.setProperty('--bg-menu', '#FFFFFF');
                document.documentElement.style.setProperty('--border-menu', 'rgba(0, 0, 0, 0.08)');
                document.documentElement.style.setProperty('--text-main', '#18181B');
                document.documentElement.style.setProperty('--text-dim', '#71717A');
                document.documentElement.style.setProperty('--kbd-bg', 'rgba(0, 0, 0, 0.05)');
                document.documentElement.style.setProperty('--kbd-border', 'rgba(0, 0, 0, 0.08)');
            } else {
                document.documentElement.style.setProperty('--bg-menu', '#18181B');
                document.documentElement.style.setProperty('--border-menu', 'rgba(255, 255, 255, 0.1)');
                document.documentElement.style.setProperty('--text-main', '#F4F4F5');
                document.documentElement.style.setProperty('--text-dim', '#A1A1AA');
                document.documentElement.style.setProperty('--kbd-bg', 'rgba(255, 255, 255, 0.06)');
                document.documentElement.style.setProperty('--kbd-border', 'rgba(255, 255, 255, 0.1)');
            }
        }

        window.applyThemeSettings = applyThemeSettings;

        window.electronAPI?.invoke?.('get-settings').then(s => applyThemeSettings(s)).catch(() => {});
        window.electronAPI?.on?.('settings-changed', (e, s) => applyThemeSettings(s));
    </script>
    <script src="page-context.js"></script>
</body>
</html>
