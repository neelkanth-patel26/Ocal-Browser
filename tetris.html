<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:;">
    <title>Ocal Grid | Glass Tetris</title>
    <!-- ANTI-FLASH: must be FIRST in head -->
    <script>
        (function () {
            var t = localStorage.getItem('ocal-settings-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
            if (t === 'dark') {
                document.documentElement.style.background = '#0D0E11';
                document.documentElement.style.colorScheme = 'dark';
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    
    <style>
        :root {
            --bg: #0D0E11;
            --card-bg: #16181D;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #D4FC2B;
            --accent-glow: rgba(212, 252, 43, 0.3);
            --text-main: #F0F2F5;
            --text-dim: #A0A5B1;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        body[data-theme="light"] {
            --bg: #F0F2F5;
            --card-bg: #FFFFFF;
            --border: rgba(0, 0, 0, 0.08);
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.25);
            --text-main: #16181D;
            --text-dim: #626773;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .header-bar {
            position: absolute;
            top: 24px;
            left: 32px;
            right: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-title i {
            color: var(--accent);
        }

        .back-btn {
            padding: 8px 18px;
            border-radius: 100px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .game-layout {
            display: flex;
            align-items: flex-start;
            gap: 28px;
            padding: 24px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
            position: relative;
            transition: background 0.3s ease;
        }

        .side-box {
            width: 140px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
        }

        body[data-theme="light"] .stat-card {
            background: rgba(0, 0, 0, 0.03);
        }

        .stat-lbl {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .stat-val {
            font-family: var(--font-mono);
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
        }

        .canvas-container {
            position: relative;
            background: #090A0D;
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        body[data-theme="light"] .canvas-container {
            background: #F8F9FA;
        }

        canvas#gameCanvas {
            display: block;
        }

        .preview-canvas {
            display: block;
            margin: 0 auto;
        }

        .controls-card {
            margin-top: auto;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.8;
        }

        body[data-theme="light"] .controls-card {
            background: rgba(0, 0, 0, 0.03);
        }

        .key-tag {
            padding: 1px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 10px;
        }

        body[data-theme="light"] .key-tag {
            background: rgba(0, 0, 0, 0.05);
        }

        /* Overlay Modals */
        .overlay-modal {
            position: absolute;
            inset: 0;
            background: rgba(9, 10, 13, 0.94);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 100;
            border-radius: 28px;
            transition: opacity 0.25s ease;
        }

        body[data-theme="light"] .overlay-modal {
            background: rgba(255, 255, 255, 0.95);
            color: #16181D;
        }

        .modal-title-text {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
        }

        body[data-theme="light"] .modal-title-text {
            color: #16181D !important;
        }

        .modal-sub-text {
            font-size: 13px;
            color: var(--text-dim);
        }

        body[data-theme="light"] .modal-sub-text {
            color: #626773 !important;
        }

        .modal-btn {
            padding: 12px 28px;
            border-radius: 100px;
            background: var(--accent);
            color: #000000;
            font-size: 13px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        body[data-theme="light"] .modal-btn {
            color: #FFFFFF;
        }

        .modal-btn:hover {
            transform: scale(1.04);
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="brand-title">
            <i class="fas fa-cubes"></i> Ocal Grid (Glass Tetris)
        </div>
        <a href="games.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Games Hub
        </a>
    </div>

    <div class="game-layout">
        <!-- Left Panel: Stats -->
        <div class="side-box">
            <div class="stat-card">
                <div class="stat-lbl">HOLD PIECE</div>
                <canvas id="holdCanvas" class="preview-canvas" width="100" height="70"></canvas>
            </div>
            <div class="stat-card">
                <div class="stat-lbl">SCORE</div>
                <div class="stat-val" id="score">00000</div>
            </div>
            <div class="stat-card">
                <div class="stat-lbl">LINES</div>
                <div class="stat-val" id="lines">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-lbl">LEVEL</div>
                <div class="stat-val" id="level">1</div>
            </div>
        </div>

        <!-- Center: Main Grid -->
        <div class="canvas-container">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
        </div>

        <!-- Right Panel: Preview & Controls -->
        <div class="side-box">
            <div class="stat-card">
                <div class="stat-lbl">NEXT PIECE</div>
                <canvas id="nextCanvas" class="preview-canvas" width="100" height="70"></canvas>
            </div>

            <div class="controls-card">
                <div><span class="key-tag">←</span> <span class="key-tag">→</span> Move</div>
                <div><span class="key-tag">↑</span> Rotate</div>
                <div><span class="key-tag">↓</span> Soft Drop</div>
                <div><span class="key-tag">Space</span> Hard Drop</div>
                <div><span class="key-tag">C</span> Hold Piece</div>
            </div>
        </div>

        <!-- Start Overlay -->
        <div class="overlay-modal" id="startOverlay">
            <div class="modal-title-text">OCAL GRID</div>
            <div class="modal-sub-text">High-fidelity neon glass Tetris engine</div>
            <button class="modal-btn" onclick="startGame()">
                <i class="fas fa-play"></i> START GAME
            </button>
        </div>

        <!-- Game Over Overlay -->
        <div class="overlay-modal" id="gameOverOverlay" style="display: none;">
            <div class="modal-title-text">GAME OVER</div>
            <div style="font-size: 16px; font-family: var(--font-mono); color: var(--accent);" id="finalScore">SCORE: 0</div>
            <button class="modal-btn" onclick="startGame()">
                <i class="fas fa-rotate-right"></i> PLAY AGAIN
            </button>
        </div>
    </div>

    <script src="tetris.js"></script>
</body>
</html>
