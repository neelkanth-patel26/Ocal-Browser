<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdnjs.cloudflare.com https://unpkg.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https: https://suggestqueries.google.com https://api.github.com https://cdnjs.cloudflare.com https://unpkg.com; frame-src 'self' https://docs.google.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocal Documents</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/fonts/geist-fonts.css">
    <style>
        :root {
            --bg: #F4F5F7;
            --surface: #FFFFFF;
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.25);
            --accent-dim: rgba(21, 172, 73, 0.08);
            --accent-border: #15AC49;
            --lime: #D4FC2B;
            --text: #111111;
            --text-dim: #64748B;
            --text-muted: #9CA3AF;
            --border: rgba(0, 0, 0, 0.07);
            --toolbar-bg: rgba(255, 255, 255, 0.92);
            --toolbar-border: rgba(0, 0, 0, 0.08);
            --btn-hover: #F0F1F4;
            --sidebar-w: 280px;
            --radius: 20px;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'Geist Mono', monospace;
        }

        [data-theme="dark"] {
            --bg: #0E0F12;
            --surface: #16181D;
            --text: #FFFFFF;
            --text-dim: #9CA3AF;
            --border: rgba(255, 255, 255, 0.08);
            --toolbar-bg: rgba(22, 24, 29, 0.92);
            --toolbar-border: rgba(255, 255, 255, 0.08);
            --btn-hover: #22262F;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: var(--font-main); 
            background: var(--bg); 
            color: var(--text);
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Top Header App Bar ── */
        .pdf-app-bar {
            height: 56px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 500; flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }

        .app-bar-left {
            display: flex; align-items: center; gap: 12px;
        }

        .doc-identity-badge {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 14px; border-radius: 100px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
        }

        body[data-theme="dark"] .doc-identity-badge {
            background: rgba(255, 255, 255, 0.04);
        }

        .doc-icon-wrap {
            color: var(--accent, #15AC49); font-size: 15px; display: flex; align-items: center;
        }

        .doc-title-text {
            font-size: 13px; font-weight: 800; color: var(--text);
            max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ── Center Floating Pill Toolbar ── */
        .toolbar {
            background: var(--toolbar-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--toolbar-border);
            padding: 5px 10px; border-radius: 100px !important;
            display: flex; align-items: center; gap: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .tool-group { display: flex; align-items: center; gap: 4px; padding: 0 2px; }
        .tool-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; opacity: 0.6; }

        .btn {
            background: transparent; border: 1px solid transparent;
            color: var(--text-dim); width: 34px; height: 34px; border-radius: 50% !important;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); font-size: 13px;
            font-family: var(--font-main); outline: none;
        }
        .btn:hover { background: var(--btn-hover); color: var(--text); border-color: var(--border); }
        .btn.active { 
            background: var(--accent); color: #FFFFFF !important; 
            border-color: var(--accent);
            box-shadow: 0 2px 10px var(--accent-glow);
        }
        .btn.primary { 
            background: var(--accent); color: #FFFFFF !important;
            width: auto; padding: 0 16px; height: 36px; gap: 8px; font-weight: 800; font-size: 12px;
            letter-spacing: 0.2px; border: 1px solid var(--accent);
            border-radius: 100px !important;
            box-shadow: 0 4px 14px var(--accent-glow);
            transition: all 0.2s ease;
        }
        .btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px var(--accent-glow);
            filter: brightness(1.05);
        }

        .color-well {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid #FFFFFF;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .color-well:hover { transform: scale(1.1); }
        
        .page-num-jump {
            background: rgba(0,0,0,0.04); border: 1px solid var(--border);
            border-radius: 100px !important; padding: 0 10px; height: 34px;
            display: flex; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 700; color: var(--text-dim);
        }
        body[data-theme="dark"] .page-num-jump {
            background: rgba(255,255,255,0.05);
        }
        .page-num-jump input {
            background: transparent; border: none; color: var(--text);
            width: 30px; text-align: center; font-weight: 800; font-family: var(--font-mono);
            outline: none; font-size: 12px;
        }

        .zoom-label { 
            font-size: 11px; font-weight: 800; min-width: 48px; 
            text-align: center; color: var(--text); font-family: var(--font-mono);
        }

        /* ── Main Workspace Body ── */
        .workspace-body {
            flex: 1; display: flex; position: relative; overflow: hidden;
        }

        /* ── Sidebar ── */
        #sidebar {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            height: 100%;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), min-width 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s;
            z-index: 400; flex-shrink: 0;
            overflow: hidden;
        }
        #sidebar.collapsed { 
            width: 0; min-width: 0;
            opacity: 0;
            border-right: none;
            pointer-events: none;
        }
        
        .sidebar-header {
            padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .sidebar-title { 
            font-family: var(--font-main); font-weight: 800; font-size: 12px; 
            letter-spacing: 1px; text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
            color: var(--text-dim);
        }

        #thumbnails {
            flex: 1; overflow-y: auto; padding: 12px;
            display: grid; grid-template-columns: 1fr 1fr;
            grid-auto-rows: min-content;
            gap: 10px;
            scrollbar-width: thin;
        }
        
        .thumb-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .thumb {
            width: 100%; border-radius: 6px; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden; aspect-ratio: 1 / 1.414;
            background: #FFFFFF;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        body[data-theme="dark"] .thumb {
            background: #1E2028;
        }
        .thumb:hover { 
            border-color: var(--accent); 
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .thumb.active { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 2px var(--accent-glow) !important;
        }
        .thumb canvas { width: 100%; height: 100%; object-fit: contain; }
        .thumb-num { 
            font-size: 9.5px; font-weight: 700; font-family: var(--font-mono); 
            color: var(--text-dim);
        }

        /* ── Viewport ── */
        main {
            flex: 1; height: 100%; 
            position: relative; display: flex; flex-direction: column;
            overflow: hidden; background: var(--bg);
        }

        #viewport {
            flex: 1; overflow: auto;
            position: relative; padding: 40px 0 60px;
            display: flex; flex-direction: column; align-items: center;
            gap: 32px;
            background: var(--bg);
            scrollbar-width: thin;
        }
        
        /* ── Custom Compact Scrollbars ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
            background: transparent;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }
        body[data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
        }

        #page-container-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 32px;
            width: 100%;
        }
        
        .page-wrapper {
            position: relative;
            background: #FFFFFF; border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        body[data-theme="dark"] .page-wrapper {
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        }
        .page-wrapper canvas { display: block; max-width: 100%; }
        
        /* ── Chroma Palette Popover ── */
        #chroma-card {
            display: none; position: fixed; z-index: 1000; top: 68px; left: 50%; 
            transform: translateX(-50%); background: var(--surface);
            border: 1px solid var(--border); border-radius: 22px; 
            padding: 16px; width: 220px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            animation: chromaPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes chromaPop {
            from { opacity: 0; transform: translate(-50%, -10px) scale(0.98); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        #search-input {
            background: rgba(0,0,0,0.04); border: 1px solid var(--border); 
            border-radius: 100px !important; padding: 6px 14px; 
            color: var(--text); font-size: 12px; outline: none; width: 130px; 
            transition: all 0.25s cubic-bezier(0.16,1,0.3,1); font-family: var(--font-main);
        }
        body[data-theme="dark"] #search-input {
            background: rgba(255,255,255,0.05);
        }
        #search-input:focus { border-color: var(--accent); width: 180px; }

        @media print {
            .pdf-app-bar, #sidebar, .sidebar-toggle, #chroma-card, #floating-input-overlay, .sidebar-header {
                display: none !important;
            }
            body, main, #viewport { 
                background: white !important;
                color: black !important;
                height: auto !important;
                overflow: visible !important;
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .page-wrapper {
                box-shadow: none !important;
                border: 1px solid #eee !important;
                page-break-after: always;
                margin: 0 0 10px 0 !important;
            }
            canvas { max-width: 100% !important; height: auto !important; }
        }
    </style>
</head>
<body data-theme="dark">
    <script>
        (function () {
            const t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.body.setAttribute('data-theme', t);
        })();
    </script>

    <div id="fallback-viewport"></div>
    
    <!-- Top Header App Bar -->
    <header class="pdf-app-bar">
        <div class="app-bar-left">
            <button class="btn" id="show-sidebar" title="Toggle Navigation Sidebar">
                <i class="fas fa-bars"></i>
            </button>
            <div class="doc-identity-badge">
                <div class="doc-icon-wrap"><i class="fas fa-file-pdf"></i></div>
                <span class="doc-title-text" id="doc-title">Ocal Document</span>
            </div>
        </div>

        <!-- Center Floating Toolbar -->
        <div class="toolbar">
            <!-- Navigation Group -->
            <div class="tool-group">
                <button class="btn" id="prev-btn" title="Previous Page"><i class="fas fa-chevron-up"></i></button>
                <div class="page-num-jump">
                    <input type="text" id="page-num" value="1">
                    <span style="opacity:0.3;">/</span>
                    <span id="page-count">0</span>
                </div>
                <button class="btn" id="next-btn" title="Next Page"><i class="fas fa-chevron-down"></i></button>
            </div>
            
            <div class="tool-sep"></div>

            <!-- Annotation Tools -->
            <div class="tool-group">
                <button class="btn active" id="tool-hand" title="Pan Hand Tool"><i class="fas fa-hand"></i></button>
                <button class="btn" id="tool-pen" title="Draw Pen"><i class="fas fa-pen"></i></button>
                <button class="btn" id="tool-highlight" title="Highlighter"><i class="fas fa-highlighter"></i></button>
                <button class="btn" id="tool-text" title="Text Note"><i class="fas fa-font"></i></button>
                <button class="btn" id="tool-eraser" title="Eraser"><i class="fas fa-eraser"></i></button>
                <div class="color-well" id="color-well-btn" title="Color Swatch"></div>
            </div>

            <div class="tool-sep"></div>

            <!-- Zoom & Rotate Controls -->
            <div class="tool-group">
                <button class="btn" id="zoom-out" title="Zoom Out"><i class="fas fa-minus"></i></button>
                <div class="zoom-label" id="zoom-val">100%</div>
                <button class="btn" id="zoom-in" title="Zoom In"><i class="fas fa-plus"></i></button>
                <button class="btn" id="rotate-btn" title="Rotate Document"><i class="fas fa-rotate"></i></button>
            </div>

            <div class="tool-sep"></div>

            <!-- Search Group -->
            <div class="tool-group">
                <button class="btn" id="tool-search" title="Search Text"><i class="fas fa-magnifying-glass"></i></button>
                <div id="search-box" style="display:none; align-items:center; gap:4px; margin-left:6px;">
                    <input type="text" id="search-input" placeholder="Find text...">
                    <button class="btn" id="search-prev" style="width:24px; height:24px; font-size:10px;"><i class="fas fa-chevron-up"></i></button>
                    <button class="btn" id="search-next" style="width:24px; height:24px; font-size:10px;"><i class="fas fa-chevron-down"></i></button>
                    <span id="search-count" style="font-size:10px; font-weight:800; color:var(--text-dim); font-family:var(--font-mono); margin-left:4px; min-width:24px; opacity:0.6;">0/0</span>
                </div>
            </div>

            <div class="tool-sep"></div>

            <!-- Theme, Print & Export Actions -->
            <div class="tool-group">
                <button class="btn" id="theme-btn" title="Toggle Dark/Light Theme"><i class="fas fa-circle-half-stroke"></i></button>
                <button class="btn" id="print-btn" title="Print Document"><i class="fas fa-print"></i></button>
            </div>
        </div>

        <div class="app-bar-right">
            <button class="btn primary" id="download-btn" title="Export Annotated PDF">
                <i class="fas fa-download"></i>
                <span>Save</span>
            </button>
        </div>
    </header>

    <!-- Main Document Workspace Body -->
    <div class="workspace-body">
        <!-- Collapsible Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    <i class="fas fa-list-ol" style="color:var(--accent);"></i>
                    <span>Thumbnails</span>
                </div>
                <button class="btn" id="hide-sidebar" title="Hide Sidebar"><i class="fas fa-xmark"></i></button>
            </div>
            <div id="thumbnails"></div>
        </aside>

        <!-- Viewport Workspace -->
        <main>
            <div id="chroma-card">
                <div style="font-family:var(--font-mono); font-weight:800; font-size:9px; color:var(--text-dim); margin-bottom:12px; letter-spacing:1px; text-transform:uppercase;">Color Palette</div>
                <div id="chroma-grid" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:16px;"></div>
                <div style="border-top:1px solid var(--border); padding-top:12px;">
                    <input type="text" id="chroma-hex" placeholder="#HEX" style="background:transparent; border:none; color:var(--text); font-family:var(--font-mono); font-weight:700; font-size:12px; outline:none; width:100%;">
                </div>
            </div>

            <div id="viewport">
                <div id="page-container-wrapper"></div>
            </div>

            <!-- Floating Text Overlay -->
            <div id="floating-input-overlay" style="display:none; position:fixed; z-index:1000; pointer-events:auto;">
                <input type="text" id="floating-text-input" placeholder="Type a note & press enter..." 
                       style="background:var(--surface); color:var(--text); border:1px solid var(--accent); border-radius: 100px; padding:10px 20px; font-family:var(--font-main); font-size:13px; font-weight:600; outline:none; box-shadow:0 10px 30px rgba(0,0,0,0.15); min-width:240px;">
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="pdf-viewer.js"></script>
</body>
</html>
