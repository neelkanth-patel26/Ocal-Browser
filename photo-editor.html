<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; img-src 'self' data: https: blob: file:; connect-src 'self' https: http: file:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocal Photo Studio & Viewer</title>
    <!-- ANTI-FLASH: must be FIRST in head, before any stylesheet -->
    <script>
        (function () {
            var t = localStorage.getItem('ocal-settings-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
            if (t === 'dark') {
                document.documentElement.style.background = '#0D0E11';
                document.documentElement.style.colorScheme = 'dark';
            } else {
                document.documentElement.style.background = '#EDEDF0';
                document.documentElement.style.colorScheme = 'light';
            }
            var a = localStorage.getItem('ocal-settings-accent');
            if (a) document.documentElement.style.setProperty('--accent', a);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <style>
        /* ── Reset & Variables ────────────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        :root {
            --bg: #EDEDF0;
            --stage-bg: #E4E5E9;
            --panel-bg: #FFFFFF;
            --card-bg: #FFFFFF;
            --sp-card-white: #FFFFFF;
            --chrome-border: rgba(0, 0, 0, 0.06);
            --chrome-border-subtle: rgba(0, 0, 0, 0.035);
            --text: #111111;
            --text-dim: #555860;
            --text-muted: #8E929C;
            --accent: #15AC49;
            --accent-dim: rgba(21, 172, 73, 0.10);
            --accent-glow: rgba(21, 172, 73, 0.22);
            --accent-text: #111111;
            --accent-gradient: linear-gradient(135deg, #15AC49 0%, #09F0A0 100%);
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Space Mono', monospace;
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.03);
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.035), 0 2px 8px rgba(0, 0, 0, 0.015);
            --radius-pill: 100px;
            --radius-card: 24px;
            --radius-sub: 16px;
            --slider-track: rgba(0, 0, 0, 0.06);
            --hud-bg: rgba(255, 255, 255, 0.92);
            --hud-border: rgba(0, 0, 0, 0.07);
        }

        html[data-theme="dark"],
        body[data-theme="dark"] {
            --bg: #0D0E11;
            --stage-bg: #121418;
            --panel-bg: #16181D;
            --card-bg: #1B1D23;
            --sp-card-white: #1B1D23;
            --chrome-border: rgba(255, 255, 255, 0.08);
            --chrome-border-subtle: rgba(255, 255, 255, 0.04);
            --text: #FFFFFF;
            --text-dim: #9CA3AF;
            --text-muted: #6B7280;
            --accent: #09F0A0;
            --accent-dim: rgba(9, 240, 160, 0.12);
            --accent-glow: rgba(9, 240, 160, 0.25);
            --accent-text: #0D0E11;
            --accent-gradient: linear-gradient(135deg, #09F0A0 0%, #00D084 100%);
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-card: 0 12px 36px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.2);
            --slider-track: rgba(255, 255, 255, 0.08);
            --hud-bg: rgba(22, 24, 29, 0.92);
            --hud-border: rgba(255, 255, 255, 0.1);
            color-scheme: dark;
        }

        html {
            width: 100%;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
        }

        body {
            width: 100%;
            height: 100vh;
            background: var(--bg);
            font-family: var(--font-main);
            color: var(--text);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.25s ease;
        }

        body.loaded {
            opacity: 1;
        }

        /* ── Scrollbars ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ── Showroom Header Row ── */
        .studio-header {
            height: 62px;
            padding: 0 24px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--chrome-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            gap: 16px;
        }

        .studio-left-group {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .studio-icon-bubble {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--accent-gradient);
            color: var(--accent-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 4px 14px var(--accent-glow);
            flex-shrink: 0;
        }

        .studio-title-block {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .studio-filename-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .studio-filename {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 340px;
        }

        .studio-version-chip {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent-glow);
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .studio-dim-badge {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            background: rgba(148, 163, 184, 0.14);
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--chrome-border);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Top Action Buttons */
        .studio-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .studio-btn {
            background: var(--card-bg);
            border: 1px solid var(--chrome-border);
            border-radius: var(--radius-pill);
            padding: 8px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-family: var(--font-main);
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .studio-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 6px 18px var(--accent-dim);
        }

        .studio-btn i {
            color: var(--text-dim);
            font-size: 12px;
            transition: color 0.2s;
        }

        .studio-btn:hover i {
            color: var(--accent);
        }

        .studio-btn.primary {
            background: var(--accent-gradient);
            color: var(--accent-text);
            border-color: transparent;
            font-weight: 800;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .studio-btn.primary i {
            color: var(--accent-text);
        }

        .studio-btn.primary:hover {
            box-shadow: 0 8px 24px var(--accent-glow);
            transform: translateY(-2px) scale(1.02);
        }

        /* ── Studio Body Layout ── */
        .studio-main-body {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            background: var(--bg);
            padding: 12px;
            gap: 12px;
        }

        /* ── Center Stage Viewport Bento Card ── */
        .studio-stage-card {
            flex: 1;
            background: transparent;
            border: none;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: none;
            padding: 8px;
        }

        .canvas-viewport-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
        }

        .target-photo-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
            transition: filter 0.1s ease;
            object-fit: contain;
            display: block;
        }

        /* Showroom Floating Bottom HUD Bar (Home page .sp-bottom-bar-pill style) */
        .hud-toolbar {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--hud-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--hud-border);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.04);
            z-index: 20;
        }

        .hud-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hud-btn:hover {
            color: var(--text);
            background: rgba(148, 163, 184, 0.14);
            transform: scale(1.08);
        }

        .hud-val-pill {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: var(--accent-dim);
            border: 1px solid var(--accent-glow);
            min-width: 60px;
            text-align: center;
        }

        .hud-divider {
            width: 1px;
            height: 18px;
            background: var(--chrome-border);
            margin: 0 4px;
        }

        /* ── Right Inspector Bento Panel ── */
        .studio-inspector-card {
            width: 360px;
            min-width: 360px;
            background: var(--panel-bg);
            border: 1px solid var(--chrome-border);
            border-radius: var(--radius-card);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: var(--shadow-card);
            overflow: hidden;
            z-index: 10;
        }

        /* Showroom Mode Pill Nav (Matched with home.html .sp-mode-pill) */
        .inspector-nav-box {
            padding: 14px 18px;
            border-bottom: 1px solid var(--chrome-border);
        }

        .inspector-mode-pill {
            display: flex;
            background: var(--bg);
            padding: 4px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--chrome-border);
            gap: 4px;
        }

        .inspector-tab-btn {
            flex: 1;
            height: 32px;
            border-radius: var(--radius-pill);
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .inspector-tab-btn i {
            font-size: 11px;
            opacity: 0.8;
        }

        .inspector-tab-btn:hover:not(.active) {
            color: var(--text);
            background: rgba(148, 163, 184, 0.12);
        }

        .inspector-tab-btn.active {
            background: var(--accent) !important;
            color: var(--accent-text) !important;
            font-weight: 800;
            box-shadow: 0 2px 10px var(--accent-dim);
        }

        .inspector-tab-btn.active i {
            color: var(--accent-text);
            opacity: 1;
        }

        /* Scrollable Inspector Body */
        .inspector-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .inspector-section-title {
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inspector-section-title i {
            color: var(--accent);
            font-size: 11px;
        }

        /* Inspector Slider Fields */
        .inspector-sliders {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .inspector-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .field-label-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 700;
        }

        .field-label-row label i {
            width: 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        .field-val-chip {
            font-family: var(--font-mono);
            font-size: 11.5px;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid var(--accent-glow);
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .field-val-chip:hover {
            transform: scale(1.06);
        }

        /* Custom Ultra-Sleek Range Sliders */
        .inspector-field input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 100px;
            background: var(--slider-track);
            outline: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .inspector-field input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            border: 2.5px solid var(--panel-bg);
            box-shadow: 0 2px 10px var(--accent-glow);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .inspector-field input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        /* ── Preset Cards Bento Grid ── */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .preset-card {
            padding: 14px 12px;
            border-radius: var(--radius-sub);
            background: var(--card-bg);
            border: 1px solid var(--chrome-border);
            color: var(--text-dim);
            font-family: var(--font-main);
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .preset-swatch {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .preset-card:hover .preset-swatch {
            transform: scale(1.12);
        }

        .preset-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 8px 20px var(--accent-dim);
        }

        .preset-card.active {
            background: var(--accent-dim) !important;
            border: 1.5px solid var(--accent) !important;
            color: var(--accent) !important;
            font-weight: 800;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        /* ── EXIF & Info Bento Card ── */
        .info-bento-card {
            background: var(--card-bg);
            border: 1px solid var(--chrome-border);
            border-radius: var(--radius-sub);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: var(--shadow-sm);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            color: var(--text-dim);
        }

        .info-row strong {
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
        }

        .info-action-btn {
            margin-top: 6px;
            width: 100%;
            padding: 10px;
            border-radius: var(--radius-pill);
            background: var(--bg);
            border: 1px solid var(--chrome-border);
            color: var(--text);
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .info-action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }
    </style>
</head>

<body>
    <!-- ══ Showroom Header ══ -->
    <header class="studio-header">
        <div class="studio-left-group">
            <div class="studio-icon-bubble">
                <i class="fas fa-wand-magic-sparkles"></i>
            </div>
            <div class="studio-title-block">
                <div class="studio-filename-row">
                    <span id="editor-filename" class="studio-filename">Loading Image...</span>
                    <span class="studio-version-chip">Photo View</span>
                </div>
            </div>
            <div class="studio-dim-badge" id="header-dim-badge">
                <i class="fas fa-expand"></i>
                <span id="header-dim">-- × -- px</span>
            </div>
        </div>

        <div class="studio-header-actions">
            <button id="editor-reset-btn" class="studio-btn" title="Reset all adjustments"><i class="fas fa-rotate-left"></i> Reset</button>
            <button id="editor-copy-btn" class="studio-btn" title="Copy to clipboard"><i class="fas fa-copy"></i> Copy</button>
            <button id="editor-save-btn" class="studio-btn primary" title="Export & Save Image"><i class="fas fa-arrow-down-to-bracket"></i> Save Image</button>
        </div>
    </header>

    <!-- ══ Main Studio Body ══ -->
    <main class="studio-main-body">
        <!-- ══ Center Stage Viewport Bento Card ══ -->
        <section class="studio-stage-card">
            <div class="canvas-viewport-wrapper" id="editor-canvas-wrapper">
                <img id="editor-img-target" class="target-photo-img" alt="Photo Preview">
            </div>

            <!-- Showroom Floating HUD Controls Bar -->
            <div class="hud-toolbar">
                <button class="hud-btn" id="tool-zoom-out" title="Zoom Out (−)"><i class="fas fa-magnifying-glass-minus"></i></button>
                <span id="val-zoom" class="hud-val-pill">100%</span>
                <button class="hud-btn" id="tool-zoom-in" title="Zoom In (+)"><i class="fas fa-magnifying-glass-plus"></i></button>
                <button class="hud-btn" id="tool-fit" title="Fit to Viewport"><i class="fas fa-expand"></i></button>
                <div class="hud-divider"></div>
                <button class="hud-btn" id="tool-rotate-left" title="Rotate Left 90°"><i class="fas fa-rotate-left"></i></button>
                <button class="hud-btn" id="tool-rotate-right" title="Rotate Right 90°"><i class="fas fa-rotate-right"></i></button>
                <button class="hud-btn" id="tool-flip-h" title="Flip Horizontal"><i class="fas fa-arrows-left-right"></i></button>
                <button class="hud-btn" id="tool-flip-v" title="Flip Vertical"><i class="fas fa-arrows-up-down"></i></button>
            </div>
        </section>

        <!-- ══ Right Inspector Bento Card ══ -->
        <aside class="studio-inspector-card">
            <div class="inspector-nav-box">
                <div class="inspector-mode-pill">
                    <button class="inspector-tab-btn active" data-tab="adjust"><i class="fas fa-sliders"></i> Adjust</button>
                    <button class="inspector-tab-btn" data-tab="presets"><i class="fas fa-wand-magic-sparkles"></i> Presets</button>
                    <button class="inspector-tab-btn" data-tab="info"><i class="fas fa-circle-info"></i> Details</button>
                </div>
            </div>

            <div class="inspector-body">
                <!-- Tab 1: Adjust -->
                <div id="tab-adjust" class="tab-panel">
                    <div class="inspector-section-title"><i class="fas fa-sun"></i> Lighting & Exposure</div>
                    <div class="inspector-sliders">
                        <div class="inspector-field">
                            <div class="field-label-row">
                                <label><i class="fas fa-sun"></i> Brightness</label>
                                <span id="val-brightness" class="field-val-chip" title="Click to reset">100%</span>
                            </div>
                            <input type="range" id="slider-brightness" min="0" max="200" value="100">
                        </div>

                        <div class="inspector-field">
                            <div class="field-label-row">
                                <label><i class="fas fa-circle-half-stroke"></i> Contrast</label>
                                <span id="val-contrast" class="field-val-chip" title="Click to reset">100%</span>
                            </div>
                            <input type="range" id="slider-contrast" min="0" max="200" value="100">
                        </div>

                        <div class="inspector-field">
                            <div class="field-label-row">
                                <label><i class="fas fa-droplet"></i> Saturation</label>
                                <span id="val-saturation" class="field-val-chip" title="Click to reset">100%</span>
                            </div>
                            <input type="range" id="slider-saturation" min="0" max="200" value="100">
                        </div>
                    </div>

                    <div class="inspector-section-title" style="margin-top: 24px;"><i class="fas fa-palette"></i> Color & Styling</div>
                    <div class="inspector-sliders">
                        <div class="inspector-field">
                            <div class="field-label-row">
                                <label><i class="fas fa-film"></i> Sepia</label>
                                <span id="val-sepia" class="field-val-chip" title="Click to reset">0%</span>
                            </div>
                            <input type="range" id="slider-sepia" min="0" max="100" value="0">
                        </div>

                        <div class="inspector-field">
                            <div class="field-label-row">
                                <label><i class="fas fa-ghost"></i> Blur</label>
                                <span id="val-blur" class="field-val-chip" title="Click to reset">0px</span>
                            </div>
                            <input type="range" id="slider-blur" min="0" max="20" value="0">
                        </div>

                        <div class="inspector-field">
                            <div class="field-label-row">
                                <label><i class="fas fa-compass-drafting"></i> Hue Rotate</label>
                                <span id="val-hue" class="field-val-chip" title="Click to reset">0°</span>
                            </div>
                            <input type="range" id="slider-hue" min="0" max="360" value="0">
                        </div>
                    </div>
                </div>

                <!-- Tab 2: Presets -->
                <div id="tab-presets" class="tab-panel" style="display: none;">
                    <div class="inspector-section-title"><i class="fas fa-wand-magic-sparkles"></i> Curated LUT Presets</div>
                    <div class="preset-grid">
                        <button class="preset-card active" data-preset="normal">
                            <div class="preset-swatch" style="background: linear-gradient(135deg, #3B82F6 0%, #10B981 100%); color: #FFFFFF;"><i class="fas fa-image"></i></div>
                            <span>Original</span>
                        </button>
                        <button class="preset-card" data-preset="vivid">
                            <div class="preset-swatch" style="background: linear-gradient(135deg, #10B981 0%, #09F0A0 100%); color: #0D0E11;"><i class="fas fa-bolt"></i></div>
                            <span>Vivid Emerald</span>
                        </button>
                        <button class="preset-card" data-preset="bw">
                            <div class="preset-swatch" style="background: linear-gradient(135deg, #111111 0%, #666666 100%); color: #FFFFFF;"><i class="fas fa-circle-half-stroke"></i></div>
                            <span>Noir B&W</span>
                        </button>
                        <button class="preset-card" data-preset="sepia">
                            <div class="preset-swatch" style="background: linear-gradient(135deg, #F59E0B 0%, #B45309 100%); color: #FFFFFF;"><i class="fas fa-film"></i></div>
                            <span>Vintage Retro</span>
                        </button>
                        <button class="preset-card" data-preset="cyber">
                            <div class="preset-swatch" style="background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 100%); color: #FFFFFF;"><i class="fas fa-laptop-code"></i></div>
                            <span>Cyberpunk</span>
                        </button>
                        <button class="preset-card" data-preset="warm">
                            <div class="preset-swatch" style="background: linear-gradient(135deg, #F97316 0%, #FBBF24 100%); color: #FFFFFF;"><i class="fas fa-sun"></i></div>
                            <span>Golden Hour</span>
                        </button>
                        <button class="preset-card" data-preset="cool">
                            <div class="preset-swatch" style="background: linear-gradient(135deg, #06B6D4 0%, #3B82F6 100%); color: #FFFFFF;"><i class="fas fa-snowflake"></i></div>
                            <span>Cool Ice</span>
                        </button>
                        <button class="preset-card" data-preset="dramatic">
                            <div class="preset-swatch" style="background: linear-gradient(135deg, #6366F1 0%, #1E1B4B 100%); color: #FFFFFF;"><i class="fas fa-mountain-sun"></i></div>
                            <span>Dramatic HDR</span>
                        </button>
                    </div>
                </div>

                <!-- Tab 3: Details -->
                <div id="tab-info" class="tab-panel" style="display: none;">
                    <div class="inspector-section-title"><i class="fas fa-circle-info"></i> Image File Metadata</div>
                    <div class="info-bento-card">
                        <div class="info-row"><span>File Name</span> <strong id="info-name">--</strong></div>
                        <div class="info-row"><span>Dimensions</span> <strong id="info-dim">-- × --</strong></div>
                        <div class="info-row"><span>Megapixels</span> <strong id="info-mp">-- MP</strong></div>
                        <div class="info-row"><span>Format</span> <strong id="info-format">--</strong></div>
                        <button class="info-action-btn" id="info-copy-path-btn"><i class="fas fa-link"></i> Copy File Path</button>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <script src="photo-editor.js"></script>
</body>

</html>
