<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocal Photo Studio & Image Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #090B0E;
            --panel-bg: #12151C;
            --card-bg: #1A1D26;
            --card-hover: #222632;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.18);
            --text: #F3F4F6;
            --text-dim: #9CA3AF;
            --text-muted: #6B7280;
            --accent: #09f0a0;
            --accent-dim: rgba(9, 240, 160, 0.12);
            --accent-glow: rgba(9, 240, 160, 0.3);
            --hud-bg: rgba(18, 21, 28, 0.85);
            --hud-text: #F3F4F6;
            --slider-track: rgba(255, 255, 255, 0.1);
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
        }

        body[data-theme="light"] {
            --bg: #F3F4F8;
            --panel-bg: #FFFFFF;
            --card-bg: #F8FAFC;
            --card-hover: #F1F5F9;
            --border: rgba(0, 0, 0, 0.07);
            --border-hover: rgba(0, 0, 0, 0.14);
            --text: #0F172A;
            --text-dim: #475569;
            --text-muted: #94A3B8;
            --accent: #059669;
            --accent-dim: rgba(5, 150, 105, 0.1);
            --accent-glow: rgba(5, 150, 105, 0.25);
            --hud-bg: rgba(255, 255, 255, 0.9);
            --hud-text: #0F172A;
            --slider-track: rgba(0, 0, 0, 0.08);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Header Bar */
        .studio-header {
            height: 58px;
            padding: 0 24px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }

        .studio-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .studio-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--accent-dim);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            border: 1px solid var(--border);
        }

        .studio-filename {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            max-width: 320px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
        }

        .studio-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--border);
            letter-spacing: 0.2px;
        }

        .studio-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .studio-btn {
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .studio-btn.primary {
            background: var(--accent);
            color: #FFFFFF;
            border-color: var(--accent);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .studio-btn.primary:hover {
            transform: translateY(-1px);
            opacity: 0.94;
        }

        .studio-btn:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
        }

        /* Studio Main Layout */
        .studio-main-body {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Center Canvas Viewport Stage */
        .studio-canvas-stage {
            flex: 1;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: auto;
            padding: 24px;
        }

        .canvas-viewport-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease-out;
            max-width: 100%;
            max-height: 100%;
        }

        .target-photo-img {
            border-radius: 14px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
            transition: filter 0.1s ease, width 0.2s ease, height 0.2s ease;
            object-fit: contain;
        }

        /* Dynamic Aspect-Ratio Auto-Sizing Classes */
        .target-photo-img.is-portrait {
            height: 86vh;
            width: auto;
            max-width: 92vw;
        }

        .target-photo-img.is-landscape {
            width: 88vw;
            max-width: 92%;
            height: auto;
            max-height: 86vh;
        }

        .target-photo-img.is-square {
            max-width: 86vw;
            max-height: 86vh;
            width: auto;
            height: auto;
        }

        /* Floating HUD Controls Bar */
        .hud-toolbar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--hud-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
            z-index: 20;
        }

        .hud-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: var(--hud-text);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .hud-btn:hover {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .hud-divider {
            width: 1px;
            height: 18px;
            background: var(--border);
            margin: 0 4px;
        }

        .hud-val-pill {
            font-size: 11.5px;
            font-weight: 700;
            font-family: var(--mono);
            color: var(--accent);
            padding: 3px 10px;
            border-radius: 100px;
            background: var(--accent-dim);
        }

        /* Right Floating Inspector Sidebar */
        .studio-sidebar {
            width: 330px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }

        /* Segmented Control Nav Header */
        .sidebar-nav-container {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .segmented-control {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3px;
            gap: 2px;
        }

        .sidebar-tab-btn {
            flex: 1;
            height: 34px;
            border-radius: 9px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 12.5px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar-tab-btn.active {
            background: var(--panel-bg);
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            font-weight: 700;
        }

        .sidebar-tab-btn:hover:not(.active) {
            color: var(--text);
        }

        .sidebar-content-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Sliders Grid */
        .inspector-sliders {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .inspector-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .field-label-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            font-size: 12.5px;
        }

        .field-label-row label i {
            width: 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .field-val {
            font-family: var(--mono);
            font-size: 11.5px;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 2px 8px;
            border-radius: 6px;
        }

        /* Custom Ultra-Sleek Range Slider */
        .inspector-field input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 100px;
            background: var(--slider-track);
            outline: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .inspector-field input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            border: 2.5px solid var(--panel-bg);
            box-shadow: 0 2px 8px var(--accent-glow);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .inspector-field input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.18);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* Preset Cards Grid */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .preset-card {
            padding: 12px;
            border-radius: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }

        .preset-card i {
            font-size: 18px;
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .preset-card.active, .preset-card:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .preset-card.active i, .preset-card:hover i {
            color: var(--accent);
        }

        /* File Info Card */
        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 12.5px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-dim);
        }

        .info-row strong {
            color: var(--text);
            font-weight: 700;
        }
    </style>
</head>
<body data-theme="dark">
    <!-- Header -->
    <div class="studio-header">
        <div class="studio-title-group">
            <div class="studio-icon-box"><i class="fas fa-wand-magic-sparkles"></i></div>
            <span id="editor-filename" class="studio-filename">Photo.jpg</span>
            <span id="editor-meta" class="studio-badge">Ocal Photo Studio</span>
        </div>
        <div class="studio-header-actions">
            <button id="editor-reset-btn" class="studio-btn" title="Reset All"><i class="fas fa-rotate-left"></i> Reset</button>
            <button id="editor-save-btn" class="studio-btn primary" title="Save Image"><i class="fas fa-download"></i> Save Image</button>
        </div>
    </div>

    <!-- Main Studio Body -->
    <div class="studio-main-body">
        <!-- Canvas Stage -->
        <div class="studio-canvas-stage">
            <div class="canvas-viewport-wrapper" id="editor-canvas-wrapper">
                <img id="editor-img-target" class="target-photo-img" alt="Photo Preview">
            </div>

            <!-- Floating HUD Bar -->
            <div class="hud-toolbar">
                <button class="hud-btn" id="tool-zoom-out" title="Zoom Out"><i class="fas fa-magnifying-glass-minus"></i></button>
                <span id="val-zoom" class="hud-val-pill">100%</span>
                <button class="hud-btn" id="tool-zoom-in" title="Zoom In"><i class="fas fa-magnifying-glass-plus"></i></button>
                <button class="hud-btn" id="tool-fit" title="Fit Screen"><i class="fas fa-expand"></i></button>
                <div class="hud-divider"></div>
                <button class="hud-btn" id="tool-rotate-left" title="Rotate Left 90°"><i class="fas fa-rotate-left"></i></button>
                <button class="hud-btn" id="tool-rotate-right" title="Rotate Right 90°"><i class="fas fa-rotate-right"></i></button>
                <button class="hud-btn" id="tool-flip-h" title="Flip Horizontal"><i class="fas fa-arrows-left-right"></i></button>
                <button class="hud-btn" id="tool-flip-v" title="Flip Vertical"><i class="fas fa-arrows-up-down"></i></button>
            </div>
        </div>

        <!-- Sidebar Inspector -->
        <div class="studio-sidebar">
            <div class="sidebar-nav-container">
                <div class="segmented-control">
                    <button class="sidebar-tab-btn active" data-tab="adjust"><i class="fas fa-sliders"></i> Adjust</button>
                    <button class="sidebar-tab-btn" data-tab="presets"><i class="fas fa-wand-magic-sparkles"></i> Presets</button>
                    <button class="sidebar-tab-btn" data-tab="info"><i class="fas fa-circle-info"></i> Info</button>
                </div>
            </div>

            <div class="sidebar-content-body">
                <!-- Adjust Tab -->
                <div id="tab-adjust" class="tab-panel">
                    <div class="sidebar-section-title"><i class="fas fa-sun"></i> Lighting & Color</div>
                    <div class="inspector-sliders">
                        <div class="inspector-field">
                            <div class="field-label-row">
                                <label><i class="fas fa-sun"></i> Brightness</label>
                                <span id="val-brightness" class="field-val">100%</span>
                            </div>
                            <input type="range" id="slider-brightness" min="0" max="200" value="100">
                        </div>

                        <div class="inspector-field">
                            <div class="field-label-row">
                                <label><i class="fas fa-circle-half-stroke"></i> Contrast</label>
                                <span id="val-contrast" class="field-val">100%</span>
                            </div>
                            <input type="range" id="slider-contrast" min="0" max="200" value="100">
                        </div>

                        <div class="inspector-field">
                            <div class="field-label-row">
                                <label><i class="fas fa-droplet"></i> Saturation</label>
                                <span id="val-saturation" class="field-val">100%</span>
                            </div>
                            <input type="range" id="slider-saturation" min="0" max="200" value="100">
                        </div>

                        <div class="inspector-field">
                            <div class="field-label-row">
                                <label><i class="fas fa-film"></i> Sepia</label>
                                <span id="val-sepia" class="field-val">0%</span>
                            </div>
                            <input type="range" id="slider-sepia" min="0" max="100" value="0">
                        </div>

                        <div class="inspector-field">
                            <div class="field-label-row">
                                <label><i class="fas fa-ghost"></i> Blur</label>
                                <span id="val-blur" class="field-val">0px</span>
                            </div>
                            <input type="range" id="slider-blur" min="0" max="20" value="0">
                        </div>
                    </div>
                </div>

                <!-- Presets Tab -->
                <div id="tab-presets" class="tab-panel" style="display: none;">
                    <div class="sidebar-section-title"><i class="fas fa-wand-magic-sparkles"></i> Preset Filters</div>
                    <div class="preset-grid">
                        <button class="preset-card active" data-preset="normal"><i class="fas fa-image"></i> Original</button>
                        <button class="preset-card" data-preset="vivid"><i class="fas fa-bolt"></i> Vivid</button>
                        <button class="preset-card" data-preset="bw"><i class="fas fa-circle-half-stroke"></i> B&W</button>
                        <button class="preset-card" data-preset="sepia"><i class="fas fa-film"></i> Vintage</button>
                        <button class="preset-card" data-preset="cyber"><i class="fas fa-laptop-code"></i> Cyberpunk</button>
                        <button class="preset-card" data-preset="warm"><i class="fas fa-sun"></i> Warm Film</button>
                    </div>
                </div>

                <!-- Info Tab -->
                <div id="tab-info" class="tab-panel" style="display: none;">
                    <div class="sidebar-section-title"><i class="fas fa-circle-info"></i> Image Details</div>
                    <div class="info-card">
                        <div class="info-row"><span>File Name:</span> <strong id="info-name">Photo.jpg</strong></div>
                        <div class="info-row"><span>Dimensions:</span> <strong id="info-dim">1920 x 1080</strong></div>
                        <div class="info-row"><span>Format:</span> <strong id="info-format">PNG / JPG</strong></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="photo-editor.js"></script>
</body>
</html>
