<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Vault</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <style>
        :root {
            --accent: #10B981;
            --accent-bg: rgba(16, 185, 129, 0.12);
            --bg-card: #FFFFFF;
            --border-card: #E5E7EB;
            --bg-input: #F3F4F6;
            --border-input: #E5E7EB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body[data-theme="dark"] {
            --accent: #09f0a0;
            --accent-bg: rgba(9, 240, 160, 0.15);
            --bg-card: #16181D;
            --border-card: rgba(255, 255, 255, 0.12);
            --bg-input: rgba(255, 255, 255, 0.05);
            --border-input: rgba(255, 255, 255, 0.08);
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
        }

        body[data-theme="light"] img {
            filter: invert(0.92) hue-rotate(180deg) !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            outline: none;
        }

        body {
            font-family: var(--font-main);
            background: transparent !important;
            color: var(--text-primary);
            overflow: hidden;
            width: 290px;
            height: 340px;
            padding: 0;
            margin: 0;
        }

        .popup-card {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-card) !important;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            box-shadow: none !important; /* No shadows */
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-card);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .close-btn:hover {
            color: var(--text-primary);
            background: var(--bg-input);
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 8px;
            padding: 6px 10px;
        }

        .search-box i {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 12px;
            width: 100%;
        }

        .content-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 2px;
        }

        .content-list::-webkit-scrollbar {
            width: 4px;
        }
        .content-list::-webkit-scrollbar-thumb {
            background: var(--border-card);
            border-radius: 4px;
        }

        .cred-item {
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .cred-item:hover {
            border-color: var(--accent);
        }

        .cred-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
        }

        .cred-user {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cred-pass-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: SFMono-Regular, Consolas, Monaco, monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-input);
            padding: 5px 8px;
            border-radius: 6px;
            color: var(--text-primary);
        }

        body[data-theme="dark"] .cred-pass-group {
            background: rgba(0, 0, 0, 0.2);
        }

        .cred-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .btn-action {
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .btn-fill {
            background: var(--accent-bg);
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .btn-fill:hover {
            background: var(--accent);
            color: #FFFFFF;
        }

        .btn-copy {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-card);
        }
        .btn-copy:hover {
            background: var(--bg-input);
        }

        .btn-del {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 4px 8px;
        }
        .btn-del:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 36px 12px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .empty-state i {
            font-size: 24px;
            opacity: 0.4;
        }
        .empty-state span {
            font-size: 12.5px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="popup-card">
        <div class="header">
            <div class="header-title">
                <i class="fas fa-vault" style="color: var(--accent);"></i>
                <span>Password Vault</span>
            </div>
            <button class="close-btn" id="close-btn"><i class="fas fa-xmark"></i></button>
        </div>

        <div class="search-box">
            <i class="fas fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Search accounts..." autocomplete="off">
        </div>

        <div class="content-list" id="content-list">
            <!-- Credentials list -->
        </div>
    </div>

    <script src="passwords-popover.js"></script>
</body>
</html>
