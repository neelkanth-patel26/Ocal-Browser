<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Site Settings</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://suggestqueries.google.com https://api.github.com https://cdnjs.cloudflare.com https://unpkg.com;">
    <!-- ANTI-FLASH & COLOR HARMONIZER -->
    <script src="color-harmonizer.js"></script>
    <script>
        (function () {
            var t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
            if (t === 'dark') {
                document.documentElement.style.background = '#18181B';
                document.documentElement.style.colorScheme = 'dark';
            } else {
                document.documentElement.style.background = '#EDEDF0';
            }
            var a = localStorage.getItem('ocal-settings-accent');
            if (window.OcalColorHarmonizer) {
                window.OcalColorHarmonizer.applyHarmonizedTheme(a, t);
            }
        })();
    </script>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #EDEDF0;
            --card-bg: #FFFFFF;
            --card-bg-subtle: #F8F9FA;
            --card-border: rgba(0, 0, 0, 0.06);
            --border-color: rgba(0, 0, 0, 0.06);
            --text-main: #111111;
            --text-dim: #555860;
            --text-muted: #7E8492;
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.25);
            --accent-dim: rgba(21, 172, 73, 0.12);
            --accent-text: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Space Mono', monospace;
            --card-shadow: none !important;
        }

        [data-theme="dark"], body[data-theme="dark"] {
            --bg-main: #18181B;
            --card-bg: #222226;
            --card-bg-subtle: #28282D;
            --card-border: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-dim: #9CA3AF;
            --text-muted: #71717A;
            --card-shadow: none !important;
            color-scheme: dark;
        }

        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
        }

        .settings-wrapper {
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            scrollbar-width: thin;
        }

        .settings-wrapper::-webkit-scrollbar { 
            width: 6px; 
        }
        .settings-wrapper::-webkit-scrollbar-track { 
            background: transparent; 
        }
        .settings-wrapper::-webkit-scrollbar-thumb { 
            background: rgba(148, 163, 184, 0.3); 
            border-radius: 10px; 
        }
        .settings-wrapper::-webkit-scrollbar-thumb:hover { 
            background: var(--accent);
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .back-btn {
            width: 40px; 
            height: 40px; 
            border-radius: 50%;
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            color: var(--text-dim); 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: none !important;
            outline: none;
        }

        .back-btn:hover { 
            background: var(--card-bg-subtle); 
            border-color: var(--accent);
            color: var(--accent); 
            transform: scale(1.08);
        }

        .hostname { 
            font-family: var(--font-main);
            font-size: 24px; 
            font-weight: 800; 
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .section { 
            margin-bottom: 28px; 
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .section-title { 
            font-size: 11px; 
            font-weight: 800; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.8px;
            font-family: var(--font-mono);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: none !important;
        }

        .row {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            background: var(--card-bg);
        }

        .row:last-child { 
            border-bottom: none; 
        }

        .row:hover { 
            background: var(--card-bg-subtle); 
        }

        .row-icon { 
            width: 36px; 
            height: 36px; 
            border-radius: 12px;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 14px; 
            color: var(--accent);
            flex-shrink: 0;
        }

        .row-content { 
            flex: 1; 
            min-width: 0; 
        }

        .row-title { 
            font-size: 13.5px; 
            font-weight: 700; 
            font-family: var(--font-main);
            color: var(--text-main); 
        }

        .row-desc { 
            font-size: 11px; 
            color: var(--text-muted); 
            margin-top: 2px; 
            line-height: 1.35; 
        }

        .action-btn {
            padding: 6px 16px; 
            border-radius: 100px; 
            font-size: 11px; 
            font-weight: 700;
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); 
            border: 1px solid var(--card-border);
            background: var(--card-bg-subtle); 
            color: var(--text-main);
            font-family: var(--font-main);
            white-space: nowrap;
            outline: none;
        }

        .action-btn:hover { 
            background: var(--card-bg); 
            border-color: var(--accent); 
            color: var(--accent); 
        }

        .action-btn.danger { 
            color: #EF4444; 
            border-color: rgba(239, 68, 68, 0.2); 
            background: rgba(239, 68, 68, 0.06); 
            padding: 7px 18px;
            font-size: 11.5px;
            font-weight: 800;
        }

        .action-btn.danger:hover { 
            background: #EF4444; 
            border-color: #EF4444; 
            color: #FFFFFF; 
            box-shadow: none !important;
        }

        /* ── Custom Styled Dropdown ───────────────────────────────── */
        .custom-select-container {
            position: relative;
            user-select: none;
        }

        .custom-select-trigger {
            background: var(--card-bg-subtle);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 100px;
            padding: 7px 16px;
            font-size: 11.5px;
            font-weight: 700;
            font-family: var(--font-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-width: 155px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .custom-select-trigger:hover,
        .custom-select-container.open .custom-select-trigger {
            background-color: var(--card-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        .custom-select-arrow {
            font-size: 10px;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .custom-select-container.open .custom-select-arrow {
            transform: rotate(180deg);
            color: var(--accent);
        }

        .custom-select-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 165px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            box-shadow: none !important;
            padding: 6px;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px) scale(0.96);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .custom-select-container.open .custom-select-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .custom-select-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 600;
            font-family: var(--font-main);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .custom-select-option:hover {
            background: var(--card-bg-subtle);
            color: var(--text-main);
        }

        .custom-select-option.selected {
            background: var(--accent-dim);
            color: var(--accent);
            font-weight: 700;
        }

        .custom-select-option i {
            font-size: 10px;
            color: var(--accent);
        }

        /* Usage section */
        .usage-display { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%; 
        }

        .usage-info { 
            font-size: 20px; 
            color: var(--accent); 
            font-weight: 700; 
            font-family: var(--font-mono);
        }

        .usage-count { 
            display: block; 
            font-size: 11px; 
            color: var(--text-muted); 
            font-weight: 600; 
            margin-top: 2px; 
            font-family: var(--font-mono);
        }
    </style>
</head>
<body data-theme="dark">
    <script>
        (function () {
            const t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.body.setAttribute('data-theme', t);
        })();
    </script>
    <div class="settings-wrapper">
        <div class="container">
            <div class="header">
                <button class="back-btn" onclick="history.back()" title="Go Back"><i class="fas fa-arrow-left"></i></button>
                <div class="hostname" id="site-hostname">www.google.com</div>
            </div>

            <div class="section">
                <div class="section-title">Usage</div>
                <div class="card">
                    <div class="row">
                        <div class="usage-display">
                            <div>
                                <div class="usage-info" id="site-usage">0.0 KB</div>
                                <div class="usage-count" id="site-cookie-count">0 cookies</div>
                            </div>
                            <button class="action-btn danger" id="delete-data-btn">Delete data</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <div class="section-title">Permissions</div>
                    <button class="action-btn" id="reset-perms-btn">Reset all</button>
                </div>
                <div class="card" id="permissions-list">
                    <!-- Grouped Permissions injected dynamically -->
                </div>
            </div>

            <div style="text-align: center; margin-top: 50px; padding-bottom: 30px; opacity: 0.4; font-size: 11px; letter-spacing: 0.05em; font-family: var(--font-mono);">
                <i class="fas fa-shield-halved" style="margin-right: 6px; color: var(--accent);"></i>
                Ocal Engine Security & Privacy Management
            </div>
        </div>
    </div>
    <script src="site-settings.js"></script>
</body>
</html>
