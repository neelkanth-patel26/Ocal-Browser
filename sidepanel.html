<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://suggestqueries.google.com https://api.github.com https://cdnjs.cloudflare.com https://unpkg.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #18181B;
            --border: rgba(255, 255, 255, 0.08);
            --text: #F4F4F5;
            --text-dim: #A1A1AA;
            --accent: #09F0A0;
            --radius-lg: 24px;
            --radius-pill: 100px;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .header {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
            -webkit-app-region: drag;
        }
        .title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        .controls {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }
        .btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 11px;
            outline: none;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.05);
            border-color: var(--accent);
        }
        .close-btn:hover {
            background: rgba(239, 68, 68, 0.16) !important;
            color: #EF4444 !important;
            border-color: rgba(239, 68, 68, 0.3) !important;
        }
        .content-area { flex: 1; background: transparent; }
    </style>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
</head>
<body>
    <div class="header">
        <div class="title" id="panel-title">System Blade</div>
        <div class="controls">
            <button class="btn" onclick="window.electronAPI.send('nav-back-panel')"><i class="fas fa-arrow-left" style="font-size:10px"></i></button>
            <button class="btn" onclick="window.electronAPI.send('nav-reload-panel')"><i class="fas fa-sync-alt" style="font-size:10px"></i></button>
            <button class="btn close-btn" onclick="window.electronAPI.send('hide-web-app')"><i class="fas fa-times"></i></button>
        </div>
    </div>
    <div class="content-area"></div>
    <script>
        window.electronAPI.on('update-panel-title', (e, t) => { document.getElementById('panel-title').textContent = t; });
    </script>
</body>
</html>
