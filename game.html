<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ocal Pulse — Cyber Dash</title>
    <!-- ANTI-FLASH & COLOR HARMONIZER -->
    <script src="color-harmonizer.js"></script>
    <script>
        (function () {
            var t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
            if (t === 'dark') {
                document.documentElement.style.background = '#0E0F14';
                document.documentElement.style.colorScheme = 'dark';
            } else {
                document.documentElement.style.background = '#F3F4F6';
                document.documentElement.style.colorScheme = 'light';
            }
            var a = localStorage.getItem('ocal-settings-accent');
            if (window.OcalColorHarmonizer) {
                window.OcalColorHarmonizer.applyHarmonizedTheme(a, t);
            }
            if (window.self !== window.top || location.search.includes('embedded=1')) {
                document.addEventListener('DOMContentLoaded', () => document.body.classList.add('embedded'));
            }
        })();
    </script>
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">

    <style>
        :root {
            --bg: #0E0F14;
            --surface: #161820;
            --surface-elevated: #1F222E;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #F3F4F6;
            --text-dim: #9CA3AF;
            --accent: #10B981;
            --accent-glow: rgba(16, 185, 129, 0.25);
            --font-main: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        html[data-theme="light"],
        body[data-theme="light"] {
            --bg: #F3F4F6;
            --surface: #FFFFFF;
            --surface-elevated: #F9FAFB;
            --border: rgba(0, 0, 0, 0.08);
            --text-main: #111827;
            --text-dim: #6B7280;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: var(--font-main);
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 12px 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            transition: background 0.25s ease, color 0.25s ease;
        }

        body.embedded .header-bar {
            display: none !important;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: min(1500px, 96vw);
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 800;
        }

        .brand-title i {
            color: var(--accent);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .game-wrap {
            width: 100%;
            max-width: min(1500px, 96vw);
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            justify-content: flex-start;
            min-height: 0;
        }

        .scores {
            display: flex;
            gap: 16px;
            width: 100%;
            justify-content: flex-start;
            flex-shrink: 0;
        }

        .score-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 700;
        }

        .score-box b {
            font-family: var(--font-mono);
            font-size: 16px;
            color: var(--accent);
        }

        .pulse-board {
            position: relative;
            width: 100%;
            flex: 1;
            max-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 160px);
            aspect-ratio: 2 / 1;
            object-fit: contain;
            background: var(--surface);
            cursor: pointer;
        }

        #gameOverModal {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(14, 15, 20, 0.9);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
        }

        html[data-theme="light"] #gameOverModal {
            background: rgba(243, 244, 246, 0.92);
        }

        #gameOverModal h2 {
            font-size: 26px;
            font-weight: 800;
        }

        #gameOverModal span {
            font-family: var(--font-mono);
            font-size: 15px;
            color: var(--text-dim);
        }

        button {
            padding: 12px 28px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: #0E0F14;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.15s;
        }

        button:hover {
            transform: scale(1.04);
        }

        .hint {
            color: var(--text-dim);
            font-size: 11px;
            text-align: center;
        }

        .key-badge {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-weight: 700;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="brand-title">
            <i class="fas fa-bolt"></i> Ocal Pulse
        </div>
        <a href="ocal://games" class="back-btn">
            <i class="fas fa-arrow-left"></i> Arcade
        </a>
    </div>

    <div class="game-wrap">
        <div class="scores">
            <div class="score-box"><span>SCORE</span> <b id="score-val">0</b></div>
            <div class="score-box"><span>BEST</span> <b id="best-val">0</b></div>
        </div>

        <div class="pulse-board">
            <canvas id="gameCanvas" width="800" height="400" aria-label="Runner game"></canvas>
            <div id="gameOverModal">
                <h2>Run Complete</h2>
                <span id="final-score">Final Score: 0</span>
                <button id="restartBtn">Play again</button>
            </div>
        </div>

        <p class="hint">Press <span class="key-badge">Space</span>, <span class="key-badge">↑</span>, or tap the canvas to jump.</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
