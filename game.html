<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: 'unsafe-inline' 'unsafe-eval' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; img-src 'self' data: blob: https:; frame-src 'self' data: blob: https:;">
    <title>Ocal Pulse | Chrome Dino</title>
    <!-- ANTI-FLASH -->
    <script>
        (function () {
            var t = localStorage.getItem('ocal-settings-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
            if (t === 'dark') {
                document.documentElement.style.background = '#0D0E11';
                document.documentElement.style.colorScheme = 'dark';
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    
    <style>
        :root {
            --bg: #0D0E11;
            --card-bg: #16181D;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #D4FC2B;
            --accent-glow: rgba(212, 252, 43, 0.3);
            --text-main: #F0F2F5;
            --text-dim: #A0A5B1;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        body[data-theme="light"] {
            --bg: #F0F2F5;
            --card-bg: #FFFFFF;
            --border: rgba(0, 0, 0, 0.08);
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.25);
            --text-main: #16181D;
            --text-dim: #626773;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .header-bar {
            position: absolute;
            top: 24px;
            left: 32px;
            right: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: var(--text-main);
        }

        .brand-title i {
            color: var(--accent);
        }

        .back-btn {
            padding: 8px 18px;
            border-radius: 100px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .game-wrapper {
            position: relative;
            width: calc(100vw - 80px);
            height: 320px;
            max-width: 1200px;
            border-radius: 28px;
            background: #FFFFFF;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
            transition: background 0.3s ease;
            margin-top: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body[data-theme="dark"] .game-wrapper {
            background: #202124;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body data-theme="light">

    <div class="header-bar">
        <div class="brand-title">
            <i class="fas fa-bolt"></i> Ocal Pulse (Chrome Dino)
        </div>
        <a href="games.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Games Hub
        </a>
    </div>

    <div class="game-wrapper">
        <iframe id="dino-iframe" src="dino/dino.html" allow="autoplay; keyboard"></iframe>
    </div>

    <script>
        (function () {
            const t = localStorage.getItem('ocal-settings-theme') || 'light';
            document.body.setAttribute('data-theme', t);
            document.documentElement.setAttribute('data-theme', t);
        })();

        if (window.electronAPI) {
            window.electronAPI.getSettings().then(s => {
                if (s.themeMode) {
                    document.body.setAttribute('data-theme', s.themeMode);
                    document.documentElement.setAttribute('data-theme', s.themeMode);
                }
            });
            window.electronAPI.onSettingsChanged((s) => {
                if (s.themeMode) {
                    document.body.setAttribute('data-theme', s.themeMode);
                    document.documentElement.setAttribute('data-theme', s.themeMode);
                }
            });
        }
    </script>
</body>
</html>
