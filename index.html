<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' ocal:; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https: chrome-extension:; connect-src 'self' https://suggestqueries.google.com https://api.github.com https://cdnjs.cloudflare.com https://unpkg.com https://clients2.google.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
</head>
<body id="main-body">
    <!-- Ambient Neural Backdrop -->
    <div class="ambient-lighting">
        <div class="neural-point point-1"></div>
        <div class="neural-point point-2"></div>
        <div class="neural-point point-3"></div>
    </div>

    <!-- ── Column 1: Left Sidebar ─────────────────────────────────── -->
    <div class="sidebar-hover-trigger" id="sidebar-hover-trigger"></div>
    <div class="left-sidebar" id="left-sidebar">
        <!-- Top: Logo / Brand Menu -->
        <div class="sidebar-logo-container">
            <button class="sidebar-logo-btn" id="sidebar-logo-btn" title="Ocal Menu">
                <img src="assets/icon.png" class="sidebar-logo-img" alt="Ocal">
            </button>
        </div>

        <!-- Top Shortcuts: Bookmarks & Games -->
        <div class="sidebar-top-shortcuts">
            <button class="sidebar-item" id="sb-book-btn" title="Bookmarks (Start Page)">
                <i class="fas fa-book-open"></i>
            </button>
            <button class="sidebar-item" id="sb-games-btn" title="Games Hub">
                <i class="fas fa-gamepad"></i>
            </button>
        </div>

        <div class="sidebar-separator"></div>

        <!-- Middle: Social Shortcuts / Web Apps & AI -->
        <div class="sidebar-shortcuts">
            <button class="sidebar-item social-btn" id="sb-wa-btn" data-url="https://web.whatsapp.com" title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </button>
            <button class="sidebar-item social-btn" id="sb-ig-btn" data-url="https://www.instagram.com" title="Instagram">
                <i class="fab fa-instagram"></i>
            </button>
            <button class="sidebar-item social-btn" id="sb-tw-btn" data-url="https://x.com" title="Twitter/X">
                <i class="fab fa-x-twitter"></i>
            </button>
            <button class="sidebar-item social-btn" id="sb-dc-btn" data-url="https://discord.com/app" title="Discord">
                <i class="fab fa-discord"></i>
            </button>
            <button class="sidebar-item social-btn" id="sb-sp-btn" data-url="https://open.spotify.com" title="Spotify">
                <i class="fab fa-spotify"></i>
            </button>
        </div>

        <!-- Bottom: Bookmarks, History, Settings -->
        <div class="sidebar-bottom">
            <button class="sidebar-item" id="sb-saves-btn" title="Saved Bookmarks">
                <i class="far fa-heart"></i>
            </button>
            <button class="sidebar-item" id="sb-history-btn" title="History">
                <i class="fas fa-clock-rotate-left"></i>
            </button>
            <button class="sidebar-item" id="sb-settings-btn" title="Easy Setup / Settings">
                <i class="fas fa-sliders"></i>
            </button>
        </div>
    </div>

    <!-- ── Row 1: Tab Bar ─────────────────────────────────────────── -->
    <div class="tab-bar">
        <div class="tab-area-container">
            <div id="tab-list"></div>
            <button class="new-tab-btn" id="new-tab-btn" title="New tab"><i class="fas fa-plus"></i></button>
            <div class="window-controls">
                <div class="ctrl-btn" id="min-btn" title="Minimize">
                    <svg width="8" height="8" viewBox="0 0 10 10"><path d="M1.5 5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                </div>
                <div class="ctrl-btn" id="max-btn" title="Maximize">
                    <svg width="8" height="8" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
                </div>
                <div class="ctrl-btn ctrl-close" id="close-btn" title="Close">
                    <svg width="8" height="8" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                </div>
            </div>
        </div>
        <div class="tab-drag-spacer"></div>
    </div>

    <!-- ── Row 2: Navigation Bar ──────────────────────────────────── -->
    <div class="nav-bar">
        
        <!-- Left: nav controls -->
        <div class="nav-controls">
            <button class="nav-btn" id="back-btn" title="Back"><i class="fas fa-arrow-left"></i></button>
            <button class="nav-btn" id="forward-btn" title="Forward"><i class="fas fa-arrow-right"></i></button>
            <button class="nav-btn" id="reload-btn" title="Reload"><i class="fas fa-rotate-right"></i></button>
        </div>

        <!-- Center: address bar -->
        <div class="omnibox" id="omnibox">
            <div class="omnibox-shield" id="shield-status" title="AdBlocker Active">
                <i class="fas fa-shield-halved"></i>
                <span id="page-time-chip">0s</span>
            </div>
            <div class="omnibox-ghost" id="proxy-status" title="Privacy Proxy Active" style="display:none;">
                <i class="fas fa-ghost"></i>
            </div>
            <div class="omnibox-identity" id="identity-btn">
                <i class="fas fa-lock site-lock-icon"></i>
            </div>
            <div class="url-field-group">
                <div class="omnibox-icon"></div>
                <div class="url-overlay-area">
                    <div class="pretty-url" id="pretty-url"></div>
                    <input type="text" class="omnibox-input" id="address-input" placeholder="Search or enter address" autocomplete="off" spellcheck="true">
                </div>
            </div>
            <div class="omnibox-actions">
                <button class="omni-btn" id="pip-btn" title="Popout Video" style="display:none; color: var(--accent);"><i class="fas fa-up-right-from-square"></i></button>
                <button class="omni-btn" id="passwords-btn" title="Saved Passwords for this site" style="position: relative; display: none;"><i class="fas fa-key"></i><span id="passwords-badge" class="passwords-badge" style="display: none;">0</span></button>
                <button class="omni-btn" id="bookmark-heart-btn" title="Bookmark this page"><i class="far fa-heart"></i></button>
                <button class="omni-btn" id="screenshot-btn" title="Screenshot"><i class="fas fa-camera"></i></button>
                <button class="omni-btn" id="download-icon-btn" title="Downloads"><i class="fas fa-arrow-down"></i></button>
            </div>
        </div>

        <!-- Right: toolbar actions -->
        <div class="invisible-wall"></div>
        <div class="toolbar-actions">
            <div class="split-active-pill" id="split-active-pill" style="display: none;" title="Split View Active — Click for Helper Menu">
                <i class="fas fa-columns"></i>
                <span id="split-active-label">Split View</span>
                <i class="fas fa-chevron-down" style="font-size: 9px; margin-left: 2px;"></i>
            </div>
            <button class="tool-btn media-master-btn" id="media-master-btn" title="Ocal Media Master" style="display:none;">
                <i class="fas fa-layer-group"></i>
                <span id="media-count-chip">0</span>
            </button>
            <button class="tool-btn" id="volume-boost-btn" title="Volume Booster"><i class="fas fa-volume-high"></i></button>
            <button class="tool-btn" id="split-screen-btn" title="Split Screen"><i class="fas fa-columns"></i></button>
            <button class="tool-btn" id="extensions-toolbar-btn" title="Extensions"><i class="fas fa-puzzle-piece"></i></button>
            <button class="ai-pill" id="ai-toolbar-btn">
                <i class="fas fa-wand-magic-sparkles"></i>
                <span>AI</span>
            </button>
            <button class="tool-btn" id="bookmarks-sidebar-btn" title="Bookmarks"><i class="fas fa-bookmark"></i></button>
            <button class="tool-btn" id="file-manager-btn" title="System Explorer"><i class="fas fa-folder-tree"></i></button>
            <button class="tool-btn" id="history-sidebar-btn" title="History"><i class="fas fa-clock-rotate-left"></i></button>
            <button class="tool-btn" id="burger-menu-btn" title="Menu"><i class="fas fa-ellipsis-vertical"></i></button>
        </div>
    </div>

    <!-- Passwords Vault Popover -->
    <div class="passwords-popover" id="passwords-popover" style="display: none;">
        <div class="passwords-popover-header">
            <div class="passwords-popover-title">
                <i class="fas fa-vault" style="color: var(--accent, #09f0a0);"></i>
                <span>Password Vault</span>
            </div>
            <button class="passwords-popover-close" id="passwords-popover-close"><i class="fas fa-xmark"></i></button>
        </div>
        
        <div class="passwords-popover-search">
            <i class="fas fa-magnifying-glass" style="color: var(--text-dim, #a0a5b1);"></i>
            <input type="text" id="passwords-search-input" placeholder="Search saved accounts..." autocomplete="off">
        </div>

        <div class="passwords-popover-content" id="passwords-popover-content">
            <!-- Dynamic list of saved credentials -->
        </div>
    </div>

    <!-- ── Row 3: Bookmark Bar ────────────────────────────────────── -->
    <div class="bookmark-bar" id="bookmark-bar"></div>



    <!-- Sidebar App Header Panel -->
    <div id="sidebar-app-header" class="sidebar-app-header">
        <div class="sidebar-app-title-group">
            <i id="sidebar-app-header-icon" class="fab fa-instagram"></i>
            <span id="sidebar-app-header-title">Instagram</span>
        </div>
        <div class="sidebar-app-actions">
            <button class="sidebar-app-action-btn" id="sidebar-app-back-btn" title="Back"><i class="fas fa-chevron-left"></i></button>
            <button class="sidebar-app-action-btn" id="sidebar-app-reload-btn" title="Reload"><i class="fas fa-rotate-right"></i></button>
            <button class="sidebar-app-action-btn" id="sidebar-app-close-btn" title="Close"><i class="fas fa-xmark"></i></button>
        </div>
    </div>
    
    <!-- Floating WebApp Controls Bar (Outside panel on the right) -->
    <div id="floating-webapp-bar" class="floating-webapp-bar" style="display: none;">
        <button class="floating-webapp-btn" id="webapp-shrink-btn" title="Decrease Width (-80px)">
            <i class="fas fa-minus"></i>
        </button>
        <button class="floating-webapp-btn" id="webapp-expand-btn" title="Increase Width (+80px)">
            <i class="fas fa-plus"></i>
        </button>
        <button class="floating-webapp-btn" id="webapp-presets-btn" title="Choose Panel Size">
            <i class="fas fa-up-right-and-down-left-from-center"></i>
        </button>
        <button class="floating-webapp-btn close-btn" id="floating-webapp-close-btn" title="Close Panel">
            <i class="fas fa-xmark"></i>
        </button>
    </div>

    <!-- WebApp Size Presets Menu -->
    <div id="webapp-presets-menu" class="webapp-presets-menu" style="display: none;">
        <div class="preset-menu-header">PANEL WIDTH PRESETS</div>
        <button class="preset-opt-btn" data-width="480"><i class="fas fa-mobile-screen"></i> Compact (480px)</button>
        <button class="preset-opt-btn" data-width="680"><i class="fas fa-tablet-screen-button"></i> Medium (680px)</button>
        <button class="preset-opt-btn" data-width="880"><i class="fas fa-desktop"></i> Wide (880px)</button>
        <button class="preset-opt-btn" data-width="1080"><i class="fas fa-expand"></i> Max (1080px)</button>
    </div>

    <!-- Hidden Drag Handle for edge dragging -->
    <div id="webapp-resize-handle" class="webapp-resize-handle" title="Drag left/right to resize sidebar app">
        <div class="resize-handle-bar"></div>
    </div>

    <!-- ── Row 4: Floating Web Content Frame ──────────────────────── -->
    <div class="web-content-container" id="web-content-container"></div>

    <!-- Toast -->
    <div class="bm-toast" id="bm-toast"></div>

    <!-- Split Close Confirmation Modal -->
    <div class="split-confirm-modal-overlay" id="split-confirm-modal" style="display: none;">
        <div class="split-confirm-modal">
            <div class="split-confirm-icon">
                <i class="fas fa-triangle-exclamation"></i>
            </div>
            <h3>Close Split Workspace?</h3>
            <p>Are you sure you want to close this split screen workspace? All active pages inside it will be closed.</p>
            <div class="split-confirm-actions">
                <button class="split-confirm-btn cancel-btn" id="split-confirm-cancel-btn">Cancel</button>
                <button class="split-confirm-btn confirm-btn" id="split-confirm-close-btn">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Undo Split Tab Toast -->
    <div class="split-undo-toast" id="split-undo-toast">
        <div class="split-undo-content">
            <i class="fas fa-columns"></i>
            <span>Split workspace closed</span>
        </div>
    </div>

    <!-- Split Screen Helper Quick Access Popover -->
    <div class="split-helper-popover" id="split-helper-popover" style="display: none;">
        <div class="split-helper-header">
            <div class="split-helper-title"><i class="fas fa-columns"></i> Split Screen Helper</div>
            <button class="split-helper-close" id="split-helper-close"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="split-helper-grid">
            <button class="split-helper-opt" id="sh-opt-home">
                <div class="sh-opt-icon"><i class="fas fa-house"></i></div>
                <div class="sh-opt-text">
                    <span class="sh-opt-name">Split with Home Page</span>
                    <span class="sh-opt-desc">Open Ocal Home side-by-side</span>
                </div>
            </button>
            <button class="split-helper-opt" id="sh-opt-duplicate">
                <div class="sh-opt-icon"><i class="fas fa-clone"></i></div>
                <div class="sh-opt-text">
                    <span class="sh-opt-name">Duplicate Current View</span>
                    <span class="sh-opt-desc">Clone active page into split window</span>
                </div>
            </button>
            <button class="split-helper-opt" id="sh-opt-explorer">
                <div class="sh-opt-icon"><i class="fas fa-folder-tree"></i></div>
                <div class="sh-opt-text">
                    <span class="sh-opt-name">Split with System Explorer</span>
                    <span class="sh-opt-desc">Open File Manager side-by-side</span>
                </div>
            </button>
            <button class="split-helper-opt" id="sh-opt-games">
                <div class="sh-opt-icon"><i class="fas fa-gamepad"></i></div>
                <div class="sh-opt-text">
                    <span class="sh-opt-name">Split with Games Hub</span>
                    <span class="sh-opt-desc">Play games alongside your work</span>
                </div>
            </button>
        </div>
        <div class="split-helper-footer" id="split-helper-active-actions" style="display: none;">
            <button class="sh-footer-btn" id="sh-act-swap"><i class="fas fa-right-left"></i> Swap Panes</button>
            <button class="sh-footer-btn exit-btn" id="sh-act-exit"><i class="fas fa-xmark"></i> Exit Split</button>
        </div>
    </div>

    <!-- ── Fullscreen URL Bar Overlay ─────────────────────────────────── -->
    <div id="fs-url-overlay" class="fs-url-overlay" style="display:none;">
        <div class="fs-url-pill" id="fs-url-pill">
            <i class="fas fa-globe fs-url-globe"></i>
            <span class="fs-url-summary" id="fs-url-summary">Click to navigate...</span>
        </div>
        <div class="fs-url-input-wrap" id="fs-url-input-wrap" style="display:none;">
            <i class="fas fa-lock fs-url-lock-icon" id="fs-url-lock-icon"></i>
            <input type="text" id="fs-address-input" class="fs-address-input" placeholder="Search or enter address" autocomplete="off" spellcheck="false">
            <button class="fs-url-go-btn" id="fs-url-go-btn" title="Go"><i class="fas fa-arrow-right"></i></button>
            <button class="fs-url-close-btn" id="fs-url-close-btn" title="Close"><i class="fas fa-xmark"></i></button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
