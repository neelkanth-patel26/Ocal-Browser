<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://suggestqueries.google.com https://api.github.com https://cdnjs.cloudflare.com https://unpkg.com;">
<title>Ocal Sidebars</title>
<!-- Anti-Flash & AI Color Harmonizer -->
<script src="color-harmonizer.js"></script>
<script>
    (function () {
        var t = localStorage.getItem('ocal-settings-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        var a = localStorage.getItem('ocal-settings-accent');
        if (window.OcalColorHarmonizer) {
            window.OcalColorHarmonizer.applyHarmonizedTheme(a, t);
        }
    })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* Strict Design Rule: Solid Color, Zero Shadows, Zero Gradients */
*, *::before, *::after {
    box-shadow: none !important;
    text-shadow: none !important;
}

:root {
    --accent: #09F0A0;
    --accent-hover: #07C785;
    --accent-glow: color-mix(in srgb, var(--accent) 30%, transparent);
    --accent-dim: color-mix(in srgb, var(--accent) 12%, transparent);
    --accent-border: color-mix(in srgb, var(--accent) 25%, transparent);
    --accent-text: #FFFFFF;
    
    /* 1:1 Matched Tokens with ai-sidebar.html */
    --bg: #EDEDF0;
    --panel-bg: rgba(255, 255, 255, 0.94);
    --sidebar-bg: #FFFFFF;
    --border: rgba(0, 0, 0, 0.06);
    --border-subtle: rgba(0, 0, 0, 0.03);
    --hover: rgba(0, 0, 0, 0.04);
    --card-bg: #FFFFFF;
    --card-border: rgba(0, 0, 0, 0.06);
    --card-hover-bg: #F8FAFC;
    --card-hover-border: var(--accent);
    --input-bg: #FFFFFF;
    --input-border: rgba(0, 0, 0, 0.08);
    --tab-strip-bg: #EDEDF0;
    --tab-pill-hover: rgba(0, 0, 0, 0.06);
    --text: #111111;
    --text-dim: #555860;
    --text-muted: #94A3B8;
    --badge-bg: #F1F5F9;
    --badge-text: #475569;
    
    /* Rounded corner scales from ai-sidebar.html */
    --radius-sm: 12px;
    --radius-md: 18px;
    --radius-lg: 24px;
    --radius-pill: 100px;
    --title-font: 'Plus Jakarta Sans', sans-serif;
    --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

:root[data-theme="dark"],
html[data-theme="dark"],
body[data-theme="dark"] {
    --bg: #18181B;
    --panel-bg: rgba(34, 34, 38, 0.94);
    --sidebar-bg: #222226;
    --border: rgba(255, 255, 255, 0.08);
    --border-subtle: rgba(255, 255, 255, 0.04);
    --hover: rgba(255, 255, 255, 0.06);
    --card-bg: #28282D;
    --card-border: rgba(255, 255, 255, 0.08);
    --card-hover-bg: #2E2E34;
    --card-hover-border: var(--accent);
    --input-bg: #28282D;
    --input-border: rgba(255, 255, 255, 0.08);
    --tab-strip-bg: #18181B;
    --tab-pill-hover: rgba(255, 255, 255, 0.08);
    --text: #F4F4F5;
    --text-dim: #A1A1AA;
    --text-muted: #71717A;
    --badge-bg: #222226;
    --badge-text: #A1A1AA;
}

:root[data-theme="light"],
html[data-theme="light"],
body[data-theme="light"] {
    --bg: #EDEDF0;
    --panel-bg: rgba(255, 255, 255, 0.94);
    --sidebar-bg: #FFFFFF;
    --border: rgba(0, 0, 0, 0.06);
    --border-subtle: rgba(0, 0, 0, 0.03);
    --hover: rgba(0, 0, 0, 0.04);
    --card-bg: #FFFFFF;
    --card-border: rgba(0, 0, 0, 0.06);
    --card-hover-bg: #F8FAFC;
    --card-hover-border: var(--accent);
    --input-bg: #FFFFFF;
    --input-border: rgba(0, 0, 0, 0.08);
    --tab-strip-bg: #EDEDF0;
    --tab-pill-hover: rgba(0, 0, 0, 0.06);
    --text: #111111;
    --text-dim: #555860;
    --text-muted: #94A3B8;
    --badge-bg: #F1F5F9;
    --badge-text: #475569;
}

html, body {
    background: transparent;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    pointer-events: none;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.overlay {
    width: 100vw;
    height: 100vh;
    position: relative;
    pointer-events: none;
}

/* ── Blur Backdrop: Minimal Subtle Blur ── */
.backdrop {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    /* Minimal frosted white blur in light mode */
    background: rgba(255, 255, 255, 0.15) !important;
    backdrop-filter: blur(2px) !important;
    -webkit-backdrop-filter: blur(2px) !important;
}

:root[data-theme="light"] .backdrop,
html[data-theme="light"] .backdrop,
body[data-theme="light"] .backdrop {
    background: rgba(255, 255, 255, 0.15) !important;
    backdrop-filter: blur(2px) !important;
    -webkit-backdrop-filter: blur(2px) !important;
}

:root[data-theme="dark"] .backdrop,
html[data-theme="dark"] .backdrop,
body[data-theme="dark"] .backdrop {
    background: rgba(0, 0, 0, 0.25) !important;
    backdrop-filter: blur(2px) !important;
    -webkit-backdrop-filter: blur(2px) !important;
}

.backdrop.show {
    opacity: 1;
    pointer-events: auto;
}

.backdrop.closing {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
}

/* ── Panel Container Bento Card (Matched with ai-sidebar.html 24px) ── */
.panel {
    position: fixed;
    right: 14px;
    top: 14px;
    bottom: 14px;
    width: 410px;
    max-width: calc(100vw - 28px);
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg) !important;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateX(450px);
    transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    opacity: 0;
    z-index: 1000;
    pointer-events: auto;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.panel.open {
    transform: translateX(0);
    opacity: 1;
}

.panel.closing {
    transform: translateX(450px) scale(0.98);
    opacity: 0;
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.24s ease;
    pointer-events: none;
}

/* ── Panel Header Row ──────────────────────────────── */
.panel-header {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    background: transparent;
}

.panel-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.4px;
    user-select: none;
    font-family: var(--title-font);
}

/* Circular Control Buttons (Exact ai-sidebar.html .control-btn style) */
.control-btn,
.panel-close {
    width: 34px;
    height: 34px;
    border-radius: 50% !important;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    flex-shrink: 0;
}

.control-btn:hover,
.panel-close:hover {
    background: var(--hover);
    color: var(--text);
    border-color: var(--accent-border);
    transform: scale(1.06);
}

.control-btn:active,
.panel-close:active {
    transform: scale(0.95);
}

#clear-history-btn:hover,
#sb-close-btn:hover {
    background: rgba(239, 68, 68, 0.12) !important;
    color: #EF4444 !important;
    border-color: rgba(239, 68, 68, 0.25) !important;
}

/* ── Segmented Pill Tab Bar (Exact ai-sidebar.html .ai-nav-bar style) ── */
.tab-strip-container {
    padding: 10px 18px 4px;
    flex-shrink: 0;
}

.tab-strip {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill) !important;
    position: relative;
    user-select: none;
}

.tab-pill {
    flex: 1;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 14px;
    border-radius: var(--radius-pill) !important;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
}

.tab-pill i {
    font-size: 12px;
}

.tab-pill:hover:not(.active) {
    color: var(--text);
    background: var(--hover);
}

.tab-pill.active,
body[data-theme="dark"] .tab-pill.active,
body[data-theme="light"] .tab-pill.active {
    color: #FFFFFF !important;
    background: var(--accent) !important;
    font-weight: 800 !important;
}

.tab-pill.active i {
    color: #FFFFFF !important;
}

/* ── Search Bar: Full Pill Border-Radius ───────────── */
.panel-search {
    padding: 4px 18px 10px;
    flex-shrink: 0;
}

.search-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: var(--radius-pill) !important;
    padding: 0 16px;
    height: 38px;
    box-sizing: border-box;
    transition: border-color 0.15s ease;
}

.search-row:focus-within,
body[data-theme="light"] .search-row:focus-within,
body[data-theme="dark"] .search-row:focus-within {
    border-color: var(--accent) !important;
    outline: none;
}

.search-row i {
    font-size: 12.5px;
    color: var(--text-muted);
    flex-shrink: 0;
}

.search-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text);
    font-family: inherit;
}

.search-row input::placeholder {
    color: var(--text-muted);
    font-weight: 400;
}

/* ── Bookmark Toolbar (Pill Buttons) ───────────────── */
.bm-toolbar {
    display: flex;
    gap: 6px;
    padding: 2px 18px 10px;
    flex-shrink: 0;
}

.bm-tool-btn {
    flex: 1;
    height: 34px;
    border-radius: var(--radius-pill) !important;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 11.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap;
    outline: none;
}

.bm-tool-btn:hover {
    background: var(--hover);
    border-color: var(--accent-border);
    color: var(--text);
    transform: translateY(-1px);
}

#ai-classify-btn {
    color: var(--accent) !important;
    border-color: var(--accent-border) !important;
}

#ai-classify-btn:hover {
    background: var(--accent) !important;
    color: #FFFFFF !important;
    border-color: var(--accent) !important;
}

/* ── Inline Folder Input Row ───────────────────────── */
.new-folder-row {
    display: flex;
    gap: 6px;
    padding: 4px 18px 10px;
    flex-shrink: 0;
}

.new-folder-input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: var(--radius-pill) !important;
    padding: 8px 14px;
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    outline: none;
}

.new-folder-input:focus {
    border-color: var(--accent);
}

.new-folder-btn {
    padding: 8px 16px;
    border-radius: var(--radius-pill) !important;
    background: var(--accent);
    border: none;
    color: #FFFFFF;
    font-weight: 800;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s ease;
}

.new-folder-btn:hover {
    opacity: 0.92;
}

/* ── Panel Body / Scroll Container ─────────────────── */
.panel-body {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    padding-bottom: 16px;
}

.panel-body::-webkit-scrollbar {
    width: 5px;
}

.panel-body::-webkit-scrollbar-track {
    background: transparent;
}

.panel-body::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 10px;
}

/* ── Bookmark & Folder Rows (12px Card Border Radius) ── */
.bm-folder {
    margin: 4px 18px;
}

.bm-folder-hdr {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--radius-sm) !important;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
}

.bm-folder-hdr:hover {
    background: var(--card-hover-bg);
    border-color: var(--accent-border);
    transform: translateY(-1px);
}

.bm-folder-icon {
    color: var(--accent);
    font-size: 14px;
    flex-shrink: 0;
}

.bm-folder-name {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    outline: none;
    font-family: inherit;
}

.bm-folder-count {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--badge-text);
    background: var(--badge-bg);
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    flex-shrink: 0;
}

.bm-folder-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s ease;
    flex-shrink: 0;
}

.bm-folder-hdr:hover .bm-folder-actions {
    opacity: 1;
}

.icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 50% !important;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    transition: all 0.15s;
    outline: none;
}

.icon-btn:hover {
    background: var(--hover);
    color: var(--text);
    border-color: var(--border);
}

.icon-btn.del:hover {
    background: rgba(239, 68, 68, 0.12);
    color: #EF4444;
    border-color: rgba(239, 68, 68, 0.25);
}

/* Loose Bookmark Item */
.bm-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    margin: 4px 18px;
    border-radius: var(--radius-sm) !important;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
}

.bm-item:hover {
    background: var(--card-hover-bg);
    border-color: var(--accent-border);
    transform: translateY(-1px);
}

.bm-drag-handle {
    font-size: 11px;
    color: var(--text-muted);
    cursor: grab;
    opacity: 0;
    transition: opacity 0.15s;
    flex-shrink: 0;
}

.bm-item:hover .bm-drag-handle {
    opacity: 0.7;
}

.bm-favicon,
.hist-favicon {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    flex-shrink: 0;
    background: var(--hover);
    object-fit: contain;
}

.hist-favicon-fallback,
.bm-favicon-fallback {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    flex-shrink: 0;
    background: var(--hover);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--text-dim);
    border: 1px solid var(--border);
}

.bm-info {
    flex: 1;
    min-width: 0;
}

.bm-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    outline: none;
    font-family: inherit;
}

.bm-url {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.bm-item-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s ease;
    flex-shrink: 0;
}

.bm-item:hover .bm-item-actions {
    opacity: 1;
}

/* Bookmark Folder Internal Navigation */
.bm-back-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    margin: 4px 18px 8px;
    border-radius: var(--radius-sm) !important;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
}

.bm-back-row:hover {
    background: var(--hover);
    border-color: var(--accent);
    color: var(--accent);
}

.bm-back-row i {
    color: var(--accent);
    font-size: 11px;
}

.bm-breadcrumb {
    padding: 6px 20px 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
}

.bm-breadcrumb i {
    font-size: 9px;
    opacity: 0.6;
}

/* ── Section Labels ────────────────────────────────── */
.recom-title,
.bm-section-label,
.hist-date-label {
    padding: 14px 20px 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
}

.recom-title::after,
.bm-section-label::after,
.hist-date-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
}

.recom-title i,
.bm-section-label i,
.hist-date-label i {
    color: var(--accent);
    font-size: 11px;
}

/* ── History Quick Access Grid (Pill Chips) ────────── */
.hist-recom {
    padding: 0;
    margin-bottom: 4px;
}

.recom-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    padding: 2px 18px 10px;
}

.recom-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: var(--radius-pill) !important;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    cursor: pointer;
    min-width: 0;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.recom-item:hover {
    background: var(--hover);
    border-color: var(--accent-border);
    transform: translateY(-1px);
}

.recom-item img,
.recom-item .icon-wrapper {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: contain;
}

.recom-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
}

/* ── History Items (12px Card Border Radius) ───────── */
.hist-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    margin: 4px 18px;
    border-radius: var(--radius-sm) !important;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    cursor: pointer;
    position: relative;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.hist-item:hover {
    background: var(--card-hover-bg);
    border-color: var(--accent-border);
    transform: translateY(-1px);
}

.hist-item.active-tab-entry.current-active {
    border-left: 3px solid var(--accent) !important;
    background: var(--hover) !important;
}

.hist-info {
    flex: 1;
    min-width: 0;
}

.hist-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hist-meta {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hist-del {
    opacity: 0;
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 50% !important;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
}

.hist-item:hover .hist-del {
    opacity: 1;
}

.hist-del:hover {
    background: rgba(239, 68, 68, 0.12) !important;
    color: #EF4444 !important;
    border-color: rgba(239, 68, 68, 0.25) !important;
}

/* History Group Container */
.hist-group-container {
    margin: 4px 18px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    border-radius: var(--radius-sm) !important;
    overflow: hidden;
    transition: border-color 0.15s;
}

.hist-group-container:hover {
    border-color: var(--accent-border);
}

.hist-group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    cursor: pointer;
    position: relative;
    user-select: none;
    transition: background 0.15s;
}

.hist-group-header:hover {
    background: var(--hover);
}

.hist-group-header .toggle-chevron {
    font-size: 10px;
    color: var(--text-dim);
    transition: transform 0.2s ease;
    width: 12px;
    text-align: center;
    flex-shrink: 0;
}

.hist-group-header.expanded .toggle-chevron {
    transform: rotate(90deg);
}

.hist-group-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hist-group-header .hist-del {
    opacity: 0;
    margin-left: auto;
}

.hist-group-header:hover .hist-del {
    opacity: 1;
}

.hist-group-children {
    border-top: 1px solid var(--border);
    background: var(--hover);
    position: relative;
    padding: 4px 0;
}

.hist-group-children::before {
    content: '';
    position: absolute;
    left: 24px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--border);
}

.hist-group-children .hist-item {
    margin: 0 !important;
    border: none !important;
    border-radius: 0 !important;
    padding-left: 36px !important;
    background: transparent !important;
}

.hist-group-children .hist-item:hover {
    background: color-mix(in srgb, var(--accent) 10%, var(--hover)) !important;
}

/* ── Downloads / Files Tab (12px Card Border Radius) ── */
.dl-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    margin: 4px 18px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm) !important;
    position: relative;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
}

.dl-item:hover {
    background: var(--hover);
    border-color: var(--accent-border);
    transform: translateY(-1px);
}

.dl-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 16px;
    flex-shrink: 0;
    overflow: hidden;
}

.dl-icon img.dl-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Semantic File Type Colors (Solid Badges) */
.dl-item[data-type="pdf"] .dl-icon {
    color: #EF4444;
    background: rgba(239, 68, 68, 0.1);
    border-color: rgba(239, 68, 68, 0.2);
}

.dl-item[data-type="img"] .dl-icon {
    color: #3B82F6;
    background: rgba(59, 130, 246, 0.1);
    border-color: rgba(59, 130, 246, 0.2);
}

.dl-item[data-type="media"] .dl-icon {
    color: #A855F7;
    background: rgba(168, 85, 247, 0.1);
    border-color: rgba(168, 85, 247, 0.2);
}

.dl-item[data-type="code"] .dl-icon {
    color: #10B981;
    background: rgba(16, 185, 129, 0.1);
    border-color: rgba(16, 185, 129, 0.2);
}

.dl-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.dl-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.2px;
}

.dl-status {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.dl-bar-bg {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: var(--radius-pill);
    overflow: hidden;
    margin-top: 4px;
}

.dl-bar {
    height: 100%;
    background: var(--accent);
    border-radius: var(--radius-pill);
    transition: width 0.3s ease;
}

.dl-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
}

.dl-item:hover .dl-actions {
    opacity: 1;
}

.dl-action-btn {
    width: 28px;
    height: 28px;
    border-radius: 50% !important;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    transition: all 0.15s;
    outline: none;
}

.dl-action-btn:hover {
    background: var(--hover);
    color: var(--text);
    border-color: var(--accent-border);
}

.dl-action-btn.del:hover {
    background: rgba(239, 68, 68, 0.12);
    color: #EF4444;
    border-color: rgba(239, 68, 68, 0.25);
}

/* ── Empty State ───────────────────────────────────── */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 70px 24px;
    text-align: center;
    gap: 12px;
}

.empty-state i {
    font-size: 40px;
    color: var(--accent);
    opacity: 0.5;
}

.empty-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.2px;
}

.empty-sub {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-muted);
    max-width: 240px;
    line-height: 1.5;
}

/* ── Context Menu ──────────────────────────────────── */
.ctx-menu {
    position: fixed;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
    min-width: 180px;
    z-index: 10000;
}

.ctx-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s;
}

.ctx-item:hover {
    background: var(--hover);
    color: var(--accent);
}

.ctx-item i {
    font-size: 12px;
    color: var(--accent);
    width: 14px;
    text-align: center;
}

.ctx-sep {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
}

/* ── Custom Modal Dialog (24px Bento Modal + Frosted White Blur) ── */
#modal-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    pointer-events: auto;
    background: rgba(255, 255, 255, 0.25) !important;
    backdrop-filter: blur(4px) !important;
    -webkit-backdrop-filter: blur(4px) !important;
}

:root[data-theme="light"] #modal-overlay,
html[data-theme="light"] #modal-overlay,
body[data-theme="light"] #modal-overlay {
    background: rgba(255, 255, 255, 0.25) !important;
    backdrop-filter: blur(4px) !important;
    -webkit-backdrop-filter: blur(4px) !important;
}

:root[data-theme="dark"] #modal-overlay,
html[data-theme="dark"] #modal-overlay,
body[data-theme="dark"] #modal-overlay {
    background: rgba(0, 0, 0, 0.35) !important;
    backdrop-filter: blur(4px) !important;
    -webkit-backdrop-filter: blur(4px) !important;
}

#modal-overlay.active {
    display: flex;
}

#modal-container {
    width: 380px;
    max-width: calc(100vw - 32px);
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg) !important;
    padding: 30px 24px 24px;
    display: flex;
    flex-direction: column;
    text-align: center;
    position: relative;
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
}

#modal-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--accent-dim);
    border: 1px solid var(--accent-border);
    color: var(--accent);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
}

#modal-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.3px;
    margin-bottom: 8px;
    font-family: inherit;
}

#modal-body {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    font-weight: 500;
    padding: 0 8px;
    margin-bottom: 22px;
    font-family: inherit;
}

#modal-footer {
    display: flex;
    gap: 8px;
}

#modal-cancel {
    flex: 1;
    height: 38px;
    border-radius: var(--radius-pill) !important;
    font-size: 12.5px;
    font-weight: 700;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit;
    outline: none;
}

#modal-cancel:hover {
    background: var(--hover);
    border-color: var(--accent-border);
}

#modal-confirm {
    flex: 1;
    height: 38px;
    border-radius: var(--radius-pill) !important;
    font-size: 12.5px;
    font-weight: 700;
    background: var(--accent) !important;
    color: #FFFFFF !important;
    border: none;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit;
    outline: none;
}

#modal-confirm:hover {
    opacity: 0.92;
    transform: translateY(-1px);
}

/* ── Screenshot Toolbar ────────────────────────────── */
.ss-toolbar {
    position: fixed;
    display: none;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 6px;
    gap: 4px;
    z-index: 10000;
    pointer-events: auto;
    left: 50%;
    top: 60px;
    transform: translateX(-50%);
}

.ss-option {
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    min-width: 76px;
    transition: background 0.15s;
}

.ss-option:hover {
    background: var(--hover);
}

.ss-option i {
    font-size: 16px;
    color: var(--accent);
}

.ss-option span {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
}
</style>
</head>
<body>
<div class="overlay" id="overlay">
    <div class="backdrop" id="backdrop"></div>

    <div class="panel" id="sidebar">
        <!-- Header -->
        <div class="panel-header">
            <span class="panel-title" id="sb-title">Saves</span>
            <div style="display:flex;gap:8px;align-items:center">
                <button class="control-btn panel-close" id="clear-history-btn" title="Clear History" style="display:none;"><i class="fas fa-trash-can"></i></button>
                <button class="control-btn panel-close" id="settings-nav-btn" title="Settings"><i class="fas fa-gear"></i></button>
                <button class="control-btn panel-close" id="sb-close-btn" title="Close"><i class="fas fa-xmark"></i></button>
            </div>
        </div>

        <!-- Segmented Tab Strip (Pill Switcher) -->
        <div class="tab-strip-container">
            <div class="tab-strip">
                <button class="tab-pill active" data-tab="bookmarks"><i class="fas fa-bookmark"></i>Saves</button>
                <button class="tab-pill" data-tab="history"><i class="fas fa-clock-rotate-left"></i>History</button>
                <button class="tab-pill" data-tab="downloads"><i class="fas fa-folder"></i>Files</button>
            </div>
        </div>

        <!-- Search Bar (Full Pill) -->
        <div class="panel-search">
            <div class="search-row">
                <i class="fas fa-magnifying-glass"></i>
                <input type="text" id="sb-search" placeholder="Search Saves...">
            </div>
        </div>

        <!-- Bookmark Toolbar (Pill Buttons) -->
        <div class="bm-toolbar" id="bm-toolbar">
            <button class="bm-tool-btn" id="add-folder-btn"><i class="fas fa-folder-plus"></i>New Folder</button>
            <button class="bm-tool-btn" id="sort-bms-btn"><i class="fas fa-arrow-down-a-z"></i>Sort A–Z</button>
            <button class="bm-tool-btn" id="ai-classify-btn"><i class="fas fa-wand-magic-sparkles"></i>AI Group</button>
        </div>

        <!-- Content Area -->
        <div class="panel-body" id="sb-content"></div>
    </div>
</div>

<div id="ss-toolbar" class="ss-toolbar">
    <div class="ss-option" id="ss-visible"><i class="fas fa-eye"></i><span>Visible</span></div>
    <div class="ss-option" id="ss-full"><i class="fas fa-expand"></i><span>Full Page</span></div>
    <div class="ss-option" id="ss-pdf"><i class="fas fa-file-pdf"></i><span>PDF</span></div>
</div>

<!-- Custom Modal System (24px Bento Modal) -->
<div id="modal-overlay">
    <div id="modal-container">
        <div id="modal-icon"><i class="fas fa-triangle-exclamation"></i></div>
        <div id="modal-title">Confirm Action</div>
        <div id="modal-body">Are you sure you want to proceed?</div>
        <div id="modal-footer">
            <button id="modal-cancel">Cancel</button>
            <button id="modal-confirm">Confirm</button>
        </div>
    </div>
</div>
<script src="sidebars.js"></script>
</body>
</html>
