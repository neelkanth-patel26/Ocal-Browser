<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connecting...</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/fonts/geist-fonts.css">
    <style>
        @import url('./assets/fonts/geist-fonts.css');

        :root {
            --bg: #0D0E11;
            --card-bg: #16181D;
            --chrome-border: rgba(255, 255, 255, 0.05);
            --text: #F0F2F5;
            --text-dim: #A0A5B1;
            --accent: #D4FC2B;
            --font-title: 'Geist', sans-serif;
            --font-main: 'Geist Mono', monospace;
            --radius-lg: 28px;
        }

        body[data-theme="light"] {
            --bg: #F0F2F5;
            --card-bg: #FFFFFF;
            --chrome-border: rgba(0, 0, 0, 0.06);
            --text: #16181D;
            --text-dim: #626773;
            --accent: #15AC49;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-title);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .loading-card {
            background: var(--card-bg);
            border: 1px solid var(--chrome-border);
            border-radius: var(--radius-lg);
            padding: 36px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            transform: scale(0.96);
            opacity: 0;
            animation: cardEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEnter {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .icon-bubble {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: color-mix(in srgb, var(--app-accent, var(--accent)) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--app-accent, var(--accent)) 25%, transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--app-accent, var(--accent));
            transition: all 0.3s ease;
        }

        .app-name {
            font-size: 17px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--chrome-border);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            font-family: var(--font-main);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--app-accent, var(--accent));
            animation: pulseDot 1.4s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* Subtle loading line */
        .progress-bar-track {
            width: 140px;
            height: 3px;
            background: var(--chrome-border);
            border-radius: 100px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar-fill {
            width: 40%;
            height: 100%;
            background: var(--app-accent, var(--accent));
            border-radius: 100px;
            animation: moveProgress 1.2s ease-in-out infinite alternate;
        }

        @keyframes moveProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
    </style>
</head>
<body>
    <div class="loading-card">
        <div class="icon-bubble">
            <i id="app-icon" class="fas fa-globe"></i>
        </div>
        <div class="app-name" id="app-name">Web Application</div>
        <div class="status-pill">
            <span class="status-dot"></span>
            <span id="status-msg">Connecting securely...</span>
        </div>
        <div class="progress-bar-track">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const urlParam = params.get('url') || '';
        const theme = params.get('theme') || 'dark';
        document.body.setAttribute('data-theme', theme);

        let appName = 'Web Application';
        let iconClass = 'fas fa-globe';
        let accentColor = '#D4FC2B';

        if (urlParam.includes('whatsapp.com')) {
            appName = 'WhatsApp';
            iconClass = 'fab fa-whatsapp';
            accentColor = '#25D366';
        } else if (urlParam.includes('instagram.com')) {
            appName = 'Instagram';
            iconClass = 'fab fa-instagram';
            accentColor = '#E1306C';
        } else if (urlParam.includes('x.com') || urlParam.includes('twitter.com')) {
            appName = 'Twitter / X';
            iconClass = 'fab fa-x-twitter';
            accentColor = theme === 'light' ? '#16181D' : '#F0F2F5';
        } else if (urlParam.includes('discord.com')) {
            appName = 'Discord';
            iconClass = 'fab fa-discord';
            accentColor = '#5865F2';
        } else if (urlParam.includes('spotify.com')) {
            appName = 'Spotify';
            iconClass = 'fab fa-spotify';
            accentColor = '#1DB954';
        }

        document.getElementById('app-icon').className = iconClass;
        document.getElementById('app-name').innerText = appName;
        document.getElementById('status-msg').innerText = `Preparing connection...`;
        document.documentElement.style.setProperty('--app-accent', accentColor);
    </script>
</body>
</html>
