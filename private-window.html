<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: dark !important; background: #131b20 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' ocal:; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https: http: chrome-extension: blob:; connect-src 'self' https: wss: http:;">
    <title>InPrivate - Ocal Browser</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <style>
        :root {
            --bg-window: #131b20;
            --bg-navbar: #131b20;
            --border-ui: #22303a;
            --accent: #f87d51;
            --accent-hover: #ff8e66;
            --accent-glow: rgba(248, 125, 81, 0.22);
            --accent-dim: rgba(248, 125, 81, 0.12);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --tab-bg: #1e2b33;
            --tab-active-bg: #f87d51;
            --titlebar-h: 42px;
            --navbar-h: 48px;
            color-scheme: dark !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            background: var(--bg-window) !important;
            color-scheme: dark !important;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        /* ── Top Titlebar ─────────────────────────────────────────── */
        .titlebar {
            height: var(--titlebar-h);
            display: flex;
            align-items: center;
            background: var(--bg-window);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            -webkit-app-region: drag;
            padding-left: 10px;
            z-index: 100;
        }

        /* Sleek InPrivate Brand Capsule */
        .private-brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-right: 12px;
            flex-shrink: 0;
            height: 28px;
            padding: 0 12px;
            border-radius: 100px;
            background: #1e2b33;
            border: 1px solid #283944;
            color: #f87d51;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.02em;
            -webkit-app-region: no-drag;
            transition: all 0.18s ease;
            cursor: default;
        }

        .private-brand-badge i {
            font-size: 12px;
            color: #f87d51;
        }

        .private-brand-badge:hover {
            background: #253642;
            border-color: rgba(248, 125, 81, 0.45);
        }

        /* Tab Area Container */
        .tab-area-container {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 100%;
            max-width: calc(100vw - 230px);
            min-width: 0;
            flex: 0 1 auto;
            -webkit-app-region: no-drag;
        }

        .tabs-strip {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            padding: 3px 0;
            flex: 0 1 auto;
            min-width: 0;
        }

        .tabs-strip::-webkit-scrollbar {
            display: none;
        }

        /* Floating Pill Tab (Solid styling with clean solid states) */
        .private-tab {
            height: 32px;
            max-width: 220px;
            min-width: 110px;
            padding: 0 10px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 10px;
            background: #1e2b33;
            border: 1px solid #283944;
            color: #94a3b8;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            flex: 0 1 200px;
            flex-shrink: 1;
            box-sizing: border-box;
            -webkit-app-region: no-drag;
        }

        .private-tab:hover:not(.active) {
            background: #253642;
            border-color: #354957;
            color: #f8fafc;
        }

        /* Active Tab: Full Solid Accent Color (#f87d51) */
        .private-tab.active {
            background: #f87d51 !important;
            color: #ffffff !important;
            border: 1px solid #f87d51 !important;
            box-shadow: none !important;
            font-weight: 700 !important;
        }

        .private-tab.active .tab-title-text {
            color: #ffffff !important;
            font-weight: 700 !important;
        }

        .tab-favicon {
            width: 15px;
            height: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 12px;
            color: var(--accent);
        }

        .tab-favicon i {
            color: #f87d51;
        }

        .private-tab.active .tab-favicon,
        .private-tab.active .tab-favicon i {
            color: #ffffff !important;
        }

        .tab-favicon img {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }

        .tab-title-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tab-close-btn {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 10px;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.12s ease;
            opacity: 0.65;
            flex-shrink: 0;
        }

        .tab-close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            opacity: 1;
        }

        .private-tab.active .tab-close-btn {
            color: rgba(255, 255, 255, 0.9) !important;
            opacity: 0.9;
        }

        .private-tab.active .tab-close-btn:hover {
            background: rgba(0, 0, 0, 0.22) !important;
            color: #ffffff !important;
            opacity: 1;
        }

        /* Adjacent '+' New Tab Button */
        .new-tab-btn {
            width: 28px;
            height: 28px;
            border-radius: 9px;
            background: #1e2b33;
            border: 1px solid #283944;
            color: #cbd5e1;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            margin-left: 2px;
            flex-shrink: 0;
            -webkit-app-region: no-drag;
        }

        .new-tab-btn:hover {
            background: #253642;
            color: #f87d51;
            border-color: #f87d51;
            transform: scale(1.04);
        }

        .new-tab-btn:active {
            transform: scale(0.96);
        }

        /* Draggable Titlebar Spacer */
        .tab-drag-spacer {
            flex: 1 1 10px;
            height: 100%;
            -webkit-app-region: drag;
        }

        /* ── Apple-Style Window Controls (Matches Normal Browser) ── */
        .window-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            -webkit-app-region: no-drag;
            flex-shrink: 0;
            height: 100%;
            position: relative;
            z-index: 1000;
            background: transparent;
            margin-left: auto;
        }

        .ctrl-btn {
            width: 13px;
            height: 13px;
            min-width: 13px;
            min-height: 13px;
            border-radius: 50% !important;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(0, 0, 0, 0.14);
            -webkit-app-region: no-drag !important;
            box-shadow: none !important;
            padding: 0;
            box-sizing: border-box;
        }

        .ctrl-btn svg {
            width: 7px;
            height: 7px;
            display: block;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .window-controls:hover .ctrl-btn svg,
        .ctrl-btn:hover svg {
            opacity: 0.85;
        }

        .ctrl-btn:hover {
            filter: brightness(0.88);
            transform: scale(1.08);
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .ctrl-close {
            background: #FF5F56 !important;
            border-color: #E0443E !important;
        }
        .ctrl-close svg path {
            stroke: #4D0000 !important;
        }

        .ctrl-min {
            background: #FFBD2E !important;
            border-color: #DEA123 !important;
        }
        .ctrl-min svg path {
            stroke: #5C4100 !important;
        }

        .ctrl-max {
            background: #27C93F !important;
            border-color: #1AAB29 !important;
            position: relative;
        }
        .ctrl-max svg rect {
            stroke: #004D0D !important;
            fill: none !important;
        }

        /* ── Navigation Bar ───────────────────────────────────────── */
        .navbar {
            height: var(--navbar-h);
            background: #131b20 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
            z-index: 99;
        }

        /* Nav controls (back/forward/reload/home) */
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .nav-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px !important;
            background: transparent !important;
            border: none !important;
            color: #94a3b8;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
            box-shadow: none !important;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08) !important;
            color: #ffffff !important;
            transform: none !important;
        }

        .nav-btn:active:not(:disabled) {
            background: rgba(255, 255, 255, 0.14) !important;
            color: #f87d51 !important;
        }

        .nav-btn:disabled {
            opacity: 0.25;
            cursor: default;
            pointer-events: none;
            border: none !important;
        }

        /* Omnibar Address Bar (Matches Normal Browser Superpower Pill) */
        .omnibar-wrap {
            flex: 1;
            height: 36px;
            background: #1e2b33;
            border: 1px solid #283944;
            border-radius: 100px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: none !important;
        }

        .omnibar-wrap:hover {
            border-color: #384f5e;
            background: #22313a;
        }

        .omnibar-wrap:focus-within {
            border-color: #f87d51;
            background: #22313a;
            box-shadow: none !important;
        }

        /* Site Identity / Lock Area (Requested by user) */
        .omnibar-identity {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.18s ease;
        }

        .omnibar-identity:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
        }

        .site-lock-icon {
            font-size: 12px;
            transition: color 0.18s ease;
        }

        .site-lock-icon.secure {
            color: #34d399; /* Green for Secure HTTPS */
        }

        .site-lock-icon.inprivate {
            color: #f87d51; /* Warm Coral for InPrivate */
        }

        .site-lock-icon.insecure {
            color: #f43f5e; /* Red for Insecure HTTP */
        }

        .omnibar-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
        }

        .omnibar-input::placeholder {
            color: #64748b;
            font-weight: 400;
        }

        .omni-clear-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .omni-clear-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* Navbar Right Actions */
        .navbar-actions-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        /* Tracker Shield Pill (Harmonious Clean Styling) */
        .tracker-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            border-radius: 100px;
            background: #1e2b33;
            border: 1px solid #283944;
            color: #e2e8f0;
            font-size: 11.5px;
            font-weight: 600;
            flex-shrink: 0;
            cursor: default;
            transition: all 0.2s ease;
            box-shadow: none !important;
        }

        .tracker-pill i {
            font-size: 11.5px;
            color: #f87d51;
        }

        .tracker-pill #tracker-counter {
            color: #cbd5e1;
            letter-spacing: 0.02em;
        }

        .tracker-pill:hover {
            background: #253642;
            border-color: rgba(248, 125, 81, 0.4);
        }

        

        /* Webview Placeholder Area (BrowserView is attached by Electron) */
        .content-area {
            flex: 1;
            background: var(--bg-window);
            position: relative;
        }

        /* Windows 11 Snap Layouts Flyout */
        .win11-snap-flyout {
            position: fixed;
            top: 42px;
            right: 44px;
            z-index: 999999;
            background: rgba(24, 25, 34, 0.96);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 10px 12px 12px;
            box-shadow: none !important;
            user-select: none;
            -webkit-user-select: none;
            animation: win11SnapIn 0.16s cubic-bezier(0.1, 0.9, 0.2, 1);
            transform-origin: top right;
        }

        @keyframes win11SnapIn {
            from { opacity: 0; transform: scale(0.96) translateY(-4px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .win11-snap-title {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: #94a3b8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .win11-snap-grid {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .snap-layout-card {
            width: 68px;
            height: 48px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 3px;
            display: flex;
            gap: 2.5px;
            box-sizing: border-box;
            transition: border-color 0.15s ease;
        }

        .snap-layout-card:hover {
            border-color: rgba(255, 255, 255, 0.22);
        }

        .snap-zone {
            background: rgba(255, 255, 255, 0.14);
            border-radius: 3px;
            transition: background 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
            flex: 1;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .snap-zone:hover {
            background: #f87d51 !important;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: none !important;
        }

        .layout-67-33 .snap-zone:first-child { flex: 2; }
        .layout-67-33 .snap-zone:last-child { flex: 1; }
        .layout-three .snap-zone { flex: 1; }

        .layout-quad {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2.5px;
        }
        .layout-quad .snap-zone {
            flex: none;
            width: 100%;
            height: 100%;
        }
        /* ── Private Session Close Confirmation Modal ── */
        .private-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 15, 18, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .private-modal-card {
            background: #1e2b33;
            border: 1px solid #283944;
            border-radius: 16px;
            padding: 28px 24px 20px;
            width: 380px;
            max-width: 90vw;
            text-align: center;
            box-shadow: none !important;
            animation: modalScaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .private-modal-icon {
            width: 52px;
            height: 52px;
            background: #253642;
            border: 1px solid #334756;
            color: #f87d51;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin: 0 auto 16px auto;
            box-shadow: none !important;
        }
        .private-modal-card h3 {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 8px 0;
            font-family: inherit;
            letter-spacing: -0.2px;
        }
        .private-modal-card p {
            color: #94a3b8;
            font-size: 12.5px;
            line-height: 1.5;
            margin: 0 0 20px 0;
        }
        .private-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .private-modal-actions .modal-btn {
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
            flex: 1;
            outline: none;
            border: none;
            box-shadow: none !important;
            font-family: inherit;
        }
        .private-modal-actions .cancel-btn {
            background: #253642;
            border: 1px solid #334756;
            color: #cbd5e1;
        }
        .private-modal-actions .cancel-btn:hover {
            background: #2d3f4d;
            border-color: #3f5566;
            color: #ffffff;
        }
        .private-modal-actions .danger-btn {
            background: #f87d51;
            border: 1px solid #f87d51;
            color: #ffffff;
        }
        .private-modal-actions .danger-btn:hover {
            background: #ff8e66;
            border-color: #ff8e66;
            transform: none !important;
        }
        .private-dont-ask-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 11.5px;
            color: #94a3b8;
            margin-top: 14px;
            cursor: pointer;
            user-select: none;
        }
        .private-dont-ask-label input {
            accent-color: #f87d51;
            cursor: pointer;
        }
    </style>
</head>
<body data-theme="dark">
    <!-- ── Titlebar with Private Tabs ── -->
    <div class="titlebar">
        <!-- InPrivate Capsule Brand Badge -->
        <div class="private-brand-badge" title="InPrivate Browsing — Zero History & Data Saved">
            <i class="fas fa-shield-halved"></i>
            <span>InPrivate</span>
        </div>

        <div class="tab-area-container">
            <div class="tabs-strip" id="tabs-strip">
                <!-- Tabs rendered dynamically -->
            </div>
            <button class="new-tab-btn" id="btn-new-tab" title="New Private Tab (Ctrl+T)">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <div class="tab-drag-spacer"></div>

        <!-- Apple macOS-Style Window Controls (Matches Normal Browser) -->
        <div class="window-controls">
            <div class="ctrl-btn ctrl-min" id="win-min-btn" title="Minimize">
                <svg width="7" height="7" viewBox="0 0 10 10"><path d="M1.5 5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </div>
            <div class="ctrl-btn ctrl-max" id="win-max-btn" title="Maximize">
                <svg width="7" height="7" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            </div>
            <div class="ctrl-btn ctrl-close" id="win-close-btn" title="Close Private Window">
                <svg width="7" height="7" viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
        </div>
    </div>

    <!-- ── Navigation Bar ── -->
    <div class="navbar">
        <div class="nav-controls">
            <button class="nav-btn" id="btn-back" title="Back (Alt+Left)" disabled>
                <i class="fas fa-arrow-left"></i>
            </button>
            <button class="nav-btn" id="btn-forward" title="Forward (Alt+Right)" disabled>
                <i class="fas fa-arrow-right"></i>
            </button>
            <button class="nav-btn" id="btn-reload" title="Reload (Ctrl+R)">
                <i class="fas fa-rotate-right"></i>
            </button>
            <button class="nav-btn" id="btn-home" title="InPrivate Start Page">
                <i class="fas fa-house"></i>
            </button>
        </div>

        <form class="omnibar-wrap" id="omnibar-form" onsubmit="handleNavigate(event)">
            <!-- Site Identity / Lock Icon (User Requested) -->
            <div class="omnibar-identity" id="identity-btn" title="InPrivate Mode — Zero History & Data Saved">
                <i class="fas fa-shield-halved site-lock-icon inprivate" id="site-lock-icon"></i>
            </div>
            <input type="text" class="omnibar-input" id="url-input" placeholder="Search privately or enter URL..." autocomplete="off" spellcheck="false">
            <button type="button" class="omni-clear-btn" id="btn-clear-omnibar" title="Clear URL" style="display: none;">
                <i class="fas fa-xmark"></i>
            </button>
        </form>

        <div class="navbar-actions-right">
            <div class="tracker-pill" id="tracker-pill" title="Third-party tracking beacons & telemetry neutralized">
                <i class="fas fa-shield-halved"></i>
                <span id="tracker-counter">0 Blocked</span>
            </div>
        </div>
    </div>

    <!-- ── Active View Anchor ── -->
    <div class="content-area" id="content-area"></div>

    <!-- Private Session Close Confirmation Modal -->
    <div class="private-modal-overlay" id="private-session-confirm-modal" style="display: none;">
        <div class="private-modal-card">
            <div class="private-modal-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h3>Close Private Window?</h3>
            <p id="private-session-confirm-desc">You have multiple private tabs open. Are you sure you want to close this window and end your private session?</p>
            <div class="private-modal-actions">
                <button class="modal-btn cancel-btn" id="private-session-cancel-btn">Cancel</button>
                <button class="modal-btn danger-btn" id="private-session-close-btn">Close Tabs</button>
            </div>
            <label class="private-dont-ask-label">
                <input type="checkbox" id="private-dont-ask-cb">
                <span>Don't ask again</span>
            </label>
        </div>
    </div>

    <script src="private-window.js"></script>
</body>
</html>
