<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:;">
    <title>Ocal Snake | Cyber Slither</title>
    <!-- ANTI-FLASH: must be FIRST in head -->
    <script>
        (function () {
            var t = localStorage.getItem('ocal-settings-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
            if (t === 'dark') {
                document.documentElement.style.background = '#0D0E11';
                document.documentElement.style.colorScheme = 'dark';
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    
    <style>
        :root {
            --bg: #0D0E11;
            --card-bg: #16181D;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #D4FC2B;
            --accent-glow: rgba(212, 252, 43, 0.3);
            --text-main: #F0F2F5;
            --text-dim: #A0A5B1;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        body[data-theme="light"] {
            --bg: #F0F2F5;
            --card-bg: #FFFFFF;
            --border: rgba(0, 0, 0, 0.08);
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.25);
            --text-main: #16181D;
            --text-dim: #626773;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .header-bar {
            position: absolute;
            top: 24px;
            left: 32px;
            right: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-title i {
            color: var(--accent);
        }

        .back-btn {
            padding: 8px 18px;
            border-radius: 100px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 24px 32px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
            position: relative;
            transition: background 0.3s ease;
        }

        .hud-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hud-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 16px;
            border-radius: 100px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
        }

        body[data-theme="light"] .hud-pill {
            background: rgba(0, 0, 0, 0.04);
        }

        .hud-val {
            font-family: var(--font-mono);
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .hud-val.hi {
            color: var(--text-dim);
        }

        .canvas-container {
            position: relative;
            background: #090A0D;
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        body[data-theme="light"] .canvas-container {
            background: #F8F9FA;
        }

        canvas {
            display: block;
        }

        .controls-hint {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
        }

        .key-badge {
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 10.5px;
        }

        body[data-theme="light"] .key-badge {
            background: rgba(0, 0, 0, 0.05);
        }

        /* Overlay Modals */
        .overlay-modal {
            position: absolute;
            inset: 0;
            background: rgba(9, 10, 13, 0.94);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 100;
            border-radius: 28px;
            transition: opacity 0.25s ease;
        }

        body[data-theme="light"] .overlay-modal {
            background: rgba(255, 255, 255, 0.95);
            color: #16181D;
        }

        .modal-title-text {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
        }

        body[data-theme="light"] .modal-title-text {
            color: #16181D !important;
        }

        .modal-sub-text {
            font-size: 13px;
            color: var(--text-dim);
        }

        body[data-theme="light"] .modal-sub-text {
            color: #626773 !important;
        }

        .modal-btn {
            padding: 12px 28px;
            border-radius: 100px;
            background: var(--accent);
            color: #000000;
            font-size: 13px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        body[data-theme="light"] .modal-btn {
            color: #FFFFFF;
        }

        .modal-btn:hover {
            transform: scale(1.04);
        }
    </style>
</head>
<body data-theme="light">

    <div class="header-bar">
        <div class="brand-title">
            <i class="fas fa-ring"></i> Ocal Snake (Cyber Slither)
        </div>
        <a href="games.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Games Hub
        </a>
    </div>

    <div class="game-layout">
        <div class="hud-row">
            <div class="hud-pill">
                <span style="font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase;">BEST</span>
                <span class="hud-val hi" id="best">0</span>
            </div>
            <div class="hud-pill">
                <span style="font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase;">SCORE</span>
                <span class="hud-val" id="score">0</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="440" height="440"></canvas>
        </div>

        <div class="controls-hint">
            <span><span class="key-badge">W</span> <span class="key-badge">A</span> <span class="key-badge">S</span> <span class="key-badge">D</span> or <span class="key-badge">Arrows</span> TO MOVE</span>
        </div>

        <!-- Start Overlay -->
        <div class="overlay-modal" id="startOverlay">
            <div class="modal-title-text">OCAL SNAKE</div>
            <div class="modal-sub-text">Collect data-bits and power-ups in cyber neon grid</div>
            <button class="modal-btn" onclick="startGame()">
                <i class="fas fa-play"></i> START GAME
            </button>
        </div>

        <!-- Game Over Overlay -->
        <div class="overlay-modal" id="gameOverOverlay" style="display: none;">
            <div class="modal-title-text">GAME OVER</div>
            <div style="font-size: 16px; font-family: var(--font-mono); color: var(--accent);" id="finalScore">SCORE: 0</div>
            <button class="modal-btn" onclick="startGame()">
                <i class="fas fa-rotate-right"></i> PLAY AGAIN
            </button>
        </div>
    </div>

    <script src="snake.js"></script>
</body>
</html>
