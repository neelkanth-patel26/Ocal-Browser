<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Booster</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.3);
            --lime: #D4FC2B;
            --bg-glass: #16181D;
            --border-glass: rgba(255, 255, 255, 0.08);
            --card-bg: #20242D;
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-bg: #2A2E3B;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --radius: 16px;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --theme-color: #D4FC2B;
        }

        body[data-theme="light"], body {
            --bg-glass: #FFFFFF;
            --border-glass: rgba(0, 0, 0, 0.06);
            --card-bg: #F4F4F6;
            --card-border: rgba(0, 0, 0, 0.04);
            --card-hover-bg: #EAEBED;
            --text-primary: #111111;
            --text-secondary: #475569;
            --theme-color: #15AC49;
        }

        body[data-theme="dark"] {
            --bg-glass: #16181D;
            --border-glass: rgba(255, 255, 255, 0.08);
            --card-bg: #20242D;
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-bg: #2A2E3B;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --theme-color: #D4FC2B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: var(--font-main);
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: var(--text-primary);
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 8px;
            -webkit-font-smoothing: antialiased;
        }

        .popup-overlay {
            position: fixed;
            inset: 0;
            background: transparent;
            z-index: 1;
        }

        .volume-boost-card {
            position: relative;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 260px;
            z-index: 2;
            opacity: 1;
            transform: none;
            pointer-events: all;
            border-radius: var(--radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        /* Header */
        .vb-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vb-icon-badge {
            width: 26px;
            height: 26px;
            background: rgba(21, 172, 73, 0.15);
            border: 1px solid var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 11px;
        }

        .vb-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .header-btn:hover {
            background: var(--theme-color);
            color: #111111;
        }

        /* Display Dashboard */
        .vb-display {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .vb-percentage {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -1px;
            font-family: var(--font-mono);
            line-height: 1;
        }

        body[data-theme="dark"] .vb-percentage {
            color: #D4FC2B !important;
        }

        .level-badge {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 100px;
            background: rgba(212, 252, 43, 0.15);
            color: var(--theme-color);
            border: 1px solid var(--theme-color);
        }

        /* Slider */
        .slider-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .vb-slider-track {
            position: relative;
            width: 100%;
            height: 18px;
            display: flex;
            align-items: center;
        }

        .vb-slider {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            outline: none;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        body[data-theme="light"] .vb-slider {
            background: rgba(0, 0, 0, 0.1);
        }

        .vb-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #D4FC2B;
            cursor: pointer;
            transition: transform 0.15s ease;
            border: 2px solid #111111;
            box-shadow: 0 0 8px rgba(212, 252, 43, 0.6);
        }

        .vb-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .vb-labels {
            display: flex;
            justify-content: space-between;
            font-size: 8px;
            font-weight: 800;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            padding: 0 2px;
        }

        /* Preset Buttons Grid */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .vb-preset {
            height: 30px;
            border-radius: 100px !important;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            font-size: 10px;
            font-weight: 800;
            font-family: var(--font-mono);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .vb-preset:hover {
            background: var(--card-hover-bg);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .vb-preset.active {
            background: #D4FC2B !important;
            color: #111111 !important;
            border-color: #D4FC2B !important;
            box-shadow: 0 2px 6px rgba(212, 252, 43, 0.35);
        }
    </style>
</head>
<body data-theme="dark">
    <script>
        (function () {
            const t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.body.setAttribute('data-theme', t);
        })();
    </script>
    <div class="popup-overlay" id="popup-overlay"></div>

    <div class="volume-boost-card" id="vb-card">
        <div class="vb-header">
            <div class="brand-box">
                <div class="vb-icon-badge"><i class="fas fa-volume-high" id="vb-icon"></i></div>
                <span class="vb-title">Volume Booster</span>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="vb-reset-btn" title="Reset Volume"><i class="fas fa-rotate-left"></i></button>
                <button class="header-btn" id="vb-close-btn" title="Close"><i class="fas fa-xmark"></i></button>
            </div>
        </div>

        <div class="vb-display">
            <span class="vb-percentage" id="vb-value">100%</span>
            <span class="level-badge" id="vb-level-text">STANDARD</span>
        </div>

        <div class="slider-section">
            <div class="vb-slider-track">
                <input type="range" class="vb-slider" id="vb-range" min="100" max="500" value="100" step="5">
            </div>
            <div class="vb-labels">
                <span>100%</span>
                <span>200%</span>
                <span>300%</span>
                <span>400%</span>
                <span>500%</span>
            </div>
        </div>

        <div class="preset-grid">
            <button class="vb-preset active" data-preset="100">100%</button>
            <button class="vb-preset" data-preset="150">150%</button>
            <button class="vb-preset" data-preset="200">200%</button>
            <button class="vb-preset" data-preset="350">350%</button>
            <button class="vb-preset" data-preset="500">500%</button>
        </div>
    </div>

    <script src="volume-booster.js"></script>
</body>
</html>
