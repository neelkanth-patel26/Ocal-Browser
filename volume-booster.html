<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Booster</title>
    <!-- ANTI-FLASH & COLOR HARMONIZER -->
    <script src="color-harmonizer.js"></script>
    <script>
        (function () {
            var t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
            var a = localStorage.getItem('ocal-settings-accent');
            if (window.OcalColorHarmonizer) {
                window.OcalColorHarmonizer.applyHarmonizedTheme(a, t);
            }
        })();
    </script>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.22);
            --accent-dim: rgba(21, 172, 73, 0.12);
            --accent-text: #FFFFFF;
            --bg-glass: #FFFFFF;
            --border-glass: rgba(0, 0, 0, 0.08);
            --card-bg: #F6F7F9;
            --card-border: rgba(0, 0, 0, 0.05);
            --card-hover-bg: #EEF0F4;
            --text-primary: #121417;
            --text-secondary: #58606E;
            --text-muted: #8A92A0;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius: 18px;
        }

        [data-theme="dark"], body[data-theme="dark"] {
            --bg-glass: #17191E;
            --border-glass: rgba(255, 255, 255, 0.08);
            --card-bg: #1F2228;
            --card-border: rgba(255, 255, 255, 0.05);
            --card-hover-bg: #282C34;
            --text-primary: #F3F4F6;
            --text-secondary: #9AA2B1;
            --text-muted: #6B7280;
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            box-shadow: none !important;
        }

        body {
            font-family: var(--font-main);
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: var(--text-primary);
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 6px;
            -webkit-font-smoothing: antialiased;
        }

        .popup-overlay {
            display: none;
        }

        .volume-boost-card {
            position: relative;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 13px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 272px;
            z-index: 2;
            border-radius: var(--radius);
            box-shadow: none !important;
        }

        /* Header */
        .vb-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 9px;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .vb-icon-badge {
            width: 30px;
            height: 30px;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }

        .vb-icon-badge svg {
            display: block;
        }

        .vb-title {
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
            outline: none;
            box-shadow: none !important;
        }

        .header-btn svg {
            display: block;
        }

        .header-btn:hover {
            background: var(--card-hover-bg);
            color: var(--accent);
            border-color: var(--accent);
            transform: scale(1.06);
        }

        /* Hero Display Dashboard */
        .vb-display {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .vb-percentage {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -1.2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .level-badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 4px 9px;
            border-radius: 999px;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .level-badge::before {
            content: '';
            width: 4.5px;
            height: 4.5px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }

        /* Slider Section */
        .slider-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .vb-slider-track {
            position: relative;
            width: 100%;
            height: 20px;
            display: flex;
            align-items: center;
        }

        .vb-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(140, 150, 165, 0.25);
            border-radius: 999px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: none !important;
        }

        [data-theme="light"] .vb-slider {
            background: #E2E8F0;
        }

        .vb-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.15s ease;
            border: 2px solid #FFFFFF;
            box-shadow: none !important;
        }

        [data-theme="dark"] .vb-slider::-webkit-slider-thumb {
            border-color: #17191E;
        }

        .vb-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: none !important;
        }

        .vb-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            padding: 0 2px;
        }

        /* Preset Buttons Grid */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .vb-preset {
            height: 32px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.16s ease;
            outline: none;
            box-shadow: none !important;
        }

        .vb-preset:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        .vb-preset.active {
            background: var(--accent) !important;
            color: var(--accent-text) !important;
            border-color: var(--accent) !important;
            box-shadow: none !important;
            font-weight: 800;
        }
    </style>
</head>
<body data-theme="dark">
    <script>
        (function () {
            const t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.body.setAttribute('data-theme', t);
        })();
    </script>

    <div class="volume-boost-card" id="vb-card">
        <div class="vb-header">
            <div class="brand-box">
                <div class="vb-icon-badge">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                </div>
                <span class="vb-title">Volume Booster</span>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="vb-reset-btn" title="Reset to 100%">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </button>
                <button class="header-btn" id="vb-close-btn" title="Close">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18"/>
                        <path d="m6 6 12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="vb-display">
            <span class="vb-percentage" id="vb-value">100%</span>
            <span class="level-badge" id="vb-level-text">STANDARD</span>
        </div>

        <div class="slider-section">
            <div class="vb-slider-track">
                <input type="range" class="vb-slider" id="vb-range" min="100" max="500" value="100" step="5" aria-label="Volume Boost">
            </div>
            <div class="vb-labels">
                <span>100%</span>
                <span>200%</span>
                <span>300%</span>
                <span>400%</span>
                <span>500%</span>
            </div>
        </div>

        <div class="preset-grid">
            <button class="vb-preset active" data-preset="100">100%</button>
            <button class="vb-preset" data-preset="150">150%</button>
            <button class="vb-preset" data-preset="200">200%</button>
            <button class="vb-preset" data-preset="350">350%</button>
            <button class="vb-preset" data-preset="500">500%</button>
        </div>
    </div>

    <script src="volume-booster.js"></script>
</body>
</html>
