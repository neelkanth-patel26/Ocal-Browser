<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' ocal:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self';">
    <title>Volume Booster</title>
    <!-- ANTI-FLASH & COLOR HARMONIZER -->
    <script src="color-harmonizer.js"></script>
    <script>
        (function () {
            var t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
            var a = localStorage.getItem('ocal-settings-accent');
            if (window.OcalColorHarmonizer) {
                window.OcalColorHarmonizer.applyHarmonizedTheme(a, t);
            }
        })();
    </script>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.22);
            --accent-dim: rgba(21, 172, 73, 0.12);
            --accent-text: #FFFFFF;
            --bg-glass: #FFFFFF;
            --border-glass: rgba(0, 0, 0, 0.08);
            --card-bg: #F6F7F9;
            --card-border: rgba(0, 0, 0, 0.05);
            --card-hover-bg: #EEF0F4;
            --text-primary: #121417;
            --text-secondary: #58606E;
            --text-muted: #8A92A0;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius: 18px;
        }

        [data-theme="dark"], body[data-theme="dark"] {
            --bg-glass: #17191E;
            --border-glass: rgba(255, 255, 255, 0.08);
            --card-bg: #1F2228;
            --card-border: rgba(255, 255, 255, 0.05);
            --card-hover-bg: #282C34;
            --text-primary: #F3F4F6;
            --text-secondary: #9AA2B1;
            --text-muted: #6B7280;
            color-scheme: dark;
        }

        /* Global hidden scrollbar configuration */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            box-shadow: none !important;
            scrollbar-width: none !important; /* Firefox */
            -ms-overflow-style: none !important; /* IE / Edge */
        }

        *::-webkit-scrollbar,
        body::-webkit-scrollbar,
        div::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }

        body {
            font-family: var(--font-main);
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: var(--text-primary);
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 6px;
            -webkit-font-smoothing: antialiased;
        }

        .volume-card {
            position: relative;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 13px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 272px;
            max-height: calc(100vh - 12px);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 2;
            border-radius: var(--radius);
            box-shadow: none !important;
        }

        /* Header matching shield-popup.html */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 9px;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .vb-icon-badge {
            width: 30px;
            height: 30px;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }

        .vb-icon-badge svg {
            display: block;
        }

        .header h2 {
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reset-icon-btn {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
            outline: none;
            flex-shrink: 0;
        }

        .reset-icon-btn:hover {
            color: var(--accent);
            background: var(--card-hover-bg);
            border-color: var(--accent);
        }

        /* Unified Bento Dashboard */
        .stats-dashboard {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 13px;
            border-radius: 13px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .volume-hero-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .stat-value-big {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.7px;
            transition: color 0.18s ease;
        }

        .stat-label-sub {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-text);
            background: var(--accent);
            padding: 3.5px 9px;
            border-radius: 999px;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .status-badge::before {
            content: '';
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #FFFFFF;
            opacity: 0.9;
        }

        .vb-slider-track {
            position: relative;
            width: 100%;
            height: 18px;
            display: flex;
            align-items: center;
        }

        .vb-slider {
            width: 100%;
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(140, 150, 165, 0.25);
            border-radius: 999px;
            outline: none;
            cursor: pointer;
            transition: all 0.18s ease;
            box-shadow: none !important;
        }

        [data-theme="light"] .vb-slider {
            background: #E2E8F0;
        }

        .vb-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
            border: 2px solid #FFFFFF;
            box-shadow: none !important;
        }

        [data-theme="dark"] .vb-slider::-webkit-slider-thumb {
            border-color: #17191E;
        }

        .vb-slider::-webkit-slider-thumb:hover {
            transform: scale(1.22);
        }

        .vb-labels {
            display: flex;
            justify-content: space-between;
            font-size: 9.5px;
            font-weight: 600;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            padding: 0 1px;
            margin-top: -3px;
        }

        /* Preset Buttons Grid */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-top: 1px;
        }

        .vb-preset {
            height: 27px;
            border-radius: 8px;
            background: var(--card-hover-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            font-size: 10.5px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.16s ease;
            outline: none;
        }

        .vb-preset:hover {
            background: var(--card-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        .vb-preset.active {
            background: var(--accent) !important;
            color: var(--accent-text) !important;
            border-color: var(--accent) !important;
            font-weight: 800;
        }

        /* Toggle items list matching shield-popup.html */
        .toggle-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 11px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        .toggle-item:hover {
            background: var(--card-hover-bg);
            border-color: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] .toggle-item:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .toggle-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .toggle-icon-badge {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: var(--card-hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }

        .toggle-icon-badge svg {
            display: block;
        }

        .toggle-info {
            display: flex;
            flex-direction: column;
            gap: 1.5px;
        }

        .toggle-title {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.1px;
        }

        .toggle-desc {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* iOS-Style Switches matching shield-popup.html */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: rgba(140, 150, 165, 0.3);
            transition: background 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 999px;
            box-shadow: none !important;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: #FFFFFF;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 50%;
            box-shadow: none !important;
        }

        input:checked + .slider {
            background: var(--accent) !important;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
            background: #FFFFFF !important;
        }
    </style>
</head>
<body data-theme="dark">
    <script>
        (function () {
            const t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.body.setAttribute('data-theme', t);
        })();
    </script>

    <div class="volume-card" id="volume-card">
        <!-- Header -->
        <div class="header">
            <div class="brand-box">
                <div class="vb-icon-badge">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                </div>
                <h2>Volume Booster</h2>
            </div>
            <button class="reset-icon-btn" id="vb-reset-btn" title="Reset Volume to 100%">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
            </button>
        </div>

        <!-- Clean Bento Dashboard (Hero + Slider + Presets) -->
        <div class="stats-dashboard">
            <div class="volume-hero-row">
                <div class="stat-group">
                    <span class="stat-value-big" id="vb-value">100%</span>
                    <span class="stat-label-sub" id="vb-status-sub">Standard Output</span>
                </div>
                <span class="status-badge" id="vb-level-text">STANDARD</span>
            </div>

            <div class="vb-slider-track">
                <input type="range" class="vb-slider" id="vb-range" min="100" max="500" value="100" step="5" aria-label="Volume Boost">
            </div>

            <div class="vb-labels">
                <span>100%</span>
                <span>200%</span>
                <span>300%</span>
                <span>400%</span>
                <span>500%</span>
            </div>

            <div class="preset-grid">
                <button class="vb-preset active" data-preset="100">100%</button>
                <button class="vb-preset" data-preset="150">150%</button>
                <button class="vb-preset" data-preset="200">200%</button>
                <button class="vb-preset" data-preset="300">300%</button>
                <button class="vb-preset" data-preset="500">500%</button>
            </div>
        </div>

        <!-- Toggle Items Section (Matching shield-popup) -->
        <div class="toggle-section">
            <div class="toggle-item">
                <div class="toggle-left">
                    <div class="toggle-icon-badge">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                        </svg>
                    </div>
                    <div class="toggle-info">
                        <span class="toggle-title">Audio Booster</span>
                        <span class="toggle-desc">Amplify sound over 100%</span>
                    </div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="boost-master-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle-item">
                <div class="toggle-left">
                    <div class="toggle-icon-badge">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 10v3"/>
                            <path d="M6 6v11"/>
                            <path d="M10 3v18"/>
                            <path d="M14 8v7"/>
                            <path d="M18 5v13"/>
                            <path d="M22 10v4"/>
                        </svg>
                    </div>
                    <div class="toggle-info">
                        <span class="toggle-title">Anti-Clipping Limiter</span>
                        <span class="toggle-desc">Prevent distortion & crackle</span>
                    </div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="limiter-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script src="volume-booster.js"></script>
</body>
</html>
