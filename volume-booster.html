<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Booster</title>
    <!-- ANTI-FLASH & COLOR HARMONIZER -->
    <script src="color-harmonizer.js"></script>
    <script>
        (function () {
            var t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
            var a = localStorage.getItem('ocal-settings-accent');
            if (window.OcalColorHarmonizer) {
                window.OcalColorHarmonizer.applyHarmonizedTheme(a, t);
            }
        })();
    </script>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.25);
            --accent-dim: rgba(21, 172, 73, 0.12);
            --accent-text: #FFFFFF;
            --bg-glass: #FFFFFF;
            --border-glass: rgba(0, 0, 0, 0.08);
            --card-bg: #F4F4F6;
            --card-border: rgba(0, 0, 0, 0.06);
            --card-hover-bg: #EAEBED;
            --text-primary: #111111;
            --text-secondary: #555860;
            --text-muted: #7E8492;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Space Mono', monospace;
            --radius: 20px;
        }

        [data-theme="dark"], body[data-theme="dark"] {
            --bg-glass: #16181D;
            --border-glass: rgba(255, 255, 255, 0.08);
            --card-bg: #1F222A;
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-bg: #272B35;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: var(--font-main);
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: var(--text-primary);
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 6px;
            -webkit-font-smoothing: antialiased;
        }

        .popup-overlay {
            position: fixed;
            inset: 0;
            background: transparent;
            z-index: 1;
        }

        .volume-boost-card {
            position: relative;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 270px;
            z-index: 2;
            opacity: 1;
            border-radius: var(--radius);
            box-shadow: none !important;
        }

        [data-theme="dark"] .volume-boost-card {
            box-shadow: none !important;
        }

        /* Header */
        .vb-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .vb-icon-badge {
            width: 30px;
            height: 30px;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 13px;
        }

        .vb-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            outline: none;
        }

        .header-btn:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
            transform: scale(1.08);
        }

        /* Display Dashboard */
        .vb-display {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .vb-percentage {
            font-family: var(--font-mono);
            font-size: 30px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -1px;
            line-height: 1;
        }

        .level-badge {
            font-family: var(--font-mono);
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 100px;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .level-badge::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }

        /* Slider Area */
        .slider-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .vb-slider-track {
            position: relative;
            width: 100%;
            height: 18px;
            display: flex;
            align-items: center;
        }

        .vb-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(148, 163, 184, 0.25);
            border-radius: 100px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .vb-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: none !important;
            cursor: pointer;
            transition: transform 0.15s ease;
            border: 2px solid #FFFFFF;
        }

        .vb-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        .vb-labels {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            font-weight: 700;
            color: var(--text-muted);
            font-family: var(--font-mono);
            padding: 0 2px;
        }

        /* Preset Buttons Grid */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .vb-preset {
            height: 32px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            font-size: 10.5px;
            font-weight: 700;
            font-family: var(--font-mono);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            outline: none;
        }

        .vb-preset:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        .vb-preset.active {
            background: var(--accent) !important;
            color: var(--accent-text) !important;
            border-color: var(--accent) !important;
            box-shadow: none !important;
            font-weight: 800;
        }
    </style>
</head>
<body data-theme="dark">
    <script>
        (function () {
            const t = localStorage.getItem('ocal-settings-theme') || 'dark';
            document.body.setAttribute('data-theme', t);
        })();
    </script>
    <div class="popup-overlay" id="popup-overlay"></div>

    <div class="volume-boost-card" id="vb-card">
        <div class="vb-header">
            <div class="brand-box">
                <div class="vb-icon-badge"><i class="fas fa-volume-high" id="vb-icon"></i></div>
                <span class="vb-title">Volume Booster</span>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="vb-reset-btn" title="Reset Volume"><i class="fas fa-rotate-left"></i></button>
                <button class="header-btn" id="vb-close-btn" title="Close"><i class="fas fa-xmark"></i></button>
            </div>
        </div>

        <div class="vb-display">
            <span class="vb-percentage" id="vb-value">100%</span>
            <span class="level-badge" id="vb-level-text">STANDARD</span>
        </div>

        <div class="slider-section">
            <div class="vb-slider-track">
                <input type="range" class="vb-slider" id="vb-range" min="100" max="500" value="100" step="5" aria-label="Volume Boost">
            </div>
            <div class="vb-labels">
                <span>100%</span>
                <span>200%</span>
                <span>300%</span>
                <span>400%</span>
                <span>500%</span>
            </div>
        </div>

        <div class="preset-grid">
            <button class="vb-preset active" data-preset="100">100%</button>
            <button class="vb-preset" data-preset="150">150%</button>
            <button class="vb-preset" data-preset="200">200%</button>
            <button class="vb-preset" data-preset="350">350%</button>
            <button class="vb-preset" data-preset="500">500%</button>
        </div>
    </div>

    <script src="volume-booster.js"></script>
</body>
</html>
