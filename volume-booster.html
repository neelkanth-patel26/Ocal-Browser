<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Booster</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #15AC49;
            --accent-glow: rgba(21, 172, 73, 0.25);
            --accent-dim: rgba(21, 172, 73, 0.12);
            --bg-glass: #16181D;
            --border-glass: rgba(255, 255, 255, 0.08);
            --card-bg: #20242D;
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-bg: #2A2E3B;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --radius: 18px;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body[data-theme="light"], body {
            --bg-glass: #FFFFFF;
            --border-glass: rgba(0, 0, 0, 0.08);
            --card-bg: #F8FAFC;
            --card-border: rgba(0, 0, 0, 0.06);
            --card-hover-bg: #F1F5F9;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
        }

        body[data-theme="dark"] {
            --bg-glass: #16181D;
            --border-glass: rgba(255, 255, 255, 0.08);
            --card-bg: #20242D;
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-bg: #2A2E3B;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: var(--font-main);
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: var(--text-primary);
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 8px;
            -webkit-font-smoothing: antialiased;
        }

        .popup-overlay {
            position: fixed;
            inset: 0;
            background: transparent;
            z-index: 1;
        }

        .volume-boost-card {
            position: relative;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 290px;
            z-index: 2;
            opacity: 1;
            transform: none;
            pointer-events: all;
            border-radius: var(--radius);
            box-shadow: none !important;
        }

        /* Header */
        .vb-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vb-icon-badge {
            width: 32px;
            height: 32px;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .vb-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .header-btn:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
            transform: scale(1.05);
        }

        /* Display Dashboard */
        .vb-display {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .vb-percentage {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -1.2px;
            font-family: var(--font-main);
            line-height: 1;
        }

        body[data-theme="dark"] .vb-percentage {
            color: var(--accent) !important;
        }

        .level-badge {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            padding: 5px 10px;
            border-radius: 100px;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .level-badge::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }

        /* Slider */
        .slider-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .vb-slider-track {
            position: relative;
            width: 100%;
            height: 20px;
            display: flex;
            align-items: center;
        }

        .vb-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(148, 163, 184, 0.2);
            border-radius: 100px;
            outline: none;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: all 0.2s ease;
        }

        body[data-theme="light"] .vb-slider {
            background: #E2E8F0;
        }

        .vb-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.15s ease;
            border: 2px solid #FFFFFF;
            box-shadow: none !important;
        }

        body[data-theme="dark"] .vb-slider::-webkit-slider-thumb {
            border-color: #16181D;
        }

        .vb-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        .vb-labels {
            display: flex;
            justify-content: space-between;
            font-size: 9.5px;
            font-weight: 700;
            color: var(--text-secondary);
            font-family: var(--font-main);
            padding: 0 2px;
        }

        /* Preset Buttons Grid */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .vb-preset {
            height: 34px;
            border-radius: 12px !important;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .vb-preset:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        .vb-preset.active {
            background: var(--accent) !important;
            color: #FFFFFF !important;
            border-color: var(--accent) !important;
            box-shadow: none !important;
            font-weight: 800;
        }
    </style>
</head>
<body data-theme="dark">
    <script>
        (function () {
            const t = localStorage.getItem('ocal-settings-theme') || 'dark';
            const a = localStorage.getItem('ocal-settings-accent') || '#15AC49';
            document.body.setAttribute('data-theme', t);
            if (a) {
                document.documentElement.style.setProperty('--accent', a);
                const r = parseInt(a.slice(1,3), 16) || 21;
                const g = parseInt(a.slice(3,5), 16) || 172;
                const b = parseInt(a.slice(5,7), 16) || 73;
                document.documentElement.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.25)`);
                document.documentElement.style.setProperty('--accent-dim', `rgba(${r}, ${g}, ${b}, 0.12)`);
            }
        })();
        if (window.electronAPI && window.electronAPI.onSettingsChanged) {
            window.electronAPI.onSettingsChanged((s) => {
                if (!s) return;
                document.body.setAttribute('data-theme', s.themeMode || 'dark');
                if (s.accentColor) {
                    const a = s.accentColor;
                    document.documentElement.style.setProperty('--accent', a);
                    const r = parseInt(a.slice(1,3), 16) || 21;
                    const g = parseInt(a.slice(3,5), 16) || 172;
                    const b = parseInt(a.slice(5,7), 16) || 73;
                    document.documentElement.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.25)`);
                    document.documentElement.style.setProperty('--accent-dim', `rgba(${r}, ${g}, ${b}, 0.12)`);
                }
            });
        }
    </script>
    <div class="popup-overlay" id="popup-overlay"></div>

    <div class="volume-boost-card" id="vb-card">
        <div class="vb-header">
            <div class="brand-box">
                <div class="vb-icon-badge"><i class="fas fa-volume-high" id="vb-icon"></i></div>
                <span class="vb-title">Volume Booster</span>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="vb-reset-btn" title="Reset Volume"><i class="fas fa-rotate-left"></i></button>
                <button class="header-btn" id="vb-close-btn" title="Close"><i class="fas fa-xmark"></i></button>
            </div>
        </div>

        <div class="vb-display">
            <span class="vb-percentage" id="vb-value">100%</span>
            <span class="level-badge" id="vb-level-text">STANDARD</span>
        </div>

        <div class="slider-section">
            <div class="vb-slider-track">
                <input type="range" class="vb-slider" id="vb-range" min="100" max="500" value="100" step="5">
            </div>
            <div class="vb-labels">
                <span>100%</span>
                <span>200%</span>
                <span>300%</span>
                <span>400%</span>
                <span>500%</span>
            </div>
        </div>

        <div class="preset-grid">
            <button class="vb-preset active" data-preset="100">100%</button>
            <button class="vb-preset" data-preset="150">150%</button>
            <button class="vb-preset" data-preset="200">200%</button>
            <button class="vb-preset" data-preset="350">350%</button>
            <button class="vb-preset" data-preset="500">500%</button>
        </div>
    </div>

    <script src="volume-booster.js"></script>
</body>
</html>
