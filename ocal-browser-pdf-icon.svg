<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E78FB"/>
      <stop offset="100%" stop-color="#2F50D8"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bg)"/>

  <!-- Folded corner flap (drawn first, sits behind the page frame) -->
  <path d="M 562,224 L 672,224 L 672,334 Z" fill="#A8BAF6"/>

  <!-- Document outline as a single thick white frame (outer minus inner), evenodd -->
  <path
    fill-rule="evenodd"
    fill="#FFFFFF"
    d="
      M 380,224
      L 562,224
      L 672,334
      L 672,772
      Q 672,800 644,800
      L 380,800
      Q 352,800 352,772
      L 352,252
      Q 352,224 380,224
      Z

      M 430,288
      L 588,288
      L 608,308
      L 608,722
      Q 608,736 594,736
      L 430,736
      Q 416,736 416,722
      L 416,302
      Q 416,288 430,288
      Z
    "
  />

  <!-- Text lines echoing the meridian motif from the wordmark icon -->
  <line x1="452" y1="430" x2="572" y2="430" stroke="#A8BAF6" stroke-width="26" stroke-linecap="round"/>
  <line x1="452" y1="500" x2="572" y2="500" stroke="#A8BAF6" stroke-width="26" stroke-linecap="round"/>
  <line x1="452" y1="570" x2="572" y2="570" stroke="#A8BAF6" stroke-width="26" stroke-linecap="round"/>
  <line x1="452" y1="640" x2="524" y2="640" stroke="#A8BAF6" stroke-width="26" stroke-linecap="round"/>
</svg>
