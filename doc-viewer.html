<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocal Document & Spreadsheet Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0F1115;
            --panel-bg: #16181D;
            --card-bg: #1D2026;
            --border: rgba(255, 255, 255, 0.1);
            --text: #F3F4F6;
            --text-dim: #9CA3AF;
            --accent: #09f0a0;
            --accent-dim: rgba(9, 240, 160, 0.12);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --mono: "Cascadia Code", "Fira Code", Consolas, monospace;
        }

        body[data-theme="light"] {
            --bg: #F8FAFC;
            --panel-bg: #FFFFFF;
            --card-bg: #F1F5F9;
            --border: rgba(0, 0, 0, 0.08);
            --text: #0F172A;
            --text-dim: #64748B;
            --accent: #059669;
            --accent-dim: rgba(5, 150, 105, 0.12);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top ONLYOFFICE Promo Banner */
        .onlyoffice-banner {
            background: linear-gradient(90deg, rgba(255, 111, 97, 0.15), rgba(255, 154, 60, 0.12));
            border-bottom: 1px solid rgba(255, 111, 97, 0.3);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
            z-index: 100;
        }

        .banner-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .banner-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #FF6F61;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(255, 111, 97, 0.3);
        }

        .banner-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .banner-text strong {
            font-size: 13px;
            font-weight: 800;
            color: var(--text);
        }

        .banner-text span {
            font-size: 11.5px;
            color: var(--text-dim);
        }

        .onlyoffice-btn {
            padding: 8px 16px;
            border-radius: 8px;
            background: #FF6F61;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 111, 97, 0.3);
            flex-shrink: 0;
        }

        .onlyoffice-btn:hover {
            transform: translateY(-1px);
            background: #E05547;
            box-shadow: 0 6px 16px rgba(255, 111, 97, 0.4);
        }

        /* Document Header Toolbar */
        .doc-header {
            height: 52px;
            padding: 0 16px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .doc-title-cluster {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .doc-icon {
            font-size: 18px;
            color: var(--accent);
        }

        .doc-filename {
            font-size: 14px;
            font-weight: 800;
        }

        .doc-meta {
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 100px;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .doc-header-actions {
            display: flex;
            gap: 8px;
        }

        .doc-action-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 12px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .doc-action-btn.primary {
            background: var(--accent);
            color: var(--accent-text, #111111);
            border-color: var(--accent);
        }

        .doc-action-btn:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        /* Editing Formatting Toolbar */
        .editor-formatting-bar {
            padding: 6px 16px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .fmt-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .fmt-btn:hover, .fmt-btn.active {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--border);
        }

        .fmt-divider {
            width: 1px;
            height: 20px;
            background: var(--border);
            margin: 0 4px;
        }

        .fmt-select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            color: var(--text);
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .color-picker-input {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            padding: 0;
        }

        /* Workspace Viewport */
        .doc-viewport {
            flex: 1;
            overflow: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg);
            position: relative;
        }

        /* Document Paper View (Word / Docs) */
        .paper-sheet {
            width: 820px;
            min-height: 1050px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 48px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            outline: none;
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .paper-sheet[contenteditable="true"]:focus {
            border-color: var(--accent);
        }

        .paper-sheet h1 { font-size: 24px; font-weight: 800; margin: 16px 0 8px; }
        .paper-sheet h2 { font-size: 18px; font-weight: 700; margin: 14px 0 6px; }
        .paper-sheet p { margin-bottom: 12px; }

        /* Spreadsheet Grid View (Excel / CSV) */
        .spreadsheet-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .spreadsheet-toolbar-row {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .formula-fx {
            font-weight: 800;
            font-style: italic;
            color: var(--accent);
            font-size: 13px;
        }

        .formula-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 12.5px;
            outline: none;
        }

        .spreadsheet-table-wrap {
            flex: 1;
            overflow: auto;
        }

        .sheet-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
            font-family: var(--font);
        }

        .sheet-table th {
            background: var(--card-bg);
            color: var(--text-dim);
            font-weight: 700;
            padding: 6px 10px;
            border: 1px solid var(--border);
            position: sticky;
            top: 0;
            user-select: none;
        }

        .sheet-table td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            color: var(--text);
            min-width: 100px;
            outline: none;
        }

        .sheet-table td[contenteditable="true"]:focus {
            background: var(--accent-dim);
            border: 2px solid var(--accent);
        }

        /* Bottom Status Bar */
        .doc-footer-status {
            height: 32px;
            padding: 0 16px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        .status-cluster {
            display: flex;
            align-items: center;
            gap: 16px;
        }
    </style>
</head>
<body data-theme="dark">
    <!-- ONLYOFFICE Official Integration Banner -->
    <div class="onlyoffice-banner">
        <div class="banner-cluster">
            <div class="banner-icon"><i class="fas fa-file-contract"></i></div>
            <div class="banner-text">
                <strong>Need Advanced Document & Spreadsheet Editing?</strong>
                <span>Co-authoring, track changes, complex formulas & 100% MS Office compatibility.</span>
            </div>
        </div>
        <a href="https://www.onlyoffice.com" target="_blank" id="onlyoffice-link" class="onlyoffice-btn">
            <i class="fas fa-arrow-up-right-from-square"></i> <span>Explore ONLYOFFICE Docs</span>
        </a>
    </div>

    <!-- Header -->
    <div class="doc-header">
        <div class="doc-title-cluster">
            <i id="doc-type-icon" class="fas fa-file-lines doc-icon"></i>
            <span id="doc-filename" class="doc-filename">Document.docx</span>
            <span id="doc-type-badge" class="doc-meta">DOCX Editor</span>
        </div>
        <div class="doc-header-actions">
            <button id="btn-save-doc" class="doc-action-btn primary"><i class="fas fa-floppy-disk"></i> Save Document</button>
            <button id="btn-print-doc" class="doc-action-btn"><i class="fas fa-print"></i> Print / Export</button>
        </div>
    </div>

    <!-- Formatting Bar -->
    <div class="editor-formatting-bar" id="formatting-bar">
        <select id="fmt-font" class="fmt-select" title="Font Family">
            <option value="Segoe UI">Segoe UI</option>
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Georgia">Georgia</option>
            <option value="Verdana">Verdana</option>
            <option value="Trebuchet MS">Trebuchet MS</option>
        </select>

        <select id="fmt-size" class="fmt-select" title="Font Size">
            <option value="2">10pt (Small)</option>
            <option value="3" selected>12pt (Normal)</option>
            <option value="4">14pt (Medium)</option>
            <option value="5">18pt (Heading 2)</option>
            <option value="6">24pt (Heading 1)</option>
            <option value="7">36pt (Title)</option>
        </select>

        <div class="fmt-divider"></div>

        <button class="fmt-btn" data-cmd="bold" title="Bold (Ctrl+B)"><i class="fas fa-bold"></i></button>
        <button class="fmt-btn" data-cmd="italic" title="Italic (Ctrl+I)"><i class="fas fa-italic"></i></button>
        <button class="fmt-btn" data-cmd="underline" title="Underline (Ctrl+U)"><i class="fas fa-underline"></i></button>
        <button class="fmt-btn" data-cmd="strikeThrough" title="Strikethrough"><i class="fas fa-strikethrough"></i></button>

        <div class="fmt-divider"></div>

        <input type="color" id="fmt-color" class="color-picker-input" value="#F3F4F6" title="Text Color">
        <input type="color" id="fmt-hilite" class="color-picker-input" value="#FFFF00" title="Highlight Color">

        <div class="fmt-divider"></div>

        <button class="fmt-btn" data-cmd="justifyLeft" title="Align Left"><i class="fas fa-align-left"></i></button>
        <button class="fmt-btn" data-cmd="justifyCenter" title="Align Center"><i class="fas fa-align-center"></i></button>
        <button class="fmt-btn" data-cmd="justifyRight" title="Align Right"><i class="fas fa-align-right"></i></button>
        <button class="fmt-btn" data-cmd="justifyFull" title="Justify"><i class="fas fa-align-justify"></i></button>

        <div class="fmt-divider"></div>

        <button class="fmt-btn" data-cmd="insertUnorderedList" title="Bullet List"><i class="fas fa-list-ul"></i></button>
        <button class="fmt-btn" data-cmd="insertOrderedList" title="Numbered List"><i class="fas fa-list-ol"></i></button>
        <button class="fmt-btn" data-cmd="outdent" title="Outdent"><i class="fas fa-outdent"></i></button>
        <button class="fmt-btn" data-cmd="indent" title="Indent"><i class="fas fa-indent"></i></button>

        <div class="fmt-divider"></div>

        <button class="fmt-btn" id="btn-insert-table" title="Insert Table"><i class="fas fa-table"></i></button>
        <button class="fmt-btn" id="btn-insert-hr" title="Insert Line"><i class="fas fa-minus"></i></button>
        <button class="fmt-btn" data-cmd="removeFormat" title="Clear Formatting"><i class="fas fa-eraser"></i></button>
    </div>

    <!-- Main Viewport -->
    <div class="doc-viewport">
        <!-- Word / Document Paper View -->
        <div id="paper-editor" class="paper-sheet" contenteditable="true">
            <p>Loading document content...</p>
        </div>

        <!-- Excel / CSV Spreadsheet View -->
        <div id="spreadsheet-editor" class="spreadsheet-container" style="display: none;">
            <div class="spreadsheet-toolbar-row">
                <span class="formula-fx">fx</span>
                <input type="text" id="formula-bar-input" class="formula-input" placeholder="Cell formula or value...">
                <button id="sheet-add-row" class="doc-action-btn" style="padding: 4px 8px; font-size: 11px;"><i class="fas fa-plus"></i> Add Row</button>
                <button id="sheet-add-col" class="doc-action-btn" style="padding: 4px 8px; font-size: 11px;"><i class="fas fa-plus"></i> Add Column</button>
            </div>
            <div class="spreadsheet-table-wrap">
                <table id="sheet-table" class="sheet-table">
                    <!-- Dynamic Grid -->
                </table>
            </div>
        </div>
    </div>

    <!-- Bottom Status Bar -->
    <div class="doc-footer-status">
        <div class="status-cluster">
            <span id="stat-words"><i class="fas fa-font"></i> Words: 0</span>
            <span id="stat-chars"><i class="fas fa-font-case"></i> Chars: 0</span>
        </div>
        <div class="status-cluster">
            <span>Ocal Document Studio v2.0</span>
        </div>
    </div>

    <script src="doc-viewer.js"></script>
</body>
</html>
