<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' ocal:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; img-src 'self' data: https: blob:; connect-src 'self' https: http:;">
    <title>Tab Suspended | Ocal Browser</title>
    <!-- ANTI-FLASH: Executes immediately before styles parse -->
    <script>
        (function () {
            try {
                const params = new URLSearchParams(window.location.search);
                const themeParam = params.get('theme');
                const t = themeParam || localStorage.getItem('ocal-settings-theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
                if (t === 'dark') {
                    document.documentElement.style.background = '#18181B';
                    document.documentElement.style.colorScheme = 'dark';
                } else {
                    document.documentElement.style.background = '#EDEDF0';
                    document.documentElement.style.colorScheme = 'light';
                }
                const a = localStorage.getItem('ocal-settings-accent') || '#15AC49';
                if (a) {
                    document.documentElement.style.setProperty('--accent', a);
                    document.documentElement.style.setProperty('--accent-glow', `color-mix(in srgb, ${a} 25%, transparent)`);
                    document.documentElement.style.setProperty('--accent-dim', `color-mix(in srgb, ${a} 12%, transparent)`);
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <style>
        :root {
            --canvas-bg: #EDEDF0;
            --card-bg: #FFFFFF;
            --card-border: rgba(0, 0, 0, 0.07);
            --inner-card-bg: #F4F4F6;
            --inner-border: rgba(0, 0, 0, 0.06);
            --text-primary: #111111;
            --text-secondary: #555860;
            --text-muted: #888B94;
            --accent: #15AC49;
            --accent-text: #FFFFFF;
            --accent-glow: rgba(21, 172, 73, 0.25);
            --accent-dim: rgba(21, 172, 73, 0.12);
            --badge-bg: #E4E6EA;
            --badge-text: #111111;
            --kbd-bg: #EAEBED;
            --kbd-border: rgba(0, 0, 0, 0.12);
            --kbd-text: #33363F;
            --card-shadow: 0 20px 48px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.03);
            --hover-bg: rgba(0, 0, 0, 0.04);
        }

        html[data-theme="dark"],
        body[data-theme="dark"] {
            --canvas-bg: #18181B;
            --card-bg: #222226;
            --card-border: rgba(255, 255, 255, 0.08);
            --inner-card-bg: #1A1A1E;
            --inner-border: rgba(255, 255, 255, 0.06);
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            --accent: #09f0a0;
            --accent-text: #111111;
            --accent-glow: rgba(9, 240, 160, 0.28);
            --accent-dim: rgba(9, 240, 160, 0.14);
            --badge-bg: #2C2C32;
            --badge-text: #E5E7EB;
            --kbd-bg: #2A2A30;
            --kbd-border: rgba(255, 255, 255, 0.12);
            --kbd-text: #D1D5DB;
            --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 0 1px rgba(255, 255, 255, 0.12);
            --hover-bg: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--canvas-bg);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 24px;
            cursor: pointer;
        }

        /* ── Ambient Background Mesh & Glow ── */
        .ambient-glow {
            position: absolute;
            width: 540px;
            height: 540px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            filter: blur(40px);
            opacity: 0.6;
            animation: pulse-glow 6s infinite ease-in-out alternate;
        }

        @keyframes pulse-glow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.45; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.75; }
        }

        .ambient-dots {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(120, 120, 130, 0.12) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Top Floating Telemetry Bar ── */
        .top-telemetry-bar {
            position: absolute;
            top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px 16px;
            border-radius: 100px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            z-index: 10;
            font-size: 12px;
            font-weight: 600;
        }

        .brand-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
            font-weight: 800;
            letter-spacing: 0.4px;
        }

        .brand-chip i {
            color: var(--accent);
            font-size: 12px;
        }

        .bar-separator {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.4;
        }

        .status-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
        }

        .status-chip i {
            color: var(--accent);
        }

        .ram-saved-badge {
            background: var(--accent);
            color: var(--accent-text);
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 100px;
            letter-spacing: -0.2px;
        }

        /* ── Main Bento Card ── */
        .suspended-card {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 36px 32px 30px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 22px;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
        }

        .suspended-card:hover {
            transform: translateY(-2px);
        }

        /* ── Sleeping Moon Holographic Orb ── */
        .orb-wrapper {
            position: relative;
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orb-pulse {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0.25;
            animation: orb-ripple 3s infinite ease-out;
        }

        .orb-pulse.delayed {
            animation-delay: 1.5s;
        }

        @keyframes orb-ripple {
            0% { transform: scale(0.85); opacity: 0.35; }
            50% { opacity: 0.15; }
            100% { transform: scale(1.45); opacity: 0; }
        }

        .orb-core {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--accent);
            box-shadow: 0 8px 24px var(--accent-glow);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .suspended-card:hover .orb-core {
            transform: scale(1.06) rotate(-5deg);
        }

        /* ── Typography ── */
        .card-header-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.6px;
            line-height: 1.2;
        }

        .card-desc {
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.55;
            max-width: 420px;
            font-weight: 500;
        }

        /* ── Target Webpage Showcase Tile ── */
        .page-preview-box {
            width: 100%;
            background: var(--inner-card-bg);
            border: 1px solid var(--inner-border);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .page-preview-box:hover {
            border-color: var(--accent);
        }

        .page-favicon-badge {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--card-bg);
            border: 1px solid var(--inner-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .page-favicon-badge img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .page-favicon-badge i {
            font-size: 20px;
            color: var(--accent);
        }

        .page-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .page-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .page-url-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Space Mono', monospace;
        }

        .page-url-row i {
            color: var(--accent);
            font-size: 10px;
        }

        .idle-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            background: var(--card-bg);
            border: 1px solid var(--inner-border);
            padding: 4px 10px;
            border-radius: 100px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .idle-tag i {
            color: var(--accent);
            font-size: 10px;
        }

        /* ── Action Button ── */
        .wake-btn {
            width: 100%;
            height: 50px;
            border-radius: 100px;
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 800;
            letter-spacing: 0.3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 24px var(--accent-glow);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, filter 0.2s ease;
        }

        .wake-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 32px var(--accent-glow);
            filter: brightness(1.05);
        }

        .wake-btn:active {
            transform: scale(0.98);
        }

        .wake-btn i {
            font-size: 16px;
            transition: transform 0.2s ease;
        }

        .wake-btn:hover i {
            transform: scale(1.15) rotate(10deg);
        }

        /* ── Shortcut / Guidance Capsule ── */
        .shortcut-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        kbd {
            font-family: 'Space Mono', monospace;
            font-size: 10.5px;
            font-weight: 700;
            background: var(--kbd-bg);
            border: 1px solid var(--kbd-border);
            color: var(--kbd-text);
            padding: 2px 7px;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* ── Bottom Quick Actions Row ── */
        .quick-actions-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding-top: 8px;
            border-top: 1px solid var(--inner-border);
        }

        .quick-action-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 100px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .quick-action-btn:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
            border-color: var(--inner-border);
        }

        .quick-action-btn i {
            font-size: 12px;
            color: var(--text-muted);
        }

        .quick-action-btn:hover i {
            color: var(--accent);
        }

        /* ── Toast Notification ── */
        .copy-toast {
            position: fixed;
            bottom: 30px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 100px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }

        .copy-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .copy-toast i {
            color: var(--accent);
        }
    </style>
</head>
<body data-theme="light">
    <!-- Ambient Background Elements -->
    <div class="ambient-dots"></div>
    <div class="ambient-glow"></div>

    <!-- Top Telemetry Status Bar -->
    <div class="top-telemetry-bar">
        <div class="brand-chip">
            <i class="fas fa-bolt"></i>
            <span>OCAL</span>
        </div>
        <div class="bar-separator"></div>
        <div class="status-chip">
            <i class="fas fa-moon"></i>
            <span>Sleep Mode</span>
        </div>
        <div class="bar-separator"></div>
        <div class="ram-saved-badge" id="ram-saved-pill">
            <i class="fas fa-microchip"></i> <span id="ram-saved-metric">~148 MB</span> SAVED
        </div>
    </div>

    <!-- Main Suspended Bento Card -->
    <main class="suspended-card" id="suspended-card">
        <!-- Sleeping Moon Holographic Orb -->
        <div class="orb-wrapper">
            <div class="orb-pulse"></div>
            <div class="orb-pulse delayed"></div>
            <div class="orb-core">
                <i class="fas fa-moon"></i>
            </div>
        </div>

        <!-- Title & Subtitle -->
        <div class="card-header-group">
            <h1 class="card-title">Tab Suspended</h1>
            <p class="card-desc">This tab is resting to conserve memory and optimize your browser's speed and battery runtime.</p>
        </div>

        <!-- Target Webpage Preview Showcase Tile -->
        <div class="page-preview-box" id="page-preview-box" title="Click to wake tab">
            <div class="page-favicon-badge" id="favicon-container">
                <i class="fas fa-globe" id="fallback-icon"></i>
                <img id="page-favicon" src="" alt="" style="display: none;">
            </div>
            <div class="page-meta">
                <div class="page-title" id="page-title">Loading Page Info...</div>
                <div class="page-url-row">
                    <i class="fas fa-link"></i>
                    <span id="page-url-display">...</span>
                </div>
            </div>
            <div class="idle-tag" id="idle-tag">
                <i class="far fa-clock"></i>
                <span id="idle-text">10m idle</span>
            </div>
        </div>

        <!-- Main Wake Call-To-Action Button -->
        <button class="wake-btn" id="wake-btn">
            <i class="fas fa-bolt-lightning"></i>
            <span>WAKE UP TAB</span>
        </button>

        <!-- Shortcut Guidance -->
        <div class="shortcut-hint">
            <span>Press <kbd>Space</kbd> or <kbd>Enter</kbd> or click anywhere to wake</span>
        </div>

        <!-- Bottom Quick Actions Row -->
        <div class="quick-actions-row">
            <button class="quick-action-btn" id="copy-url-btn" title="Copy original URL">
                <i class="fas fa-copy"></i>
                <span>Copy Link</span>
            </button>
            <button class="quick-action-btn" id="reload-btn" title="Reload original webpage">
                <i class="fas fa-rotate-right"></i>
                <span>Reload</span>
            </button>
            <button class="quick-action-btn" id="settings-btn" title="Open Performance & Memory Saver settings">
                <i class="fas fa-sliders"></i>
                <span>Settings</span>
            </button>
        </div>
    </main>

    <!-- Copy Toast -->
    <div class="copy-toast" id="copy-toast">
        <i class="fas fa-circle-check"></i>
        <span>Link copied to clipboard!</span>
    </div>

    <script>
        // ── URL Parameter Extraction & Metadata ──
        const urlParams = new URLSearchParams(window.location.search);
        const originalUrl = urlParams.get('url') || '';
        const passedTitle = urlParams.get('title') || '';
        const inactiveMin = urlParams.get('inactive') || '10';

        // Update Inactive Duration Badge
        const idleTextEl = document.getElementById('idle-text');
        if (idleTextEl) {
            idleTextEl.innerText = `${inactiveMin}m idle`;
        }

        // Compute domain and estimate RAM saved
        let domain = '';
        let estimatedRam = 145; // Default ~145 MB

        if (originalUrl) {
            try {
                const parsed = new URL(originalUrl);
                domain = parsed.hostname;
                
                // Realistic dynamic memory estimate based on domain weight
                if (/youtube\.com|netflix\.com|twitch\.tv|vimeo\.com/i.test(domain)) {
                    estimatedRam = Math.floor(260 + (domain.length % 60));
                } else if (/figma\.com|notion\.so|github\.com|canva\.com|docs\.google\.com/i.test(domain)) {
                    estimatedRam = Math.floor(210 + (domain.length % 40));
                } else if (/reddit\.com|twitter\.com|x\.com|facebook\.com|instagram\.com/i.test(domain)) {
                    estimatedRam = Math.floor(180 + (domain.length % 35));
                } else {
                    estimatedRam = Math.floor(125 + (domain.length % 30));
                }
            } catch (e) {
                domain = originalUrl;
            }
        }

        // Update RAM Saved metric
        const ramSavedEl = document.getElementById('ram-saved-metric');
        if (ramSavedEl) {
            ramSavedEl.innerText = `~${estimatedRam} MB`;
        }

        // Populate Target Page Information
        const pageTitleEl = document.getElementById('page-title');
        const pageUrlEl = document.getElementById('page-url-display');
        const faviconImg = document.getElementById('page-favicon');
        const fallbackIcon = document.getElementById('fallback-icon');

        if (pageTitleEl) {
            if (passedTitle) {
                pageTitleEl.innerText = passedTitle;
            } else if (domain) {
                pageTitleEl.innerText = domain;
            } else {
                pageTitleEl.innerText = 'Webpage';
            }
        }

        if (pageUrlEl) {
            pageUrlEl.innerText = originalUrl || 'ocal://home';
        }

        // Load Favicon dynamically
        if (domain && domain.includes('.')) {
            const faviconUrl = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;
            if (faviconImg) {
                faviconImg.src = faviconUrl;
                faviconImg.onload = () => {
                    faviconImg.style.display = 'block';
                    if (fallbackIcon) fallbackIcon.style.display = 'none';
                };
                faviconImg.onerror = () => {
                    faviconImg.style.display = 'none';
                    if (fallbackIcon) fallbackIcon.style.display = 'block';
                };
            }
        }

        // ── Tab Wake / Restore Logic ──
        let isRestoring = false;
        function restore() {
            if (isRestoring) return;
            isRestoring = true;

            const card = document.getElementById('suspended-card');
            if (card) {
                card.style.transform = 'scale(0.96)';
                card.style.opacity = '0.7';
                card.style.transition = 'all 0.18s ease';
            }

            setTimeout(() => {
                if (originalUrl) {
                    window.location.replace(originalUrl);
                } else {
                    window.location.replace('ocal://home');
                }
            }, 60);
        }

        // ── Event Handlers ──
        // 1. Wake Button Click
        const wakeBtn = document.getElementById('wake-btn');
        if (wakeBtn) {
            wakeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                restore();
            });
        }

        // 2. Click anywhere on page to wake
        document.body.addEventListener('click', () => {
            restore();
        });

        // 3. Keyboard shortcut (Space, Enter, Escape)
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter' || e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                restore();
            }
        });

        // 4. Copy URL Button
        const copyUrlBtn = document.getElementById('copy-url-btn');
        const copyToast = document.getElementById('copy-toast');
        if (copyUrlBtn) {
            copyUrlBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (originalUrl) {
                    navigator.clipboard.writeText(originalUrl).then(() => {
                        if (copyToast) {
                            copyToast.classList.add('show');
                            setTimeout(() => copyToast.classList.remove('show'), 2200);
                        }
                    }).catch(() => {});
                }
            });
        }

        // 5. Reload Button
        const reloadBtn = document.getElementById('reload-btn');
        if (reloadBtn) {
            reloadBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                restore();
            });
        }

        // 6. Settings Button
        const settingsBtn = document.getElementById('settings-btn');
        if (settingsBtn) {
            settingsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                window.location.replace('ocal://settings#general');
            });
        }

        // ── Real-time Theme & Accent Synchronization ──
        function syncTheme() {
            try {
                const params = new URLSearchParams(window.location.search);
                const themeParam = params.get('theme');
                const t = themeParam || localStorage.getItem('ocal-settings-theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
                document.body.setAttribute('data-theme', t);

                const a = localStorage.getItem('ocal-settings-accent') || '#15AC49';
                if (a) {
                    document.documentElement.style.setProperty('--accent', a);
                    document.documentElement.style.setProperty('--accent-glow', `color-mix(in srgb, ${a} 28%, transparent)`);
                    document.documentElement.style.setProperty('--accent-dim', `color-mix(in srgb, ${a} 12%, transparent)`);
                    document.body.style.setProperty('--accent', a);
                }
            } catch (e) {}
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'ocal-settings-theme' || e.key === 'ocal-settings-accent') {
                syncTheme();
            }
        });

        syncTheme();
    </script>
</body>
</html>
